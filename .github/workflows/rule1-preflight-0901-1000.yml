name: Rule 1 preflight V2-Q0901-V2-Q1000
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rule1-preflight-0901-1000.yml'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main SQLite state
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Checkout exact staging payloads
        uses: actions/checkout@v4
        with:
          ref: 4f63cb9b0d9861261c343c8f0ae90c49a6b47e50
          path: stage
          fetch-depth: 1
          sparse-checkout: |
            approved_items
            staging_items
          sparse-checkout-cone-mode: false
      - name: Validate complete batch and pinned SQLite state
        shell: bash
        run: |
          python3 - <<'PY'
          import json, sqlite3, subprocess
          from pathlib import Path

          EXPECTED_SOURCE='07e335d471ef1b4689406ba41eb98eaa2ca41472'
          EXPECTED_CANON='2281be0fc4321f808daa3e11b7141742e3ffb7d5'
          EXPECTED_STAGE='4f63cb9b0d9861261c343c8f0ae90c49a6b47e50'
          uids=[f'V2-Q{n:04d}' for n in range(901,1001)]
          gates=[
            'source_authority_verified','currentness_verified','exact_locator_verified','stem_verified',
            'correct_answer_verified','distractors_verified','rationale_verified','educational_objective_verified',
            'ambiguity_verified','second_answer_excluded','cueing_verified','blueprint_verified',
            'independent_qa_passed','no_unresolved_conflict'
          ]
          required=[
            'question_uid','category_id','client_need','difficulty','stem','options','correct_option','rationale',
            'educational_objective','source_organization','source_document_title','source_version_date','source_accessed_date',
            'source_locator','source_url','source_claim_supported','blueprint_source_organization','blueprint_document_title',
            'blueprint_version','blueprint_locator','blueprint_url','blueprint_topic','correction_summary',
            'audit_status','second_pass_status','audit_reviewer','gates','audit_findings'
          ]

          stage_head=subprocess.check_output(['git','-C','stage','rev-parse','HEAD'],text=True).strip()
          if stage_head != EXPECTED_STAGE: raise SystemExit(f'BLOCKED staging commit {stage_head}')
          source_blob=subprocess.check_output(['git','rev-parse','HEAD:NCLEX_COMMERCIAL_MASTER_CURRENT.db'],text=True).strip()
          canon_blob=subprocess.check_output(['git','rev-parse','HEAD:NCLEX_CANONICAL.db'],text=True).strip()
          if source_blob != EXPECTED_SOURCE: raise SystemExit(f'BLOCKED source blob {source_blob}')
          if canon_blob != EXPECTED_CANON: raise SystemExit(f'BLOCKED canonical blob {canon_blob}')

          db_state={}
          for db,expected_count in [('NCLEX_COMMERCIAL_MASTER_CURRENT.db',3525),('NCLEX_CANONICAL.db',900)]:
            con=sqlite3.connect(db)
            integrity=con.execute('PRAGMA integrity_check').fetchone()[0]
            count=con.execute('SELECT COUNT(*) FROM questions').fetchone()[0]
            dup=con.execute('SELECT COUNT(*) FROM (SELECT question_uid,COUNT(*) c FROM questions GROUP BY question_uid HAVING c>1)').fetchone()[0]
            con.close()
            db_state[db]=(integrity,count,dup)
            if integrity!='ok' or count!=expected_count or dup!=0:
              raise SystemExit(f'BLOCKED SQLite state {db}: integrity={integrity} count={count} dup={dup}')

          approved_paths=sorted((Path('stage')/'approved_items').glob('V2-Q*.json'))
          snapshot_paths=sorted((Path('stage')/'staging_items').glob('V2-Q*.json'))
          approved_batch=[p for p in approved_paths if p.stem in set(uids)]
          snapshot_batch=[p for p in snapshot_paths if p.stem in set(uids)]
          if len(approved_batch)!=100 or len(snapshot_batch)!=100:
            raise SystemExit(f'BLOCKED file counts approved={len(approved_batch)} snapshots={len(snapshot_batch)}')

          def file_json(path):
            p=Path('stage')/path
            if not p.is_file(): raise SystemExit(f'BLOCKED missing {path}')
            try: return json.loads(p.read_text(encoding='utf-8'))
            except Exception as e: raise SystemExit(f'BLOCKED invalid JSON {path}: {e}')

          approved=0; snapshots=0; finalqa=0; secondpass=0; gate_ok=0; json_key_ok=0; provenance_ok=0
          for uid in uids:
            a=file_json(f'approved_items/{uid}.json')
            s=file_json(f'staging_items/{uid}.json')
            approved += 1; snapshots += 1
            if a.get('question_uid') != uid or s.get('source_row',{}).get('question_uid') != uid:
              raise SystemExit(f'BLOCKED UID mismatch {uid}')
            miss=[k for k in required if k not in a or a[k] in ('',None)]
            if miss: raise SystemExit(f'BLOCKED {uid} missing approved fields {miss}')
            opts=a.get('options')
            if not isinstance(opts,dict) or sorted(opts)!=['A','B','C','D']:
              raise SystemExit(f'BLOCKED {uid} options malformed')
            if a.get('correct_option') not in opts: raise SystemExit(f'BLOCKED {uid} correct option malformed')
            json_key_ok += 1
            if a['audit_status']!='FINAL_QA_PASS': raise SystemExit(f'BLOCKED {uid} not FINAL_QA_PASS')
            finalqa += 1
            if a['second_pass_status']!='PASS': raise SystemExit(f'BLOCKED {uid} second pass not PASS')
            secondpass += 1
            bad=[g for g in gates if a['gates'].get(g)!=1]
            if bad: raise SystemExit(f'BLOCKED {uid} failed gates {bad}')
            gate_ok += 1
            if s.get('source_blob_expected') != EXPECTED_SOURCE: raise SystemExit(f'BLOCKED {uid} source snapshot blob mismatch')
            if s.get('canonical_blob_expected') != EXPECTED_CANON: raise SystemExit(f'BLOCKED {uid} canonical snapshot blob mismatch')
            provenance_ok += 1

          con=sqlite3.connect('NCLEX_CANONICAL.db')
          marks=','.join('?' for _ in uids)
          existing=[r[0] for r in con.execute(f'SELECT question_uid FROM questions WHERE question_uid IN ({marks})',uids)]
          con.close()
          if existing: raise SystemExit(f'BLOCKED batch UIDs already in canonical: {existing}')

          out={
            'status':'PREFLIGHT_PASS','staging_commit':stage_head,
            'approved_payloads':approved,'source_snapshots':snapshots,
            'final_qa_pass':finalqa,'independent_second_pass':secondpass,
            'all_14_gates':gate_ok,'final_options_and_key_verified':json_key_ok,
            'source_provenance_pins_verified':provenance_ok,
            'canonical_count':900,'canonical_integrity':'ok','canonical_duplicate_uid_groups':0,
            'source_count':3525,'source_integrity':'ok','source_duplicate_uid_groups':0,
            'source_blob':source_blob,'canonical_blob':canon_blob
          }
          print('RULE1_PREFLIGHT='+json.dumps(out,sort_keys=True))
          PY
