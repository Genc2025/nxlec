name: Inspect Batch 006 Metadata

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-batch006-metadata.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Batch 006 builder options
        run: |
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('b6','tools/build_batch006_artifacts.py')
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          bad=[]
          for uid in m.IDS:
              x=m.MANUAL[uid]; o=x['options']; k=x['key']; lens,ratio,dev,unique=m.metrics(o,k)
              ok=ratio<=1.15+1e-12 and dev<=0.10+1e-12 and not unique
              print(f'{uid}|key={k}|lens={lens}|ratio={ratio:.4f}|dev={dev:.4f}|unique={unique}|ok={ok}')
              if not ok: bad.append(uid)
          print('BAD='+','.join(bad))
          print(f'BAD_COUNT={len(bad)}')
          PY
