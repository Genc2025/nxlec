name: USMLE Build Finalizer Q1186-Q1190

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/usmle-build-finalizer-q1186-q1190.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Derive dedicated finalizer with guarded transforms
        run: |
          python - <<'PY'
          import pathlib, subprocess
          base=pathlib.Path('usmle/step2_import_q1181_q1185.py')
          src=base.read_text()
          assert subprocess.check_output(['git','hash-object',str(base)],text=True).strip()=='d7a3f1247c498d7f39ac9b945f176a632b47a973'
          def one(old,new):
              global src
              c=src.count(old)
              if c!=1: raise SystemExit(f'expected one marker, got {c}: {old[:120]}')
              src=src.replace(old,new)
          one("SPEC = ROOT / 'batch_specs_1101_1200' / '10_q1181_q1185.json'", "SPEC = ROOT / 'batch_specs_1101_1200' / '11_q1186_q1190.json'")
          one("PREFLIGHT = AUDIT_DIR / 'PREFLIGHT_Q1181_Q1185.json'", "PREFLIGHT = AUDIT_DIR / 'PREFLIGHT_Q1186_Q1190.json'")
          one("FINAL_AUDIT = AUDIT_DIR / 'STEP2_FINAL_10_10_Q0001_Q1185.json'", "FINAL_AUDIT = AUDIT_DIR / 'STEP2_FINAL_10_10_Q0001_Q1190.json'")
          one("FINAL_STATE = ROOT / 'state' / 'step2_final_q0001_q1185.json'", "FINAL_STATE = ROOT / 'state' / 'step2_final_q0001_q1190.json'")
          one("EXPECTED_PRE_DB_BLOB = 'b9644e7f31a9a4340800db511832da954b6736e6'", "EXPECTED_PRE_DB_BLOB = '05dc982aa4a1c35cccfc233f80cd7826fc22bec9'")
          one("EXPECTED_SPEC_BLOB = 'b3a937efdb331dc6e95484ef432c023d6f1d426c'", "EXPECTED_SPEC_BLOB = '605330a6457e10acae9855fb8556a304d221cf32'")
          one("AUDIT_ID = 'STEP2-FINAL-Q0001-Q1185-20260904'", "AUDIT_ID = 'STEP2-FINAL-Q0001-Q1190-20260904'")
          one("NEW_RANGE = range(1181,1186)", "NEW_RANGE = range(1186,1191)")
          one("KEY_SCHEDULE = {1181:'C',1182:'E',1183:'B',1184:'A',1185:'D'}", "KEY_SCHEDULE = {1186:'D',1187:'A',1188:'E',1189:'C',1190:'B'}")
          for old,new in [
            ('"Respiratory and Renal/Urinary Systems":148,','"Respiratory and Renal/Urinary Systems":149,'),
            ('"Behavioral Health, Nervous Systems and Special Senses":134,','"Behavioral Health, Nervous Systems and Special Senses":135,'),
            ('"Musculoskeletal, Skin and Subcutaneous Tissue":114,','"Musculoskeletal, Skin and Subcutaneous Tissue":115,'),
            ('"Reproductive and Endocrine Systems":155,','"Reproductive and Endocrine Systems":156,'),
            ('"Social Sciences: Communication and Interpersonal Skills":78,','"Social Sciences: Communication and Interpersonal Skills":79,'),
            ('"Medical Knowledge: Applying Foundational Science Concepts":802,','"Medical Knowledge: Applying Foundational Science Concepts":806,'),
            ('"Communication and Interpersonal Skills":79,','"Communication and Interpersonal Skills":80,')
          ]: one(old,new)
          old_disc='''    "Pathology":1,\n    "Physiology":4,\n    "Nutrition":0,\n    "Gross Anatomy & Embryology":0,\n    "Microbiology":0,\n    "Pharmacology":0,\n    "Behavioral Sciences":1,\n    "Biochemistry":2,\n    "Histology & Cell Biology":0,\n    "Immunology":0,\n    "Genetics":4,'''
          new_disc='''    "Pathology":2,\n    "Physiology":3,\n    "Nutrition":0,\n    "Gross Anatomy & Embryology":0,\n    "Microbiology":0,\n    "Pharmacology":0,\n    "Behavioral Sciences":1,\n    "Biochemistry":1,\n    "Histology & Cell Biology":1,\n    "Immunology":0,\n    "Genetics":3,'''
          one(old_disc,new_disc)
          one("int(p.get('authoritative_final_count',-1))!=1180", "int(p.get('authoritative_final_count',-1))!=1185")
          one("int(a.get('authoritative_db_final_count',-1))!=1180", "int(a.get('authoritative_db_final_count',-1))!=1185")
          one("cid=f'S1-DIRECT-{n:04d}-20260904T051000Z'", "cid=f'S1-DIRECT-{n:04d}-20260904T061000Z'")
          one("'step2_audit_id':'STEP2-FINAL-Q1181-Q1185-20260904'", "'step2_audit_id':'STEP2-FINAL-Q1186-Q1190-20260904'")
          one("if len(old_items)!=1180 or len(old_reviews)!=1180:", "if len(old_items)!=1185 or len(old_reviews)!=1185:")
          one("raise SystemExit(f'expected 1180 authoritative finals/reviews, got {len(old_items)}/{len(old_reviews)}')", "raise SystemExit(f'expected 1185 authoritative finals/reviews, got {len(old_items)}/{len(old_reviews)}')")
          one("qnum(c['candidate_id'])<=1180", "qnum(c['candidate_id'])<=1185")
          one("set(range(1,1181))", "__PRE_CONTIG_RANGE__")
          one("set(range(1,1186))", "__POST_CONTIG_RANGE__")
          src=src.replace('__PRE_CONTIG_RANGE__',"set(range(1,1186))")
          src=src.replace('__POST_CONTIG_RANGE__',"set(range(1,1191))")
          one("(AUDIT_ID,1185,key_hash,aggregate_review_hash,FINAL_AT)", "(AUDIT_ID,1190,key_hash,aggregate_review_hash,FINAL_AT)")
          one("if len(items)!=1185 or len(revs)!=1185:", "if len(items)!=1190 or len(revs)!=1190:")
          one("raise SystemExit('Q1181-Q1185 exact-once failure')", "raise SystemExit('Q1186-Q1190 exact-once failure')")
          one("if reread!=1185 or new!=5:", "if reread!=1190 or new!=5:")
          one("if not fin or fin[0]!=AUDIT_ID or fin[1]!=1185:", "if not fin or fin[0]!=AUDIT_ID or fin[1]!=1190:")
          one("'item_count':1185,", "'item_count':1190,")
          one("'step2_final_review_count':1185,", "'step2_final_review_count':1190,")
          one("'range':'Q1181-Q1185',", "'range':'Q1186-Q1190',")
          one("'reread_verified_count':1185,", "'reread_verified_count':1190,")
          one("'q1181_q1185_present_exactly_once':True,", "'q1186_q1190_present_exactly_once':True,")
          one("'contiguous_q0001_q1185':True,", "'contiguous_q0001_q1190':True,")
          forbidden=['10_q1181_q1185.json','PREFLIGHT_Q1181_Q1185.json','Q0001_Q1185','q0001_q1185',"<=1180","len(old_items)!=1180","reread!=1185","fin[1]!=1185","Q1181-Q1185 exact-once"]
          for marker in forbidden:
              if marker in src: raise SystemExit('stale marker remains: '+marker)
          required=[
            "EXPECTED_PRE_DB_BLOB = '05dc982aa4a1c35cccfc233f80cd7826fc22bec9'",
            "EXPECTED_SPEC_BLOB = '605330a6457e10acae9855fb8556a304d221cf32'",
            "NEW_RANGE = range(1186,1191)",
            "KEY_SCHEDULE = {1186:'D',1187:'A',1188:'E',1189:'C',1190:'B'}",
            "if len(old_items)!=1185 or len(old_reviews)!=1185:",
            "if len(items)!=1190 or len(revs)!=1190:",
            "set(range(1,1186))","set(range(1,1191))",
            "'item_count':1190,","'step2_final_review_count':1190,","'contiguous_q0001_q1190':True,"
          ]
          for marker in required:
              if marker not in src: raise SystemExit('required marker missing: '+marker)
          pathlib.Path('usmle/step2_import_q1186_q1190.py').write_text(src)
          PY
      - name: Compile and static inspect
        run: |
          python -m py_compile usmle/step2_import_q1186_q1190.py
          grep -F "EXPECTED_PRE_DB_BLOB = '05dc982aa4a1c35cccfc233f80cd7826fc22bec9'" usmle/step2_import_q1186_q1190.py
          grep -F "EXPECTED_SPEC_BLOB = '605330a6457e10acae9855fb8556a304d221cf32'" usmle/step2_import_q1186_q1190.py
          grep -F "NEW_RANGE = range(1186,1191)" usmle/step2_import_q1186_q1190.py
          grep -F "KEY_SCHEDULE = {1186:'D',1187:'A',1188:'E',1189:'C',1190:'B'}" usmle/step2_import_q1186_q1190.py
      - name: Persist dedicated finalizer
        run: |
          git config user.name 'USMLE Finalizer Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add usmle/step2_import_q1186_q1190.py
          git commit -m 'Add strict USMLE Q1186-Q1190 finalizer'
          git pull --rebase origin main
          git push origin HEAD:main
