name: USMLE Full Canonical Remediation Phase1B
on:
  push:
    paths:
      - '.github/workflows/usmle-full-canonical-remediation-phase1b.yml'
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      EXPECTED_COUNT: '1535'
      DB_BLOB: a3f28fcfd0a89161ed003e60d0d797c5fa103f1a
      MAX_WORKERS: '16'
      REMEDIATION_OUT: usmle/audit/FULL_CANONICAL_Q0001_Q1535_REMEDIATION_PHASE1B.json
    steps:
      - uses: actions/checkout@v6
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Bind and compile
        run: |
          set -euo pipefail
          test "$(git hash-object usmle/data/usmle-step1.db)" = "$DB_BLOB"
          python -m py_compile usmle/remediate_full_canonical_phase1b.py
      - name: Run strict detached remediation
        run: |
          set -euo pipefail
          B="$(git hash-object usmle/data/usmle-step1.db)"
          python usmle/remediate_full_canonical_phase1b.py
          A="$(git hash-object usmle/data/usmle-step1.db)"
          test "$A" = "$B"; test "$A" = "$DB_BLOB"
      - name: Persist report only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$REMEDIATION_OUT"
          git commit -m 'usmle: report strict full canonical phase1b remediation'
          git pull --rebase origin main
          git push
