name: Build NCLEX commercial master

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tools/build_nclex_master.py"
      - "tools/enforce_commercial_gate.py"
      - "tools/export_pending_audit.py"
      - "data/clinical_overrides_*.json"
      - "data/clinical_overrides_*.b64"
      - "nclex ngn bank 75of75 ALL7formats FINAL.db"
      - "nclex question bank v2 inprogress 5.db"
      - ".github/workflows/build-nclex-master.yml"

permissions:
  contents: write

jobs:
  build-master:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decode staged override payloads
        run: |
          # Readable JSON is authoritative. Decode a staging payload only when the
          # corresponding JSON file does not already exist.
          shopt -s nullglob
          for file in data/clinical_overrides_*.b64; do
            json_file="${file%.b64}.json"
            if [[ -f "$json_file" ]]; then
              echo "Keeping existing $json_file; skipping $file"
              continue
            fi
            echo "Decoding $file"
            if ! base64 --decode "$file" > "$json_file"; then
              echo "INVALID_BASE64_FILE=$file"
              exit 1
            fi
          done

      - name: Build master database
        run: python tools/build_nclex_master.py

      - name: Enforce commercial hard gate
        run: python tools/enforce_commercial_gate.py

      - name: Export next pending audit range
        run: python tools/export_pending_audit.py

      - name: Verify master database
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          db = Path("NCLEX_COMMERCIAL_MASTER_CURRENT.db")
          if not db.exists():
              raise SystemExit("Master database was not created")

          con = sqlite3.connect(db)
          integrity = con.execute("PRAGMA integrity_check").fetchone()[0]
          total = con.execute("SELECT COUNT(*) FROM questions").fetchone()[0]
          verified = con.execute("SELECT COUNT(*) FROM questions WHERE clinical_qa_status LIKE 'SOURCE_VERIFIED_2026_%'").fetchone()[0]
          ready = con.execute("SELECT COUNT(*) FROM questions WHERE commercial_release_ready=1").fetchone()[0]
          gate = con.execute("SELECT value FROM bank_metadata WHERE key='commercial_release_gate'").fetchone()
          con.close()

          assert integrity == "ok", integrity
          assert total == 3525, total
          assert verified >= 30, verified
          assert ready == 0, ready
          assert gate is not None, "Missing commercial release gate metadata"
          assert gate[0] == "CLOSED_PENDING_FULL_BANK_CLINICAL_CURRENTNESS_SOURCE_LICENSING_AND_RELEASE_QA", gate[0]
          print(f"Verified: integrity={integrity}, total={total}, verified={verified}, ready={ready}, gate={gate[0]}")
          PY

      - name: Commit generated master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NCLEX_COMMERCIAL_MASTER_CURRENT.db NCLEX_COMMERCIAL_MASTER_CURRENT_AUDIT.md data/pending_audit_next.json data/clinical_overrides_*.json
          if git diff --cached --quiet; then
            echo "Master is already current"
          else
            git commit -m "Build current NCLEX commercial master [skip ci]"
            git push
          fi
