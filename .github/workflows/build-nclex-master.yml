name: Build NCLEX commercial master

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - final-qa-wave25-10of10
    paths:
      - "tools/build_nclex_master.py"
      - "tools/enforce_commercial_gate.py"
      - "tools/enforce_strict_question_gate.py"
      - "tools/verify_canonical_master.py"
      - "tools/apply_wave25_final_gate.py"
      - "tools/apply_batch001_final_gate.py"
      - "tools/apply_batch002_rule1_final_gate.py"
      - "tools/apply_batch003_rule1_final_gate.py"
      - "tools/apply_batch004_rule1_final_gate.py"
      - "tools/verify_batch004_rule1_round2.py"
      - "tools/apply_batch005_chronological_rule1_final_gate.py"
      - "tools/apply_batch005_rule1_final_gate.py"
      - "tools/apply_batch006_rule1_final_gate.py"
      - "tools/apply_wave26_option_balance.py"
      - "tools/apply_wave26_manual_final_gate.py"
      - "tools/apply_wave27_manual_final_gate.py"
      - "tools/rebuild_wave27_manifest.py"
      - "tools/report_wave26_option_metrics.py"
      - "tools/export_pending_audit.py"
      - "data/clinical_overrides_*.json"
      - "data/clinical_overrides_*.b64"
      - "data/clinical_overrides_*.json.gz.b64"
      - "data/rule1_manual_audit_batch002_q0051_q0100.json"
      - "data/rule1_manual_audit_batch003_q0101_q0150.json"
      - "data/rule1_batch004_*.json"
      - "data/rule1_batch005_*.json"
      - "data/rule1_batch006_*.json"
      - "data/manual_final_qa_wave26_0532_0581.json"
      - "data/manual_final_qa_wave27_0582_0631.json"
      - "data/manual_option_balance_wave26*.json"
      - "nclex ngn bank 75of75 ALL7formats FINAL.db"
      - "nclex question bank v2 inprogress 5.db"
      - ".github/workflows/build-nclex-master.yml"

permissions:
  contents: write

jobs:
  build-master:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decode staged override payloads
        run: |
          shopt -s nullglob
          for file in data/clinical_overrides_*.json.gz.b64; do
            json_file="${file%.gz.b64}"
            if [[ -f "$json_file" ]]; then
              echo "Keeping existing $json_file; skipping $file"
              continue
            fi
            base64 --decode "$file" | gzip -dc > "$json_file"
          done
          for file in data/clinical_overrides_*.b64; do
            [[ "$file" == *.json.gz.b64 ]] && continue
            json_file="${file%.b64}.json"
            if [[ -f "$json_file" ]]; then
              echo "Keeping existing $json_file; skipping $file"
              continue
            fi
            base64 --decode "$file" > "$json_file"
          done

      - name: Rebuild Wave 27 manual QA manifest
        run: python tools/rebuild_wave27_manifest.py

      - name: Build master database
        run: python tools/build_nclex_master.py

      - name: Enforce full-bank commercial hard gate
        run: python tools/enforce_commercial_gate.py

      - name: Enforce strict 11-dimension governance baseline
        run: python tools/enforce_strict_question_gate.py

      - name: Apply Wave 26 manually authored option balance
        run: python tools/apply_wave26_option_balance.py

      - name: Report Wave 26 option diagnostics
        run: python tools/report_wave26_option_metrics.py

      - name: Apply Rule 1 Batch 001 Q0001-Q0050
        run: python tools/apply_batch001_final_gate.py

      - name: Apply Rule 1 Batch 002 Q0051-Q0100
        run: python tools/apply_batch002_rule1_final_gate.py

      - name: Apply Rule 1 Batch 003 Q0101-Q0150
        run: python tools/apply_batch003_rule1_final_gate.py

      - name: Apply Rule 1 Batch 004 Q0151-Q0200
        run: python tools/apply_batch004_rule1_final_gate.py

      - name: Verify Rule 1 Batch 004 fresh round2
        run: python tools/verify_batch004_rule1_round2.py

      - name: Apply chronological Rule 1 Batch 005 Q0201-Q0250
        run: python tools/apply_batch005_chronological_rule1_final_gate.py

      - name: Apply off-sequence audited set Q0782-Q0831
        run: python tools/apply_batch005_rule1_final_gate.py

      - name: Apply off-sequence audited set Q0832-Q0881
        run: python tools/apply_batch006_rule1_final_gate.py

      - name: Apply Wave 25 strict final QA gate
        run: python tools/apply_wave25_final_gate.py

      - name: Apply Wave 26 manual final QA gate
        run: python tools/apply_wave26_manual_final_gate.py

      - name: Apply Wave 27 manual final QA gate
        run: python tools/apply_wave27_manual_final_gate.py

      - name: Export next chronological pending audit
        run: python tools/export_pending_audit.py

      - name: Verify master database and chronological Rule 1 coverage
        run: python tools/verify_canonical_master.py

      - name: Commit generated master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NCLEX_COMMERCIAL_MASTER_CURRENT.db NCLEX_COMMERCIAL_MASTER_CURRENT_AUDIT.md FINAL_QA_BATCH001_Q0001_Q0050_10OF10.md FINAL_QA_BATCH002_Q0051_Q0100_RULE1_10OF10.md FINAL_QA_BATCH003_Q0101_Q0150_RULE1_10OF10.md FINAL_QA_BATCH004_Q0151_Q0200_RULE1_10OF10.md FINAL_QA_BATCH004_ROUND2_20260815.md FINAL_QA_BATCH005_Q0201_Q0250_RULE1_10OF10.md FINAL_QA_BATCH005_Q0782_Q0831_RULE1_10OF10.md FINAL_QA_BATCH006_Q0832_Q0881_RULE1_10OF10.md FINAL_QA_WAVE25_Q0492_Q0531_10OF10.md FINAL_QA_WAVE26_Q0532_Q0581_MANUAL_10OF10.md FINAL_QA_WAVE27_Q0582_Q0631_MANUAL_10OF10.md data/pending_audit_next.json data/clinical_overrides_*.json data/rule1_manual_audit_batch002_q0051_q0100.json data/rule1_manual_audit_batch003_q0101_q0150.json data/rule1_batch004_*.json data/rule1_batch005_*.json data/rule1_batch006_*.json data/manual_final_qa_wave26_0532_0581.json data/manual_final_qa_wave27_0582_0631.json data/manual_option_balance_wave26*.json
          if git diff --cached --quiet; then
            echo "Master is already current"
          else
            git commit -m "Build current NCLEX commercial master with chronological Rule 1 Batch 005 [skip ci]"
            git push
          fi
