name: Build NCLEX commercial master

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - final-qa-wave25-10of10
    paths:
      - "tools/build_nclex_master.py"
      - "tools/enforce_commercial_gate.py"
      - "tools/enforce_strict_question_gate.py"
      - "tools/apply_wave25_final_gate.py"
      - "tools/apply_batch001_final_gate.py"
      - "tools/export_pending_audit.py"
      - "data/clinical_overrides_*.json"
      - "data/clinical_overrides_*.b64"
      - "nclex ngn bank 75of75 ALL7formats FINAL.db"
      - "nclex question bank v2 inprogress 5.db"
      - ".github/workflows/build-nclex-master.yml"

permissions:
  contents: write

jobs:
  build-master:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decode staged override payloads
        run: |
          shopt -s nullglob
          for file in data/clinical_overrides_*.b64; do
            json_file="${file%.b64}.json"
            if [[ -f "$json_file" ]]; then
              echo "Keeping existing $json_file; skipping $file"
              continue
            fi
            echo "Decoding $file"
            if ! base64 --decode "$file" > "$json_file"; then
              echo "INVALID_BASE64_FILE=$file"
              exit 1
            fi
          done

      - name: Build master database
        run: python tools/build_nclex_master.py

      - name: Enforce full-bank commercial hard gate
        run: python tools/enforce_commercial_gate.py

      - name: Enforce strict 11-dimension governance on all verified questions
        run: python tools/enforce_strict_question_gate.py

      - name: Apply Q0001-Q0050 strict final QA gate
        run: python tools/apply_batch001_final_gate.py

      - name: Apply Wave 25 strict final QA gate
        run: python tools/apply_wave25_final_gate.py

      - name: Export next pending audit range
        run: python tools/export_pending_audit.py

      - name: Verify master database and strict final-gate coverage
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db=Path("NCLEX_COMMERCIAL_MASTER_CURRENT.db")
          if not db.exists(): raise SystemExit("Master database was not created")
          con=sqlite3.connect(db)
          integrity=con.execute("PRAGMA integrity_check").fetchone()[0]
          total=con.execute("SELECT COUNT(*) FROM questions").fetchone()[0]
          verified=con.execute("SELECT COUNT(*) FROM questions WHERE clinical_qa_status LIKE 'SOURCE_VERIFIED_2026_%'").fetchone()[0]
          ready=con.execute("SELECT COUNT(*) FROM questions WHERE commercial_release_ready=1").fetchone()[0]
          gate=con.execute("SELECT value FROM bank_metadata WHERE key='commercial_release_gate'").fetchone()
          policy=con.execute("SELECT value FROM bank_metadata WHERE key='strict_final_gate_policy'").fetchone()
          batch1=con.execute("SELECT value FROM bank_metadata WHERE key='batch001_q0001_q0050_final_gate'").fetchone()
          wave=con.execute("SELECT value FROM bank_metadata WHERE key='wave25_q0492_q0531_final_gate'").fetchone()
          records=con.execute("SELECT COUNT(*) FROM question_final_gate WHERE question_uid IN (SELECT question_uid FROM questions WHERE clinical_qa_status LIKE 'SOURCE_VERIFIED_2026_%')").fetchone()[0]
          passed=con.execute("SELECT COUNT(*) FROM question_final_gate WHERE final_status='FINAL_QA_PASS'").fetchone()[0]
          pending=con.execute("SELECT COUNT(*) FROM question_final_gate WHERE final_status='FINAL_QA_PENDING'").fetchone()[0]
          batch1_passed=con.execute("SELECT COUNT(*) FROM question_final_gate WHERE question_uid BETWEEN 'V2-Q0001' AND 'V2-Q0050' AND final_status='FINAL_QA_PASS'").fetchone()[0]
          wave_passed=con.execute("SELECT COUNT(*) FROM question_final_gate WHERE question_uid BETWEEN 'V2-Q0492' AND 'V2-Q0531' AND final_status='FINAL_QA_PASS'").fetchone()[0]
          con.close()
          assert integrity=='ok',integrity
          assert total==3525,total
          assert verified>=531,verified
          assert ready==0,ready
          assert gate and gate[0]=='CLOSED_PENDING_FULL_BANK_CLINICAL_CURRENTNESS_SOURCE_LICENSING_AND_RELEASE_QA',gate
          assert policy and policy[0]=='REQUIRED_11_DIMENSIONS_FOR_EVERY_QUESTION',policy
          assert records==verified,(records,verified)
          assert passed+pending==records,(passed,pending,records)
          assert batch1 and batch1[0]=='PASS_50_OF_50_2026_08_14',batch1
          assert batch1_passed==50,batch1_passed
          assert wave and wave[0]=='PASS_40_OF_40_2026_08_14',wave
          assert wave_passed==40,wave_passed
          print(f"Verified: integrity={integrity}, total={total}, verified={verified}, strict_records={records}, final_pass={passed}, final_pending={pending}, batch1_final={batch1_passed}/50, wave25_final={wave_passed}/40, full_bank_ready={ready}")
          PY

      - name: Commit generated master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NCLEX_COMMERCIAL_MASTER_CURRENT.db NCLEX_COMMERCIAL_MASTER_CURRENT_AUDIT.md FINAL_QA_BATCH001_Q0001_Q0050_10OF10.md FINAL_QA_WAVE25_Q0492_Q0531_10OF10.md data/pending_audit_next.json data/clinical_overrides_*.json
          if git diff --cached --quiet; then
            echo "Master is already current"
          else
            git commit -m "Build current NCLEX commercial master with batch001 final QA [skip ci]"
            git push
          fi
