name: USMLE Author Q1281-Q1290

on:
  push:
    branches: [main]
    paths:
      - 'usmle/audit/AUTHOR_TRIGGER_Q1281_Q1290'

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify exact Q1280 canonical pre-state
        run: |
          set -euo pipefail
          test "$(git hash-object usmle/data/usmle-step1.db)" = "c6d3a9df9c8887b6ff3f3dbac6c710ed564bb4ed"
          python - <<'PY'
          import json
          s=json.load(open('usmle/state/step2_final_q0001_q1280.json'))
          assert s['final_status']=='FINAL_10_10_PASS' and s['item_count']==1280 and s['step2_final_review_count']==1280
          assert s['contiguous_q0001_q1280'] is True and s['post_authoritative_db_blob']=='c6d3a9df9c8887b6ff3f3dbac6c710ed564bb4ed'
          PY
      - name: Generate candidate from source of truth
        run: |
          set -euo pipefail
          python -m py_compile usmle/author_q1281_q1290.py usmle/verify_author_q1281_q1290.py
          python usmle/author_q1281_q1290.py
      - name: Full independent author verification from zero
        run: |
          set -euo pipefail
          python usmle/verify_author_q1281_q1290.py
      - name: Persist frozen candidate only
        run: |
          set -euo pipefail
          git config user.name 'USMLE Author QA'
          git config user.email 'actions@users.noreply.github.com'
          git add usmle/batch_specs_1201_1300/11_q1281_q1290_author_20260906.json
          git diff --cached --quiet && { echo 'No candidate change generated'; exit 1; }
          git commit -m 'USMLE: author and verify Q1281-Q1290'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Verify persisted candidate and untouched canonical DB
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          test "$(git hash-object usmle/data/usmle-step1.db)" = "c6d3a9df9c8887b6ff3f3dbac6c710ed564bb4ed"
          python usmle/verify_author_q1281_q1290.py
          echo "CANDIDATE_PERSISTED=PASS BLOB=$(git hash-object usmle/batch_specs_1201_1300/11_q1281_q1290_author_20260906.json) DB_UNTOUCHED=PASS"
