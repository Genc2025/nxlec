name: USMLE Repair Q1191-Q1215 Competency Constant

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/usmle-repair-q1191-q1215-competency-constant.yml'

permissions:
  contents: write

concurrency:
  group: usmle-repair-q1191-q1215-competency-constant
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Repair stale expected competency totals without changing item metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,re,json
          files=[
            pathlib.Path('usmle/step2_import_q1191_q1215.py'),
            pathlib.Path('.github/workflows/usmle-step2-import-q1191-q1215.yml'),
          ]
          report={}
          for p in files:
            s=p.read_text()
            before=s
            mk_old=len(re.findall(r"'Medical Knowledge: Applying Foundational Science Concepts'\s*:\s*820",s))
            pc_old=len(re.findall(r"'Patient Care: Diagnosis, including history and physical examination'\s*:\s*244",s))
            assert mk_old>=1 and pc_old>=1,(str(p),mk_old,pc_old)
            s=re.sub(r"('Medical Knowledge: Applying Foundational Science Concepts'\s*:\s*)820",r"\g<1>821",s)
            s=re.sub(r"('Patient Care: Diagnosis, including history and physical examination'\s*:\s*)244",r"\g<1>243",s)
            assert not re.search(r"'Medical Knowledge: Applying Foundational Science Concepts'\s*:\s*820",s)
            assert not re.search(r"'Patient Care: Diagnosis, including history and physical examination'\s*:\s*244",s)
            assert len(re.findall(r"'Medical Knowledge: Applying Foundational Science Concepts'\s*:\s*821",s))>=mk_old
            assert len(re.findall(r"'Patient Care: Diagnosis, including history and physical examination'\s*:\s*243",s))>=pc_old
            p.write_text(s)
            report[str(p)]={'mk_replacements':mk_old,'pc_replacements':pc_old,'changed':s!=before}
          print(json.dumps({'status':'PASS','evidence':'baseline 806/238/66/80 + staged 15/5/0/5 = final 821/243/66/85; Q1203 audit confirms Medical Knowledge classification','files':report},indent=2))
          PY
          python -m py_compile usmle/step2_import_q1191_q1215.py
      - name: Persist repaired constants
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'USMLE QA Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add usmle/step2_import_q1191_q1215.py .github/workflows/usmle-step2-import-q1191-q1215.yml
          git commit -m 'Repair Q1191-Q1215 competency totals to audited metadata'
          git pull --rebase origin main
          git push origin HEAD:main
