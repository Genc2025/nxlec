name: List Batch 006 sources
on:
  push:
    branches: [main]
    paths: ['.github/workflows/list-batch006-sources.yml']
permissions:
  contents: read
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import sqlite3
          con=sqlite3.connect('NCLEX_COMMERCIAL_MASTER_CURRENT.db')
          for r in con.execute("SELECT question_uid,category_id,client_need,difficulty,source_name,source_url,source_detail FROM questions WHERE question_uid BETWEEN 'V2-Q0251' AND 'V2-Q0300' ORDER BY question_uid"):
            print('SRC\t'+'\t'.join(str(x).replace('\n',' ') for x in r))
          con.close()
          PY
