name: Patch Batch 006 blueprint integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-batch006-blueprint-q292.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch authored builder and gate
        run: |
          python - <<'PY'
          from pathlib import Path

          bp=Path('tools/build_batch006_chronological_rule1_artifacts.py')
          s=bp.read_text()
          s=s.replace('SUBSTANTIVE = {"V2-Q0251", "V2-Q0271", "V2-Q0274", "V2-Q0279", "V2-Q0282", "V2-Q0287"}',
                      'SUBSTANTIVE = {"V2-Q0251", "V2-Q0271", "V2-Q0274", "V2-Q0279", "V2-Q0282", "V2-Q0287", "V2-Q0292"}')
          end='''"rationale":"The American Heart Association lists an infant resting heart rate averaging about 100–190 beats/min. Therefore 140 beats/min is within the expected infant resting range, while 80 is below and 205 or 230 are above that range. The stem was corrected from a nonspecific ‘quiet newborn’ description to an awake, calm infant so normal sleep-related slowing does not create a second defensible answer."\n},\n}'''
          repl='''"rationale":"The American Heart Association lists an infant resting heart rate averaging about 100–190 beats/min. Therefore 140 beats/min is within the expected infant resting range, while 80 is below and 205 or 230 are above that range. The stem was corrected from a nonspecific ‘quiet newborn’ description to an awake, calm infant so normal sleep-related slowing does not create a second defensible answer."\n},\n292:{"category_id":4,"client_need":"Health Promotion and Maintenance"},\n}'''
          if end not in s:
              raise SystemExit('builder corrected-block tail missing')
          s=s.replace(end,repl)
          s=s.replace('corrections={len(SUBSTANTIVE)}/6 secondary=', 'corrections={len(SUBSTANTIVE)}/7 secondary=')
          bp.write_text(s)

          gp=Path('tools/apply_batch006_chronological_rule1_final_gate.py')
          g=gp.read_text()
          g=g.replace('SUBSTANTIVE={"V2-Q0251","V2-Q0271","V2-Q0274","V2-Q0279","V2-Q0282","V2-Q0287"}',
                      'SUBSTANTIVE={"V2-Q0251","V2-Q0271","V2-Q0274","V2-Q0279","V2-Q0282","V2-Q0287","V2-Q0292"}\nBLUEPRINT_PATCH={"V2-Q0271","V2-Q0274","V2-Q0292"}')
          g=g.replace('"V2-Q0287":("awake, calm term newborn","205 beats/min"),\n}',
                      '"V2-Q0287":("awake, calm term newborn","205 beats/min"),\n"V2-Q0292":("american academy of pediatrics","umbilical cord"),\n}')
          old='''        q=con.execute("SELECT * FROM questions WHERE question_uid=?",(uid,)).fetchone()\n        if q is None: failures.append(f"{uid}: missing DB row"); continue'''
          new='''        if uid in BLUEPRINT_PATCH:\n            con.execute("UPDATE questions SET category_id=?,client_need=?,difficulty=? WHERE question_uid=?",(e["category_id"],e["client_need"],e["difficulty"],uid))\n        q=con.execute("SELECT * FROM questions WHERE question_uid=?",(uid,)).fetchone()\n        if q is None: failures.append(f"{uid}: missing DB row"); continue'''
          if old not in g:
              raise SystemExit('gate DB-row marker missing')
          g=g.replace(old,new)
          g=g.replace('(option_ok,corrections,secondary,ncsbn_ok,source_ok)!=(50,6,2,50,50)', '(option_ok,corrections,secondary,ncsbn_ok,source_ok)!=(50,7,2,50,50)')
          g=g.replace('corrections={corrections}/6 secondary=', 'corrections={corrections}/7 secondary=')
          g=g.replace('**Q0251, Q0271, Q0274, Q0279, Q0282, Q0287**', '**Q0251, Q0271, Q0274, Q0279, Q0282, Q0287, Q0292**')
          gp.write_text(g)
          PY
          python -m py_compile tools/build_batch006_chronological_rule1_artifacts.py tools/apply_batch006_chronological_rule1_final_gate.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/build_batch006_chronological_rule1_artifacts.py tools/apply_batch006_chronological_rule1_final_gate.py
          git commit -m 'Integrate NCSBN Batch 006 blueprint corrections Q0271 Q0274 Q0292 [skip ci]'
          git push
