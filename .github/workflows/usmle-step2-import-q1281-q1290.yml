name: USMLE Step2 Import Q1281-Q1290

on:
  push:
    branches: [main]
    paths:
      - 'usmle/audit/STEP2_IMPORT_TRIGGER_Q1281_Q1290'

permissions:
  contents: write

concurrency:
  group: usmle-step2-canonical-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify exact production preconditions
        run: |
          set -euo pipefail
          test "$(git hash-object usmle/data/usmle-step1.db)" = "c6d3a9df9c8887b6ff3f3dbac6c710ed564bb4ed"
          test "$(git hash-object usmle/step2_import_q1281_q1290.py)" = "fbbfeb7896b28ac03f26329a8e8f4e35de5bcb12"
          test "$(git hash-object usmle/step2_import_q1261_q1270.py)" = "c73f192deb88d6703845a8976e10dbd05d8e34fb"
          test "$(git hash-object usmle/batch_specs_1201_1300/11_q1281_q1290_author_20260906.json)" = "fdda09072509425b0321aafbe921aa95fed53aee"
          test "$(git hash-object usmle/audit/Q1281_Q1290_FINAL_QA_PASS.json)" = "96f83602bf0fe923355e6d337de08dadaf366f1d"
          python - <<'PY'
          import json,pathlib,sqlite3
          s=json.load(open('usmle/state/step2_final_q0001_q1280.json'))
          m=json.load(open('usmle/audit/Q1281_Q1290_FINAL_QA_PASS.json'))
          assert s['final_status']=='FINAL_10_10_PASS' and s['item_count']==1280 and s['step2_final_review_count']==1280
          assert s['contiguous_q0001_q1280'] is True and s['post_authoritative_db_blob']=='c6d3a9df9c8887b6ff3f3dbac6c710ed564bb4ed'
          assert m['status']=='FINAL_QA_PASS' and m['final_qa_verdict']=='FINAL_QA_PASS_NO_MATERIAL_DEFECT'
          assert m['production_import_ready'] is True and m['production_db_modified'] is False
          assert m['candidate_batch_blob']=='fdda09072509425b0321aafbe921aa95fed53aee'
          assert m['answer_key_sequence']=='BDACECAEDB' and m['answer_key_distribution']=={'A':2,'B':2,'C':2,'D':2,'E':2}
          assert m['system_distribution']=={'Reproductive & Endocrine Systems':5,'Respiratory & Renal/Urinary Systems':5}
          assert m['competency_distribution']=={'Patient Care: Diagnosis':5,'Medical Knowledge: Applying Foundational Science Concepts':5}
          assert m['unresolved_defects']==[] and m['suggested_changes']==[] and m['all_items_final_10_10_pass'] is True
          con=sqlite3.connect(pathlib.Path('usmle/data/usmle-step1.db').resolve().as_uri()+'?mode=ro&immutable=1',uri=True)
          assert con.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert con.execute("select count(*) from step2_final_items where final_status='FINAL_10_10_PASS'").fetchone()[0]==1280
          assert con.execute("select count(*) from step2_final_reviews where final_status='FINAL_10_10_PASS'").fetchone()[0]==1280
          con.close();print('PRODUCTION_PRECONDITIONS=PASS COUNT=1280')
          PY
      - name: Import Q1281-Q1290 transactionally
        env:
          Q1281_Q1290_MANIFEST_BLOB: 96f83602bf0fe923355e6d337de08dadaf366f1d
        run: |
          set -euo pipefail
          python -m py_compile usmle/step2_import_q1281_q1290.py usmle/step2_import_q1261_q1270.py
          python usmle/step2_import_q1281_q1290.py | tee /tmp/q1281-q1290-import-result.json
      - name: Independent post-import verification before persist
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,re,sqlite3,subprocess
          db=pathlib.Path('usmle/data/usmle-step1.db')
          s=json.load(open('usmle/state/step2_final_q0001_q1290.json'))
          f=json.load(open('usmle/audit/STEP2_FINAL_10_10_Q0001_Q1290.json'))
          assert s['final_status']=='FINAL_10_10_PASS' and s['item_count']==1290 and s['step2_final_review_count']==1290
          assert s['contiguous_q0001_q1290'] is True and s['q1281_q1290_present_exactly_once'] is True
          assert s['sqlite_integrity_check']=='ok' and s['payload_review_consistency']=='PASS'
          assert s['answer_position_new_block']=={'balanced':{'A':2,'B':2,'C':2,'D':2,'E':2},'sequence':'BDACECAEDB'}
          assert s['blueprint_increment_new_block']=={'Reproductive & Endocrine Systems':5,'Respiratory & Renal/Urinary Systems':5}
          assert s['competency_increment_new_block']=={'Patient Care: Diagnosis':5,'Medical Knowledge: Applying Foundational Science Concepts':5}
          assert s['new_block']['candidate_batch_blob']=='fdda09072509425b0321aafbe921aa95fed53aee'
          assert s['new_block']['final_qa_manifest_blob']=='96f83602bf0fe923355e6d337de08dadaf366f1d'
          assert f['production_import_completed'] is True and f['final_verdict']=='FINAL_10_10_PASS_NO_MATERIAL_DEFECT'
          blob=subprocess.check_output(['git','hash-object',str(db)],text=True).strip()
          assert blob==s['post_authoritative_db_blob'] and blob!='c6d3a9df9c8887b6ff3f3dbac6c710ed564bb4ed'
          assert hashlib.sha256(db.read_bytes()).hexdigest()==s['post_authoritative_db_sha256']
          con=sqlite3.connect(db.resolve().as_uri()+'?mode=ro&immutable=1',uri=True)
          assert con.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert con.execute("select count(*) from step2_final_items where final_status='FINAL_10_10_PASS'").fetchone()[0]==1290
          assert con.execute("select count(*) from step2_final_reviews where final_status='FINAL_10_10_PASS'").fetchone()[0]==1290
          rows=con.execute("select candidate_id,payload_json,payload_sha256,audit_sha256 from step2_final_items where final_status='FINAL_10_10_PASS'").fetchall()
          reviews={r[0]:r for r in con.execute("select candidate_id,review_json,review_sha256,final_status from step2_final_reviews where final_status='FINAL_10_10_PASS'").fetchall()};con.close()
          nums=[];new={}
          for cid,pj,ps,ash in rows:
              m=re.search(r'DIRECT-(\d{4})',cid);assert m,cid
              n=int(m.group(1));nums.append(n)
              rr=reviews[cid];assert rr[2]==ash and rr[3]=='FINAL_10_10_PASS' and json.loads(rr[1])['review_sha256']==rr[2]
              if 1281<=n<=1290:new[n]=json.loads(pj)
          assert set(nums)==set(range(1,1291)) and len(nums)==len(set(nums))==1290 and set(new)==set(range(1281,1291))
          assert ''.join(new[n]['item']['intended_key'] for n in range(1281,1291))=='BDACECAEDB'
          for n,p in new.items():
              assert p['blueprint']['primary_system'] in {'Reproductive & Endocrine Systems','Respiratory & Renal/Urinary Systems'}
              assert p['blueprint']['primary_competency'] in {'Patient Care: Diagnosis','Medical Knowledge: Applying Foundational Science Concepts'}
              assert p['blueprint']['official_outline_path']==[p['blueprint']['primary_system']]
              assert p['step2_final_audit']['final_10_10_gate']=='FINAL_10_10_PASS'
              assert p['step2_final_audit']['canonical_duplicate_gate_passed'] is True and p['step2_final_audit']['second_answer_attack_passed'] is True
              key=p['item']['intended_key'];de=p['explanation']['distractor_explanations'];em={e['option']:e for e in p['evidence_map']};assert set(em)==set('ABCDE')
              for L in 'ABCDE':assert em[L]['claim']==de[L] and em[L]['direct_or_inference']==('direct' if L==key else 'inference')
          assert not pathlib.Path(str(db)+'-wal').exists() and not pathlib.Path(str(db)+'-shm').exists()
          print('PRE_PERSIST_VERIFY=PASS COUNT=1290 REVIEWS=1290 BLOB='+blob)
          PY
      - name: Persist authoritative Q1290 canonical state
        run: |
          set -euo pipefail
          git config user.name 'USMLE Production Finalizer'
          git config user.email 'actions@users.noreply.github.com'
          git add usmle/data/usmle-step1.db usmle/state/step2_final_q0001_q1290.json usmle/audit/STEP2_FINAL_10_10_Q0001_Q1290.json
          git diff --cached --quiet && { echo 'No production changes to persist'; exit 1; }
          git commit -m 'USMLE: finalize canonical Q0001-Q1290'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Verify persisted main from scratch
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          import hashlib,json,pathlib,re,sqlite3,subprocess
          db=pathlib.Path('usmle/data/usmle-step1.db')
          s=json.load(open('usmle/state/step2_final_q0001_q1290.json'))
          f=json.load(open('usmle/audit/STEP2_FINAL_10_10_Q0001_Q1290.json'))
          assert s['final_status']=='FINAL_10_10_PASS' and s['item_count']==1290 and s['step2_final_review_count']==1290
          assert s['contiguous_q0001_q1290'] is True and s['q1281_q1290_present_exactly_once'] is True
          assert s['sqlite_integrity_check']=='ok' and s['payload_review_consistency']=='PASS'
          assert f['final_verdict']=='FINAL_10_10_PASS_NO_MATERIAL_DEFECT' and f['production_import_completed'] is True
          blob=subprocess.check_output(['git','hash-object',str(db)],text=True).strip()
          assert blob==s['post_authoritative_db_blob'] and hashlib.sha256(db.read_bytes()).hexdigest()==s['post_authoritative_db_sha256']
          con=sqlite3.connect(db.resolve().as_uri()+'?mode=ro&immutable=1',uri=True)
          assert con.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert con.execute("select count(*) from step2_final_items where final_status='FINAL_10_10_PASS'").fetchone()[0]==1290
          assert con.execute("select count(*) from step2_final_reviews where final_status='FINAL_10_10_PASS'").fetchone()[0]==1290
          rows=con.execute("select candidate_id from step2_final_items where final_status='FINAL_10_10_PASS'").fetchall();con.close()
          nums=[]
          for (cid,) in rows:
              m=re.search(r'DIRECT-(\d{4})',cid);assert m,cid;nums.append(int(m.group(1)))
          assert set(nums)==set(range(1,1291)) and len(nums)==len(set(nums))==1290
          assert not pathlib.Path(str(db)+'-wal').exists() and not pathlib.Path(str(db)+'-shm').exists()
          print('PERSISTED_MAIN_VERIFY=PASS COUNT=1290 REVIEWS=1290 BLOB='+blob)
          PY
