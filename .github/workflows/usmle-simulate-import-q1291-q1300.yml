name: USMLE Simulate Import Q1291-Q1300

on:
  push:
    branches: [main]
    paths:
      - 'usmle/audit/SIMULATE_IMPORT_TRIGGER_Q1291_Q1300'

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify immutable simulation inputs
        run: |
          set -euo pipefail
          test "$(git hash-object usmle/step2_import_q1291_q1300.py)" = "48e4a44147f21bc4d92fb4585b1e785fa19d27b4"
          test "$(git hash-object usmle/step2_import_q1261_q1270.py)" = "c73f192deb88d6703845a8976e10dbd05d8e34fb"
          test "$(git hash-object usmle/data/usmle-step1.db)" = "8e2f2badc5e1cac3c4dc438cd469c3a05cc7092e"
          test "$(git hash-object usmle/batch_specs_1201_1300/12_q1291_q1300_author_20260906.json)" = "a9ae65f1508891a804c500f26ce3a7ea4e767a16"
          test "$(git hash-object usmle/audit/Q1291_Q1300_FINAL_QA_PASS.json)" = "c0923720d09758f3caeb34171d878e2a4e67d246"
      - name: Create detached production simulation worktree
        run: |
          set -euo pipefail
          rm -rf /tmp/usmle-q1300-sim
          git worktree add --detach /tmp/usmle-q1300-sim HEAD
          cd /tmp/usmle-q1300-sim
          python -m py_compile usmle/step2_import_q1291_q1300.py usmle/step2_import_q1261_q1270.py
      - name: Execute full importer only in detached worktree
        env:
          Q1291_Q1300_MANIFEST_BLOB: c0923720d09758f3caeb34171d878e2a4e67d246
        run: |
          set -euo pipefail
          cd /tmp/usmle-q1300-sim
          python usmle/step2_import_q1291_q1300.py | tee /tmp/q1291-q1300-simulation-result.json
      - name: Independently verify simulated post-state
        run: |
          set -euo pipefail
          cd /tmp/usmle-q1300-sim
          python - <<'PY'
          import hashlib,json,pathlib,re,sqlite3,subprocess
          db=pathlib.Path('usmle/data/usmle-step1.db')
          s=json.loads(pathlib.Path('usmle/state/step2_final_q0001_q1300.json').read_text())
          f=json.loads(pathlib.Path('usmle/audit/STEP2_FINAL_10_10_Q0001_Q1300.json').read_text())
          assert s['final_status']=='FINAL_10_10_PASS' and s['item_count']==1300 and s['step2_final_review_count']==1300
          assert s['contiguous_q0001_q1300'] is True and s['q1291_q1300_present_exactly_once'] is True
          assert s['sqlite_integrity_check']=='ok' and s['payload_review_consistency']=='PASS'
          assert s['answer_position_new_block']['balanced']=={'A':2,'B':2,'C':2,'D':2,'E':2}
          assert s['answer_position_new_block']['sequence']=='CADBEBDACE'
          assert s['blueprint_increment_new_block']=={'Social Sciences: Communication and Interpersonal Skills':3,'Musculoskeletal, Skin & Subcutaneous Tissue':7}
          assert s['competency_increment_new_block']=={'Communication and Interpersonal Skills':3,'Medical Knowledge: Applying Foundational Science Concepts':5,'Patient Care: Diagnosis':2}
          assert s['new_block']['candidate_batch_blob']=='a9ae65f1508891a804c500f26ce3a7ea4e767a16'
          assert s['new_block']['final_qa_manifest_blob']=='c0923720d09758f3caeb34171d878e2a4e67d246'
          assert f['production_import_completed'] is True and f['final_verdict']=='FINAL_10_10_PASS_NO_MATERIAL_DEFECT'
          blob=subprocess.check_output(['git','hash-object',str(db)],text=True).strip()
          assert blob==s['post_authoritative_db_blob'] and blob!='8e2f2badc5e1cac3c4dc438cd469c3a05cc7092e'
          assert hashlib.sha256(db.read_bytes()).hexdigest()==s['post_authoritative_db_sha256']
          con=sqlite3.connect(db.resolve().as_uri()+'?mode=ro&immutable=1',uri=True)
          assert con.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert con.execute("select count(*) from step2_final_items where final_status='FINAL_10_10_PASS'").fetchone()[0]==1300
          assert con.execute("select count(*) from step2_final_reviews where final_status='FINAL_10_10_PASS'").fetchone()[0]==1300
          rows=con.execute("select candidate_id,payload_json from step2_final_items where final_status='FINAL_10_10_PASS'").fetchall(); con.close()
          nums=[];new={}
          for cid,pj in rows:
              m=re.search(r'DIRECT-(\d{4})',cid);assert m,cid
              n=int(m.group(1));nums.append(n)
              if 1291<=n<=1300:new[n]=json.loads(pj)
          assert set(nums)==set(range(1,1301)) and len(nums)==len(set(nums))==1300
          assert set(new)==set(range(1291,1301))
          assert ''.join(new[n]['item']['intended_key'] for n in range(1291,1301))=='CADBEBDACE'
          assert all(new[n]['blueprint']['primary_system'] in {'Social Sciences: Communication and Interpersonal Skills','Musculoskeletal, Skin & Subcutaneous Tissue'} for n in new)
          assert all(new[n]['blueprint']['primary_competency'] in {'Communication and Interpersonal Skills','Medical Knowledge: Applying Foundational Science Concepts','Patient Care: Diagnosis'} for n in new)
          assert all(new[n]['blueprint']['official_outline_path']==[new[n]['blueprint']['primary_system']] for n in new)
          assert all(new[n]['step2_final_audit']['final_10_10_gate']=='FINAL_10_10_PASS' for n in new)
          assert all(new[n]['step2_final_audit']['canonical_duplicate_gate_passed'] is True for n in new)
          assert all(new[n]['step2_final_audit']['second_answer_attack_passed'] is True for n in new)
          assert not pathlib.Path(str(db)+'-wal').exists() and not pathlib.Path(str(db)+'-shm').exists()
          print('SIMULATED_POSTSTATE_VERIFY=PASS COUNT=1300 REVIEWS=1300 BLOB='+blob)
          PY
      - name: Prove main checkout remained untouched
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test "$(git hash-object usmle/data/usmle-step1.db)" = "8e2f2badc5e1cac3c4dc438cd469c3a05cc7092e"
          test ! -e usmle/state/step2_final_q0001_q1300.json
          test ! -e usmle/audit/STEP2_FINAL_10_10_Q0001_Q1300.json
          echo MAIN_CHECKOUT_UNTOUCHED=PASS
