name: Rule 1 Batch 004 Q0151-Q0200

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/apply_batch004_rule1_final_gate.py"
      - "tools/verify_batch004_rule1_round2.py"
      - "data/rule1_batch004_reaudit_evidence_part1_q0151_q0175.json"
      - "data/rule1_batch004_reaudit_evidence_part2_q0176_q0200.json"
      - "data/rule1_batch004_round2_semantic_manifest_20260815.json"
      - "data/clinical_overrides_z_rule1_batch004_reaudit_20260815.json"
      - "data/clinical_overrides_zz_rule1_batch004_round2_20260815.json"
      - ".github/workflows/build-rule1-batch004.yml"

permissions:
  contents: write

jobs:
  rule1-batch004:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decode staged override payloads
        run: |
          shopt -s nullglob
          for file in data/clinical_overrides_*.json.gz.b64; do
            json_file="${file%.gz.b64}"
            [[ -f "$json_file" ]] && continue
            base64 --decode "$file" | gzip -dc > "$json_file"
          done
          for file in data/clinical_overrides_*.b64; do
            [[ "$file" == *.json.gz.b64 ]] && continue
            json_file="${file%.b64}.json"
            [[ -f "$json_file" ]] && continue
            base64 --decode "$file" > "$json_file"
          done

      - name: Rebuild Wave 27 manifest
        run: python tools/rebuild_wave27_manifest.py
      - name: Build master DB
        run: python tools/build_nclex_master.py
      - name: Enforce commercial hard gate
        run: python tools/enforce_commercial_gate.py
      - name: Enforce strict governance baseline
        run: python tools/enforce_strict_question_gate.py
      - name: Apply Wave 26 option balance
        run: python tools/apply_wave26_option_balance.py
      - name: Apply Rule 1 Batch 001
        run: python tools/apply_batch001_final_gate.py
      - name: Apply Rule 1 Batch 002
        run: python tools/apply_batch002_rule1_final_gate.py
      - name: Apply Rule 1 Batch 003
        run: python tools/apply_batch003_rule1_final_gate.py
      - name: Verify Rule 1 Batch 003 real re-audit
        run: python tools/verify_batch003_rule1_reaudit.py
      - name: Apply Rule 1 Batch 004
        run: python tools/apply_batch004_rule1_final_gate.py
      - name: Verify Rule 1 Batch 004 fresh round2
        run: python tools/verify_batch004_rule1_round2.py
      - name: Apply Wave 25 gate
        run: python tools/apply_wave25_final_gate.py
      - name: Apply Wave 26 gate
        run: python tools/apply_wave26_manual_final_gate.py
      - name: Apply Wave 27 gate
        run: python tools/apply_wave27_manual_final_gate.py
      - name: Export pending audit
        run: python tools/export_pending_audit.py

      - name: Verify Rule 1 Batch 004 and DB
        run: |
          python - <<'PY'
          import sqlite3, json
          db='NCLEX_COMMERCIAL_MASTER_CURRENT.db'
          con=sqlite3.connect(db)
          integrity=con.execute('PRAGMA integrity_check').fetchone()[0]
          total=con.execute('SELECT COUNT(*) FROM questions').fetchone()[0]
          ready=con.execute('SELECT COUNT(*) FROM questions WHERE commercial_release_ready=1').fetchone()[0]
          meta=con.execute("SELECT value FROM bank_metadata WHERE key='batch004_q0151_q0200_rule1_final_gate'").fetchone()
          round2_meta=con.execute("SELECT value FROM bank_metadata WHERE key='batch004_q0151_q0200_rule1_round2_20260815'").fetchone()
          passed=con.execute("SELECT COUNT(*) FROM question_final_gate WHERE question_uid BETWEEN 'V2-Q0151' AND 'V2-Q0200' AND final_status='FINAL_QA_PASS'").fetchone()[0]
          manual=con.execute("SELECT COUNT(*) FROM rule1_manual_audit WHERE question_uid BETWEEN 'V2-Q0151' AND 'V2-Q0200' AND final_disposition='FINAL_QA_PASS' AND second_pass='PASS' AND criteria_passed_count=11").fetchone()[0]
          evidence=con.execute("SELECT COUNT(*) FROM rule1_batch004_reaudit_evidence WHERE question_uid BETWEEN 'V2-Q0151' AND 'V2-Q0200' AND final_disposition='FINAL_QA_PASS' AND second_pass='PASS' AND criteria_passed_count=11").fetchone()[0]
          round2=con.execute("SELECT COUNT(*) FROM rule1_batch004_round2_evidence WHERE question_uid BETWEEN 'V2-Q0151' AND 'V2-Q0200' AND final_disposition='FINAL_QA_PASS' AND second_pass='PASS' AND criteria_passed_count=11").fetchone()[0]
          bad=con.execute("SELECT COUNT(*) FROM question_final_gate WHERE question_uid BETWEEN 'V2-Q0151' AND 'V2-Q0200' AND (source_verified<>1 OR blueprint_verified<>1 OR question_quality_verified<>1 OR correct_answer_verified<>1 OR distractors_verified<>1 OR explanation_verified<>1 OR currentness_verified<>1 OR independent_qa_passed<>1 OR no_unresolved_conflict<>1)").fetchone()[0]
          option_rows=con.execute("SELECT question_uid, option_length_metrics_json FROM question_final_gate WHERE question_uid BETWEEN 'V2-Q0151' AND 'V2-Q0200'").fetchall()
          option_ok=sum(1 for _,raw in option_rows if (lambda m: m.get('max_min_ratio',99)<=1.15 and m.get('correct_deviation_from_distractor_mean',99)<=0.10 and m.get('correct_unique_length_extreme') is False)(json.loads(raw)))
          source_current=con.execute("SELECT COUNT(*) FROM questions WHERE question_uid BETWEEN 'V2-Q0151' AND 'V2-Q0200' AND source_detail LIKE '%2026-08-15%'").fetchone()[0]
          secondary=con.execute("SELECT COUNT(*) FROM rule1_batch004_round2_evidence WHERE question_uid BETWEEN 'V2-Q0151' AND 'V2-Q0200' AND source_authority='SECONDARY_EXCEPTION'").fetchone()[0]
          upgrades=con.execute("SELECT COUNT(*) FROM rule1_batch004_round2_evidence WHERE question_uid BETWEEN 'V2-Q0151' AND 'V2-Q0200' AND source_action='SOURCE_UPGRADE_REQUIRED'").fetchone()[0]
          q173=con.execute("SELECT source_url,source_detail FROM questions WHERE question_uid='V2-Q0173'").fetchone()
          q179=con.execute("SELECT source_url,source_detail FROM questions WHERE question_uid='V2-Q0179'").fetchone()
          q178=con.execute("SELECT stem FROM questions WHERE question_uid='V2-Q0178'").fetchone()[0]
          q182=con.execute("SELECT stem FROM questions WHERE question_uid='V2-Q0182'").fetchone()[0]
          q193=con.execute("SELECT stem FROM questions WHERE question_uid='V2-Q0193'").fetchone()[0]
          gate=con.execute("SELECT value FROM bank_metadata WHERE key='commercial_release_gate'").fetchone()
          con.close()
          assert integrity=='ok', integrity
          assert total==3525, total
          assert ready==0, ready
          assert meta and meta[0]=='PASS_50_OF_50_REAL_REAUDIT_SECOND_PASS_11_OF_11_2026_08_15', meta
          assert round2_meta and round2_meta[0]=='PASS_50_OF_50_FRESH_ROUND2_SECOND_PASS_11_OF_11_2026_08_15', round2_meta
          assert passed==50, passed
          assert manual==50, manual
          assert evidence==50, evidence
          assert round2==50, round2
          assert bad==0, bad
          assert option_ok==50, option_ok
          assert source_current==50, source_current
          assert secondary==3, secondary
          assert upgrades==2, upgrades
          assert q173[0]=='https://thinkculturalhealth.hhs.gov/clas/standards', q173
          assert '42 CFR §482.13(b)(1)-(2)' in q173[1], q173
          assert q179[0]=='https://www.jacc.org/doi/10.1016/j.jacc.2026.05.036', q179
          assert '2026 AHA/ACC/ESC/WHF' in q179[1], q179
          assert 'meets current STEMI diagnostic criteria' in q178
          assert q182.startswith('Two weeks after abdominal surgery')
          assert 'low-intake dehydration' in q193
          assert gate and gate[0]=='CLOSED_PENDING_FULL_BANK_CLINICAL_CURRENTNESS_SOURCE_LICENSING_AND_RELEASE_QA', gate
          print(f'RULE1_BATCH004_ROUND2_VERIFIED integrity={integrity} total={total} pass={passed}/50 manual11={manual}/50 old_evidence11={evidence}/50 round2_evidence11={round2}/50 option_qc={option_ok}/50 source_current={source_current}/50 source_upgrades={upgrades}/2 prior_corrections=3/3 secondary={secondary}/3 bad={bad} ready={ready}')
          PY

      - name: Commit integrated master and Rule 1 reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NCLEX_COMMERCIAL_MASTER_CURRENT.db NCLEX_COMMERCIAL_MASTER_CURRENT_AUDIT.md FINAL_QA_BATCH004_Q0151_Q0200_RULE1_10OF10.md FINAL_QA_BATCH004_ROUND2_20260815.md data/pending_audit_next.json
          if git diff --cached --quiet; then
            echo "Rule 1 Batch 004 round2 outputs already current"
          else
            git commit -m "Integrate Rule 1 Batch 004 fresh round2 Q0151-Q0200 [skip ci]"
            git push
          fi
