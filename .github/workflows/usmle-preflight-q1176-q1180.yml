name: USMLE Preflight Q1176-Q1180

on:
  push:
    branches: [main]
    paths:
      - 'usmle/batch_specs_1101_1200/09_q1176_q1180.json'
      - '.github/workflows/usmle-preflight-q1176-q1180.yml'

permissions:
  contents: write

concurrency:
  group: usmle-preflight-q1176-q1180
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify authoritative state and scan canonical overlap
        run: |
          python - <<'PY'
          import json, pathlib, re, sqlite3, subprocess
          from difflib import SequenceMatcher

          db=pathlib.Path('usmle/data/usmle-step1.db')
          specp=pathlib.Path('usmle/batch_specs_1101_1200/09_q1176_q1180.json')
          outp=pathlib.Path('usmle/audit/PREFLIGHT_Q1176_Q1180.json')
          expected_blob='c42033ba0c8de7bdb6aae7d9c978dcef24123a64'
          expected_spec_blob='e29285c13f3cd7f5315d16e16542d9d6e4a0e7e2'

          def norm(s):
              return re.sub(r'\s+',' ',re.sub(r'[^a-z0-9 ]+',' ',(s or '').lower())).strip()
          def words(s):
              return set(norm(s).split())
          def jac(a,b):
              return len(a&b)/len(a|b) if (a or b) else 0.0
          def qnum(cid):
              m=re.search(r'DIRECT-(\d{4})',cid or '')
              return int(m.group(1)) if m else None

          blob=subprocess.check_output(['git','hash-object',str(db)],text=True).strip()
          spec_blob=subprocess.check_output(['git','hash-object',str(specp)],text=True).strip()
          assert blob==expected_blob,(blob,expected_blob)
          assert spec_blob==expected_spec_blob,(spec_blob,expected_spec_blob)
          con=sqlite3.connect(db)
          assert con.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          rows=con.execute("SELECT candidate_id,payload_json FROM step2_final_items WHERE final_status='FINAL_10_10_PASS'").fetchall()
          assert len(rows)==1175,len(rows)
          assert con.execute('SELECT COUNT(*) FROM (SELECT candidate_id FROM step2_final_items GROUP BY candidate_id HAVING COUNT(*)>1)').fetchone()[0]==0
          nums={qnum(cid) for cid,_ in rows}
          assert nums==set(range(1,1176))

          canonical=[]
          for cid,pj in rows:
              p=json.loads(pj)
              i=p.get('item',{})
              sf=p.get('semantic_fingerprint',{})
              full=' '.join([
                  i.get('vignette',''),i.get('lead_in',''),' '.join(i.get('options',{}).values()),
                  sf.get('diagnosis_or_process',''),sf.get('mechanism',''),sf.get('correct_answer_concept',''),
                  i.get('tested_construct','')
              ])
              main=' '.join([
                  sf.get('diagnosis_or_process',''),sf.get('mechanism',''),sf.get('correct_answer_concept',''),
                  i.get('tested_construct',''),i.get('lead_in','')
              ])
              canonical.append((cid,norm(full),words(full),sf,norm(main)))

          specs=json.load(open(specp))
          assert [int(x['num']) for x in specs]==list(range(1176,1181))
          report=[]; material=False
          for x in specs:
              diag=norm(x['diagnosis'])
              mech=norm(x['mechanism'])
              corr=norm(x['correct'])
              query=' '.join([diag,mech,corr])
              qw=words(query)
              exact=[]; term_hits=[]; top=[]
              unique_terms=[norm(t) for t in x.get('duplicate_probe_terms',[]) if norm(t)]
              for cid,ct,cw,sf,main_ct in canonical:
                  sfdiag=norm(sf.get('diagnosis_or_process',''))
                  sfmech=norm(sf.get('mechanism',''))
                  if diag and sfdiag and (diag==sfdiag or (len(diag)>20 and diag in sfdiag) or (len(sfdiag)>20 and sfdiag in diag)):
                      exact.append({'candidate_id':cid,'type':'semantic_diagnosis_overlap'})
                  if mech and sfmech and SequenceMatcher(None,mech,sfmech).ratio()>=0.82:
                      exact.append({'candidate_id':cid,'type':'mechanism_high_similarity'})
                  for t in unique_terms:
                      if t in main_ct:
                          term_hits.append({'candidate_id':cid,'term':t,'scope':'canonical_main_construct'})
                  j=jac(qw,cw)
                  if j>=0.10:
                      top.append((j,cid))
              def uniq(seq,keys):
                  out=[]; seen=set()
                  for e in seq:
                      k=tuple(e.get(z) for z in keys)
                      if k not in seen:
                          seen.add(k); out.append(e)
                  return out
              exact=uniq(exact,['candidate_id','type'])
              term_hits=uniq(term_hits,['candidate_id','term'])
              top=sorted(top,reverse=True)[:5]
              status='PASS' if not exact and not term_hits else 'BLOCKED'
              if status!='PASS': material=True
              report.append({
                  'num':x['num'],'diagnosis':x['diagnosis'],'status':status,
                  'exact_or_semantic_hits':exact,'unique_term_hits':term_hits,
                  'top_lexical_jaccard':[{'candidate_id':cid,'score':round(j,4)} for j,cid in top]
              })
          con.close()
          result={
              'preflight_id':'Q1176-Q1180-PREFLIGHT-20260904',
              'authoritative_db':'usmle/data/usmle-step1.db',
              'authoritative_db_blob':blob,
              'authoritative_final_count':1175,
              'sqlite_integrity_check':'ok',
              'contiguous_q0001_q1175':True,
              'duplicate_candidate_id_count':0,
              'spec_path':str(specp),
              'spec_git_blob':spec_blob,
              'items':report,
              'overall_status':'BLOCKED' if material else 'PASS'
          }
          outp.write_text(json.dumps(result,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(result,indent=2,ensure_ascii=False))
          if material:
              raise SystemExit('material canonical overlap detected')
          PY
      - name: Persist preflight report
        if: success()
        run: |
          git config user.name 'USMLE Preflight'
          git config user.email 'actions@users.noreply.github.com'
          git add usmle/audit/PREFLIGHT_Q1176_Q1180.json
          if ! git diff --cached --quiet; then
            git commit -m 'Preflight USMLE Q1176-Q1180 against canonical Q0001-Q1175'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
