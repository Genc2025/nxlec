name: Inspect Batch 004 Round2 Integrated DB

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-batch004-round2-integrated.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Independently verify committed Batch 004 round2 DB
        run: |
          python - <<'PY'
          import json, sqlite3
          con=sqlite3.connect('NCLEX_COMMERCIAL_MASTER_CURRENT.db')
          con.row_factory=sqlite3.Row
          integrity=con.execute('PRAGMA integrity_check').fetchone()[0]
          total=con.execute('SELECT COUNT(*) FROM questions').fetchone()[0]
          ready=con.execute('SELECT COUNT(*) FROM questions WHERE commercial_release_ready=1').fetchone()[0]
          meta=con.execute("SELECT value FROM bank_metadata WHERE key='batch004_q0151_q0200_rule1_round2_20260815'").fetchone()
          evidence=con.execute("SELECT COUNT(*) FROM rule1_batch004_round2_evidence WHERE question_uid BETWEEN 'V2-Q0151' AND 'V2-Q0200' AND criteria_passed_count=11 AND second_pass='PASS' AND final_disposition='FINAL_QA_PASS'").fetchone()[0]
          final=con.execute("SELECT COUNT(*) FROM question_final_gate WHERE question_uid BETWEEN 'V2-Q0151' AND 'V2-Q0200' AND final_status='FINAL_QA_PASS'").fetchone()[0]
          bad=con.execute("SELECT COUNT(*) FROM question_final_gate WHERE question_uid BETWEEN 'V2-Q0151' AND 'V2-Q0200' AND (source_verified<>1 OR blueprint_verified<>1 OR question_quality_verified<>1 OR correct_answer_verified<>1 OR distractors_verified<>1 OR explanation_verified<>1 OR currentness_verified<>1 OR independent_qa_passed<>1 OR no_unresolved_conflict<>1)").fetchone()[0]
          sources=con.execute("SELECT COUNT(*) FROM questions WHERE question_uid BETWEEN 'V2-Q0151' AND 'V2-Q0200' AND source_detail LIKE '%2026-08-15%'").fetchone()[0]
          rows=con.execute("SELECT question_uid,option_length_metrics_json FROM question_final_gate WHERE question_uid BETWEEN 'V2-Q0151' AND 'V2-Q0200'").fetchall()
          option_ok=0
          for uid,raw in rows:
              m=json.loads(raw)
              if m['max_min_ratio']<=1.15 and m['correct_deviation_from_distractor_mean']<=0.10 and m['correct_unique_length_extreme'] is False:
                  option_ok+=1
          q173=con.execute("SELECT source_url,source_detail FROM questions WHERE question_uid='V2-Q0173'").fetchone()
          q179=con.execute("SELECT source_url,source_detail FROM questions WHERE question_uid='V2-Q0179'").fetchone()
          q178=con.execute("SELECT stem FROM questions WHERE question_uid='V2-Q0178'").fetchone()[0]
          q182=con.execute("SELECT stem FROM questions WHERE question_uid='V2-Q0182'").fetchone()[0]
          q193=con.execute("SELECT stem,item_data_json FROM questions WHERE question_uid='V2-Q0193'").fetchone()
          gate=con.execute("SELECT value FROM bank_metadata WHERE key='commercial_release_gate'").fetchone()
          con.close()
          assert integrity=='ok', integrity
          assert total==3525, total
          assert ready==0, ready
          assert meta and meta[0]=='PASS_50_OF_50_FRESH_ROUND2_SECOND_PASS_11_OF_11_2026_08_15', meta
          assert evidence==50, evidence
          assert final==50, final
          assert bad==0, bad
          assert sources==50, sources
          assert option_ok==50, option_ok
          assert q173[0]=='https://thinkculturalhealth.hhs.gov/clas/standards', q173
          assert '42 CFR §482.13(b)(1)-(2)' in q173[1], q173
          assert q179[0]=='https://www.jacc.org/doi/10.1016/j.jacc.2026.05.036', q179
          assert '2026 AHA/ACC/ESC/WHF' in q179[1], q179
          assert 'meets current STEMI diagnostic criteria' in q178
          assert q182.startswith('Two weeks after abdominal surgery')
          assert 'low-intake dehydration' in q193['stem']
          assert 'measured serum or plasma osmolality' in json.loads(q193['item_data_json'])['options']['B']
          assert gate and gate[0]=='CLOSED_PENDING_FULL_BANK_CLINICAL_CURRENTNESS_SOURCE_LICENSING_AND_RELEASE_QA', gate
          print(f'BATCH004_ROUND2_COMMITTED_DB_INDEPENDENTLY_VERIFIED integrity={integrity} total={total} items={evidence}/50 final_gate={final}/50 sources={sources}/50 option_qc={option_ok}/50 bad={bad} source_upgrades=2/2 prior_corrections=3/3 ready={ready}')
          PY
