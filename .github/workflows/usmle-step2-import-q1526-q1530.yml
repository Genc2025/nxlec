name: USMLE Step2 Import Q1526-Q1530
on:
  push:
    paths:
      - '.github/workflows/usmle-step2-import-q1526-q1530.yml'
permissions:
  contents: write
jobs:
  import-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      START_Q: '1526'
      END_Q: '1530'
      PRE_COUNT: '1525'
      DB_BLOB: 487f4756e6771b6472b96abb7a18402484334abd
      CAND_PATH: usmle/batch_specs_1501_1600/06_q1526_q1530_author_20260911.json
      CAND_BLOB: 12c07908811b29f3c8fdad8eb7eaf62a3cef4643
      MAN_PATH: usmle/audit/Q1526_Q1530_FINAL_QA_PASS.json
      MAN_BLOB: 1c117edea005fab54796ec1e93b5dfd0ae62ed4c
      SIM_PATH: usmle/audit/Q1526_Q1530_DETACHED_IMPORT_SIMULATION.json
      SIM_BLOB: 578bc2836e5fb4ee577d3a8184372741130878a2
      VERIFY_OUT: usmle/audit/Q1526_Q1530_PRODUCTION_IMPORT_VERIFY.json
      STATE_OUT: usmle/state/step2_final_q0001_q1530.json
      AUDIT_DATE: '20260911'
      CANDIDATE_STAMP: '20260911T035800Z'
      FINALIZED_AT: '2026-09-11T03:58:00Z'
    steps:
      - uses: actions/checkout@v6
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Bind immutable pre-import evidence
        run: |
          set -euo pipefail
          test "$(git hash-object usmle/data/usmle-step1.db)" = "$DB_BLOB"
          test "$(git hash-object "$CAND_PATH")" = "$CAND_BLOB"
          test "$(git hash-object "$MAN_PATH")" = "$MAN_BLOB"
          test "$(git hash-object "$SIM_PATH")" = "$SIM_BLOB"
          python - <<'PY'
          import json,os
          st=json.load(open('usmle/state/step2_final_q0001_q1525.json'))
          assert st['item_count']==st['step2_final_review_count']==1525
          assert st['contiguous_q0001_q1525'] is True and st['sqlite_integrity']=='ok'
          assert st['post_db_blob']==os.environ['DB_BLOB']
          m=json.load(open(os.environ['MAN_PATH']))
          assert m['status']=='FINAL_QA_PASS'
          assert m['final_qa_verdict']=='FINAL_QA_PASS_NO_MATERIAL_DEFECT'
          assert m['production_import_ready'] is True
          assert m['unresolved_defects']==[] and m['suggested_changes']==[]
          assert m['candidate_batch_blob']==os.environ['CAND_BLOB']
          assert m['authoritative_db_blob']==os.environ['DB_BLOB']
          assert m['authoritative_db_final_count']==1525 and m['authoritative_review_count']==1525
          s=json.load(open(os.environ['SIM_PATH']))
          assert s['audit_id']=='Q1526-Q1530-DETACHED-IMPORT-SIMULATION-20260911'
          assert s['status']=='DETACHED_IMPORT_SIMULATION_PASS'
          assert s['production_transactional_import_ready'] is True
          assert s['production_db_modified'] is False
          assert s['failures']==[]
          assert s['simulated_post_count']==1530
          assert s['post_simulation_contiguous_q0001_q1530'] is True
          PY
      - name: Execute transactional next-five import
        run: |
          set -euo pipefail
          python -m py_compile usmle/step2_import_next5.py
          python usmle/step2_import_next5.py
      - name: Independent post-import verification
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,re,sqlite3
          c=sqlite3.connect('usmle/data/usmle-step1.db')
          assert c.execute('pragma integrity_check').fetchone()[0]=='ok'
          rows=c.execute("select candidate_id,payload_json,payload_sha256,audit_sha256,finalized_at from step2_final_items where final_status='FINAL_10_10_PASS'").fetchall()
          rc=c.execute("select count(*) from step2_final_reviews where final_status='FINAL_10_10_PASS'").fetchone()[0]
          fin=c.execute('select item_count from step2_finalization where id=1').fetchone()[0]
          c.close()
          nums=[]
          for cid,*_ in rows:
            m=re.search(r'DIRECT-(\d{4})',cid); assert m; nums.append(int(m.group(1)))
          assert len(rows)==rc==fin==1530
          assert set(nums)==set(range(1,1531))
          incoming=[r for r in rows if 1526 <= int(re.search(r'DIRECT-(\d{4})',r[0]).group(1)) <= 1530]
          assert len(incoming)==5
          assert all('20260911T035800Z' in r[0] for r in incoming)
          assert all(r[4]=='2026-09-11T03:58:00Z' for r in incoming)
          v=json.load(open(os.environ['VERIFY_OUT']))
          st=json.load(open(os.environ['STATE_OUT']))
          assert v['audit_id']=='Q1526-Q1530-PRODUCTION-IMPORT-VERIFY-20260911'
          assert v['status']=='PRODUCTION_IMPORT_PASS'
          assert v['item_count']==v['review_count']==1530
          assert v['contiguous_q0001_q1530'] is True and v['failures']==[]
          assert st['audit_id']=='STEP2-FINAL-Q0001-Q1530-20260911'
          assert st['item_count']==st['step2_final_review_count']==1530
          assert st['contiguous_q0001_q1530'] is True
          assert st['production_import_status']=='PASS'
          assert st['verified_at']=='2026-09-11T03:58:00Z'
          assert st['post_db_blob']==v['post_db_blob']
          print('Q1526_Q1530_POST_IMPORT_VERIFY=PASS',st['post_db_blob'])
          PY
      - name: Persist DB state and verification atomically
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add usmle/data/usmle-step1.db "$VERIFY_OUT" "$STATE_OUT"
          git commit -m 'usmle: import Q1526-Q1530 into production'
          git push
