name: Rule 1 Batch 006 Q0832-Q0881

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/build_batch006_artifacts.py"
      - "tools/apply_batch006_rule1_final_gate.py"
      - ".github/workflows/build-rule1-batch006.yml"

permissions:
  contents: write

jobs:
  rule1-batch006:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build audited Batch 006 artifacts
        run: python tools/build_batch006_artifacts.py

      - name: Validate Batch 006 semantic artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ep=Path('data/rule1_batch006_reaudit_evidence_q0832_q0881.json')
          op=Path('data/clinical_overrides_z_rule1_batch006_reaudit_20260815.json')
          ev=json.loads(ep.read_text()); ov=json.loads(op.read_text())
          ids=[f'V2-Q{i:04d}' for i in range(832,882)]
          assert ev['standard']=='RULE_1_FINAL_10_OF_10_REAL_REAUDIT'
          assert ev['batch']=='Q0832-Q0881' and ev['legacy_status_evidence'] is False
          assert ev['all_options_semantically_rewritten'] is True
          assert len(ev['criteria_names'])==11
          assert len(ev['items'])==50 and [x['id'] for x in ev['items']]==ids
          assert len(ov['questions'])==50 and [x['question_uid'] for x in ov['questions']]==ids
          eby={x['id']:x for x in ev['items']}; oby={x['question_uid']:x for x in ov['questions']}
          corrections=0; secondary=0; option_ok=0; max_ratio=0.0; max_dev=0.0
          for uid in ids:
              e=eby[uid]; q=oby[uid]
              assert e['criteria']==11 and e['second_pass']=='PASS' and e['final']=='FINAL_QA_PASS'
              assert e['reviewed_at']=='2026-08-15'
              assert q['source_url']==e['source_url'] and q['source_url'].startswith('https://')
              assert e['source_locator'].casefold() in q['source_detail'].casefold()
              assert e['source_version'].casefold() in q['source_detail'].casefold()
              assert '2026-08-15' in q['source_detail']
              assert q['clinical_qa_status']=='SOURCE_VERIFIED_2026_RULE1_BATCH006'
              o=json.loads(q['item_data_json'])['options']; k=json.loads(q['correct_answer_json'])['correct_option']
              assert k==e['key'] and set(o)==set('ABCD') and len({v.strip().casefold() for v in o.values()})==4
              lens={x:len(o[x].strip()) for x in 'ABCD'}; vals=list(lens.values())
              ratio=max(vals)/min(vals); dm=sum(lens[x] for x in 'ABCD' if x!=k)/3; dev=abs(lens[k]-dm)/dm
              unique=((lens[k]==min(vals) and vals.count(min(vals))==1) or (lens[k]==max(vals) and vals.count(max(vals))==1))
              assert ratio<=1.15+1e-12 and dev<=0.10+1e-12 and not unique, (uid,ratio,dev,unique)
              assert e['option_qc']['artificial_padding'] is False and e['option_qc']['semantic_option_rewrite'] is True
              option_ok+=1; max_ratio=max(max_ratio,ratio); max_dev=max(max_dev,dev)
              flags=json.loads(q['editorial_flags_json'])
              assert 'ALL_OPTIONS_SEMANTIC_REWRITE' in flags
              corrections += int('SUBSTANTIVE_CORRECTION' in flags)
              secondary += int('DOCUMENTED_SECONDARY_SOURCE_EXCEPTION' in flags)
          assert corrections==12 and secondary==7 and option_ok==50
          print(f'BATCH006_ARTIFACTS_VALID items=50/50 criteria11=50/50 option_qc={option_ok}/50 corrections={corrections}/12 secondary={secondary}/7 max_ratio={max_ratio:.4f} max_dev={max_dev:.4f}')
          PY

      - name: Decode other staged clinical overrides
        run: |
          shopt -s nullglob
          for file in data/clinical_overrides_*.json.gz.b64; do
            json_file="${file%.gz.b64}"
            [[ -f "$json_file" ]] && continue
            base64 --decode "$file" | gzip -dc > "$json_file"
          done
          for file in data/clinical_overrides_*.b64; do
            [[ "$file" == *.json.gz.b64 ]] && continue
            json_file="${file%.b64}.json"
            [[ -f "$json_file" ]] && continue
            base64 --decode "$file" > "$json_file"
          done

      - name: Rebuild Wave 27 manifest
        run: python tools/rebuild_wave27_manifest.py
      - name: Build master DB
        run: python tools/build_nclex_master.py
      - name: Enforce commercial hard gate
        run: python tools/enforce_commercial_gate.py
      - name: Enforce strict governance baseline
        run: python tools/enforce_strict_question_gate.py
      - name: Apply Wave 26 option balance
        run: python tools/apply_wave26_option_balance.py
      - name: Apply Rule 1 Batch 001
        run: python tools/apply_batch001_final_gate.py
      - name: Apply Rule 1 Batch 002
        run: python tools/apply_batch002_rule1_final_gate.py
      - name: Apply Rule 1 Batch 003
        run: python tools/apply_batch003_rule1_final_gate.py
      - name: Verify Rule 1 Batch 003
        run: python tools/verify_batch003_rule1_reaudit.py
      - name: Apply Rule 1 Batch 004
        run: python tools/apply_batch004_rule1_final_gate.py
      - name: Verify Rule 1 Batch 004 fresh round2
        run: python tools/verify_batch004_rule1_round2.py
      - name: Apply Rule 1 Batch 005
        run: python tools/apply_batch005_rule1_final_gate.py
      - name: Apply Rule 1 Batch 006
        run: python tools/apply_batch006_rule1_final_gate.py
      - name: Apply Wave 25 gate
        run: python tools/apply_wave25_final_gate.py
      - name: Apply Wave 26 gate
        run: python tools/apply_wave26_manual_final_gate.py
      - name: Apply Wave 27 gate
        run: python tools/apply_wave27_manual_final_gate.py
      - name: Export pending audit
        run: python tools/export_pending_audit.py

      - name: Verify Rule 1 Batch 006 integrated DB
        run: |
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          con=sqlite3.connect('NCLEX_COMMERCIAL_MASTER_CURRENT.db')
          integrity=con.execute('PRAGMA integrity_check').fetchone()[0]
          total=con.execute('SELECT COUNT(*) FROM questions').fetchone()[0]
          ready=con.execute('SELECT COUNT(*) FROM questions WHERE commercial_release_ready=1').fetchone()[0]
          gate=con.execute("SELECT value FROM bank_metadata WHERE key='commercial_release_gate'").fetchone()
          meta=con.execute("SELECT value FROM bank_metadata WHERE key='batch006_q0832_q0881_rule1_final_gate'").fetchone()
          final=con.execute("SELECT COUNT(*) FROM question_final_gate WHERE question_uid BETWEEN 'V2-Q0832' AND 'V2-Q0881' AND final_status='FINAL_QA_PASS'").fetchone()[0]
          manual=con.execute("SELECT COUNT(*) FROM rule1_manual_audit WHERE question_uid BETWEEN 'V2-Q0832' AND 'V2-Q0881' AND criteria_passed_count=11 AND second_pass='PASS' AND final_disposition='FINAL_QA_PASS'").fetchone()[0]
          evidence=con.execute("SELECT COUNT(*) FROM rule1_batch006_reaudit_evidence WHERE question_uid BETWEEN 'V2-Q0832' AND 'V2-Q0881' AND criteria_passed_count=11 AND second_pass='PASS' AND final_disposition='FINAL_QA_PASS'").fetchone()[0]
          bad=con.execute("SELECT COUNT(*) FROM question_final_gate WHERE question_uid BETWEEN 'V2-Q0832' AND 'V2-Q0881' AND (source_verified<>1 OR blueprint_verified<>1 OR question_quality_verified<>1 OR correct_answer_verified<>1 OR distractors_verified<>1 OR explanation_verified<>1 OR currentness_verified<>1 OR independent_qa_passed<>1 OR no_unresolved_conflict<>1)").fetchone()[0]
          source_rows=con.execute("SELECT q.question_uid,q.source_url,q.source_detail,e.source_url,e.source_locator,e.source_version,e.source_authority FROM questions q JOIN rule1_batch006_reaudit_evidence e USING(question_uid) WHERE q.question_uid BETWEEN 'V2-Q0832' AND 'V2-Q0881'").fetchall()
          source_ok=0; secondary=0
          for uid,qurl,qdetail,eurl,loc,ver,authority in source_rows:
              source_ok += int(qurl==eurl and qurl.startswith('https://') and loc.casefold() in qdetail.casefold() and ver.casefold() in qdetail.casefold() and '2026-08-15' in qdetail)
              secondary += int(authority=='SECONDARY_EXCEPTION')
          rows=con.execute("SELECT question_uid,option_length_metrics_json FROM question_final_gate WHERE question_uid BETWEEN 'V2-Q0832' AND 'V2-Q0881'").fetchall()
          option_ok=0; semantic=0; max_ratio=0.0; max_dev=0.0
          for uid,raw in rows:
              m=json.loads(raw); max_ratio=max(max_ratio,m['max_min_ratio']); max_dev=max(max_dev,m['correct_deviation_from_distractor_mean'])
              good=m['max_min_ratio']<=1.15 and m['correct_deviation_from_distractor_mean']<=0.10 and m['correct_unique_length_extreme'] is False and m.get('artificial_padding') is False
              option_ok += int(good); semantic += int(m.get('semantic_option_rewrite') is True)
          signatures={'V2-Q0837':('mg/m²','regimen'),'V2-Q0839':('narrow','toxicity'),'V2-Q0841':('renal','clearance'),'V2-Q0846':('VIS','manufacturer'),'V2-Q0852':('furosemide','individual'),'V2-Q0856':('sulfonamide','cross-reactivity'),'V2-Q0857':('cephalosporin','cross-reactivity'),'V2-Q0859':('cardiovascular','cardioselective'),'V2-Q0864':('PPE','before'),'V2-Q0868':('applicable','institutional'),'V2-Q0874':('jurisdiction','statement'),'V2-Q0876':('performance','privileg')}
          corrected=0
          for uid,(a,b) in signatures.items():
              r=con.execute('SELECT stem,item_data_json,rationale FROM questions WHERE question_uid=?',(uid,)).fetchone(); hay=' '.join(r).casefold(); corrected += int(a.casefold() in hay and b.casefold() in hay)
          con.close()
          report=Path('FINAL_QA_BATCH006_Q0832_Q0881_RULE1_10OF10.md')
          assert integrity=='ok' and total==3525 and ready==0
          assert gate and gate[0]=='CLOSED_PENDING_FULL_BANK_CLINICAL_CURRENTNESS_SOURCE_LICENSING_AND_RELEASE_QA'
          assert meta and meta[0]=='PASS_50_OF_50_REAL_REAUDIT_SECOND_PASS_11_OF_11_2026_08_15'
          assert final==50 and manual==50 and evidence==50 and bad==0
          assert len(source_rows)==50 and source_ok==50 and secondary==7
          assert len(rows)==50 and option_ok==50 and semantic==50
          assert corrected==12
          assert report.exists() and 'Final Batch 006 result: **FINAL_QA_PASS 50/50**' in report.read_text(encoding='utf-8')
          print(f'RULE1_BATCH006_INTEGRATED_VERIFIED integrity={integrity} total={total} pass={final}/50 manual11={manual}/50 evidence11={evidence}/50 sources={source_ok}/50 option_qc={option_ok}/50 semantic_options={semantic}/50 corrections={corrected}/12 secondary={secondary}/7 bad={bad} max_ratio={max_ratio:.4f} max_dev={max_dev:.4f} ready={ready}')
          PY

      - name: Commit integrated Batch 006 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NCLEX_COMMERCIAL_MASTER_CURRENT.db NCLEX_COMMERCIAL_MASTER_CURRENT_AUDIT.md FINAL_QA_BATCH006_Q0832_Q0881_RULE1_10OF10.md data/pending_audit_next.json data/rule1_batch006_reaudit_evidence_q0832_q0881.json data/clinical_overrides_z_rule1_batch006_reaudit_20260815.json
          if git diff --cached --quiet; then
            echo "Rule 1 Batch 006 outputs already current"
          else
            git commit -m "Integrate Rule 1 Batch 006 Q0832-Q0881 real re-audit [skip ci]"
            git push
          fi
