name: USMLE Final QA Q1216-Q1230

on:
  push:
    branches: [main]
    paths:
      - 'usmle/audit/FINAL_QA_TRIGGER_Q1216_Q1230'

permissions:
  contents: write

jobs:
  final-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run fail-closed FINAL QA bound to canonical Q1215
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile usmle/final_qa_q1216_q1230.py
          python usmle/final_qa_q1216_q1230.py | tee /tmp/q1216-q1230-final-qa-result.json
      - name: Re-read generated audit package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('usmle/audit')
          m=json.loads((root/'Q1216_Q1230_FINAL_QA_PASS.json').read_text())
          assert m['status']=='FINAL_QA_PASS'
          assert m['final_qa_verdict']=='FINAL_QA_PASS_NO_MATERIAL_DEFECT'
          assert m['production_import_ready'] is True
          assert m['authoritative_db_final_count']==1215
          assert m['material_duplicates_found']==0
          assert m['within_batch_material_collisions']==0
          assert m['answer_key_distribution']=={'A':3,'B':3,'C':3,'D':3,'E':3}
          assert m['ncjmm_present'] is False
          assert len(m['items'])==15
          for n in range(1216,1231):
              p=root/f'Q{n:04d}_FINAL_10_10_AUDIT.json'
              a=json.loads(p.read_text())
              assert a['status']=='FINAL_10_10_PASS'
              assert a['verdict']=='PASS_WITH_NO_CHANGES'
              assert a['authoritative_db_final_count']==1215
              assert a['second_possible_answer']=='PASS_NONE'
              assert a['defects']==[] and a['suggested_changes']==[]
              assert all(v==10 for v in a['scores'].values())
              assert a['duplicate_gate']['status']=='PASS'
              assert a['adversarial_second_pass']['result']=='PASS'
          print('FINAL_QA_REVALIDATION=PASS ITEMS=15')
          PY
      - name: Persist immutable FINAL QA evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'USMLE Final QA'
          git config user.email 'actions@users.noreply.github.com'
          git add usmle/audit/Q1216_Q1230_FINAL_QA_PASS.json usmle/audit/Q121*_FINAL_10_10_AUDIT.json usmle/audit/Q122*_FINAL_10_10_AUDIT.json usmle/audit/Q1230_FINAL_10_10_AUDIT.json
          git diff --cached --quiet && { echo 'No audit changes to persist'; exit 1; }
          git commit -m 'USMLE: FINAL_QA_PASS Q1216-Q1230 bound to Q1215'
          git pull --rebase origin main
          git push origin HEAD:main
