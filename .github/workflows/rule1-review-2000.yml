name: RULE1 read-only review canonical 2000
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  review:
    if: github.head_ref == 'rule1-review-2000-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Inspect remaining source bank read-only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sqlite3,json,subprocess
          from collections import Counter
          SRC='NCLEX_COMMERCIAL_MASTER_CURRENT.db'; CAN='NCLEX_CANONICAL.db'
          exp_src='07e335d471ef1b4689406ba41eb98eaa2ca41472'; exp_can='182a1e979e11d62bebc85c5ceb859056b8812963'
          sb=subprocess.check_output(['git','rev-parse',f'HEAD:{SRC}'],text=True).strip(); cb=subprocess.check_output(['git','rev-parse',f'HEAD:{CAN}'],text=True).strip()
          if (sb,cb)!=(exp_src,exp_can): raise SystemExit(f'BLOCKED blobs source={sb} canonical={cb}')
          s=sqlite3.connect(f'file:{SRC}?mode=ro',uri=True); s.row_factory=sqlite3.Row
          c=sqlite3.connect(f'file:{CAN}?mode=ro',uri=True); c.row_factory=sqlite3.Row
          si=s.execute('PRAGMA integrity_check').fetchone()[0]; ci=c.execute('PRAGMA integrity_check').fetchone()[0]
          sr=s.execute('SELECT * FROM questions ORDER BY stable_sort_key,question_uid').fetchall(); cr=c.execute('SELECT question_uid FROM questions').fetchall(); cu={r[0] for r in cr}
          rem=[r for r in sr if r['question_uid'] not in cu]
          def cnt(rows,k,none='NULL'): return dict(Counter((r[k] if r[k] not in (None,'') else none) for r in rows))
          def dimensions(rows):
            return {
              'count':len(rows),
              'mode':cnt(rows,'mode'),
              'item_type_raw':cnt(rows,'item_type_raw'),
              'renderer_type':cnt(rows,'renderer_type'),
              'client_need':cnt(rows,'client_need'),
              'category_id':cnt(rows,'category_id'),
              'difficulty':cnt(rows,'difficulty'),
              'cjmm_skill':cnt(rows,'cjmm_skill'),
              'case_item_count':sum(1 for r in rows if r['case_uid'] not in (None,'')),
              'distinct_case_uid_count':len({r['case_uid'] for r in rows if r['case_uid'] not in (None,'')}),
              'official_case_slot_count':sum(1 for r in rows if r['official_case_slot'] not in (None,'')),
              'slot_variant':cnt(rows,'slot_variant'),
            }
          out={'source_blob':sb,'canonical_blob':cb,'source_integrity':si,'canonical_integrity':ci,'source_total':len(sr),'canonical_uid_count':len(cu),'remaining_total':len(rem),'full_source':dimensions(sr),'remaining':dimensions(rem),'remaining_first_30':[{'uid':r['question_uid'],'stable_sort_key':r['stable_sort_key'],'mode':r['mode'],'item_type_raw':r['item_type_raw'],'case_uid':r['case_uid'],'cjmm_skill':r['cjmm_skill'],'client_need':r['client_need']} for r in rem[:30]]}
          print('SOURCE_REMAINDER_SUMMARY='+json.dumps(out,ensure_ascii=False,separators=(',',':')))
          open('source_remainder_summary.json','w').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          s.close(); c.close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rule1-source-remainder-review
          path: source_remainder_summary.json
          retention-days: 1
