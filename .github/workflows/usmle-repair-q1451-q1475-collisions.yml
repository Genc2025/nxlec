name: USMLE repair Q1451-Q1475 collisions
on:
  push:
    paths:
      - '.github/workflows/usmle-repair-q1451-q1475-collisions.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize repaired candidate
        run: python usmle/repair_q1451_q1475_collisions.py
      - name: Validate repaired candidate contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('usmle/batch_specs_1401_1500/03_q1451_q1475_author_20260908_collision_repaired.json')
          b=json.loads(p.read_text())
          assert b['candidate_count']==25
          assert [x['num'] for x in b['items']]==list(range(1451,1476))
          assert b['answer_key_sequence']=='ABCDEABCDEABCDEABCDEABCDE'
          assert b['answer_key_distribution']=={'A':5,'B':5,'C':5,'D':5,'E':5}
          assert b['production_import_ready'] is False
          assert b['repair_metadata']['replaced_items']==[1454,1460,1473]
          assert 'ncjmm' not in p.read_text().casefold()
          for x in b['items']:
              assert set(x['item']['options'])==set('ABCDE')
              assert len(x['evidence_map'])==5
              em={e['option']:e for e in x['evidence_map']}
              assert set(em)==set('ABCDE')
              for L in 'ABCDE':
                  assert em[L]['claim']==x['explanation']['distractor_explanations'][L]
          print('REPAIRED_CONTRACT_PASS')
          PY
      - name: Commit repaired candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add usmle/batch_specs_1401_1500/03_q1451_q1475_author_20260908_collision_repaired.json
          git commit -m 'usmle: materialize repaired Q1451-Q1475 candidate' || exit 1
          git push
