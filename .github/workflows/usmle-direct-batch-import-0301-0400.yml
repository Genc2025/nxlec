name: USMLE direct batch import Q0301-Q0400

on:
  push:
    branches: [main]
    paths:
      - 'usmle/batch_specs_0301_0400/READY'

permissions:
  contents: write

concurrency:
  group: usmle-direct-batch-0301_0400-main
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Deterministic all-or-nothing batch import
        run: python usmle/direct_batch_import_0301_0400.py usmle/batch_specs_0301_0400
      - name: Verify authoritative database
        run: |
          python - <<'PY'
          import sqlite3
          con=sqlite3.connect("usmle/data/usmle-step1.db")
          assert con.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
          n=con.execute("SELECT COUNT(*) FROM items WHERE status='PRODUCTION_READY'").fetchone()[0]
          if n != 400: raise SystemExit(f"expected 400, found {n}")
          print(f"{n}/5040")
          PY
      - name: Persist USMLE authoritative state
        run: |
          git config user.name "USMLE Direct Batch Importer"
          git config user.email "actions@users.noreply.github.com"
          git add -f usmle/data/usmle-step1.db usmle/state/last_run.json
          git commit -m "Import reviewed USMLE Step 1 items 0301-0400"
          git pull --rebase origin main
          git push origin HEAD:main
