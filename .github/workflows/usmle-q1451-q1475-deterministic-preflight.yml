name: USMLE Q1451-Q1475 deterministic preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/usmle-q1451-q1475-deterministic-preflight.yml'
      - 'usmle/verify_q1451_q1475_preflight.py'
      - 'usmle/batch_specs_1401_1500/03_q1451_q1475_author_20260908.json'

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run deterministic preflight
        run: python usmle/verify_q1451_q1475_preflight.py

      - name: Commit preflight evidence
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add usmle/audit/Q1451_Q1475_DETERMINISTIC_PREFLIGHT.json
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'usmle: record deterministic preflight Q1451-Q1475'
            git push origin HEAD:main
          fi
