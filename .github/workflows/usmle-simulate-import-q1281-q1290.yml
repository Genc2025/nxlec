name: USMLE Simulate Import Q1281-Q1290

on:
  push:
    branches: [main]
    paths:
      - 'usmle/audit/SIMULATE_IMPORT_TRIGGER_Q1281_Q1290'

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify immutable simulation inputs
        run: |
          set -euo pipefail
          test "$(git hash-object usmle/step2_import_q1281_q1290.py)" = "7cfe92fba8105215e2615f8db947a265a201d197"
          test "$(git hash-object usmle/step2_import_q1261_q1270.py)" = "c73f192deb88d6703845a8976e10dbd05d8e34fb"
          test "$(git hash-object usmle/data/usmle-step1.db)" = "c6d3a9df9c8887b6ff3f3dbac6c710ed564bb4ed"
          test "$(git hash-object usmle/batch_specs_1201_1300/11_q1281_q1290_author_20260906.json)" = "fdda09072509425b0321aafbe921aa95fed53aee"
          test "$(git hash-object usmle/audit/Q1281_Q1290_FINAL_QA_PASS.json)" = "96f83602bf0fe923355e6d337de08dadaf366f1d"
      - name: Create detached production simulation worktree
        run: |
          set -euo pipefail
          rm -rf /tmp/usmle-q1290-sim
          git worktree add --detach /tmp/usmle-q1290-sim HEAD
          cd /tmp/usmle-q1290-sim
          python -m py_compile usmle/step2_import_q1281_q1290.py usmle/step2_import_q1261_q1270.py
      - name: Execute full importer only in detached worktree
        env:
          Q1281_Q1290_MANIFEST_BLOB: 96f83602bf0fe923355e6d337de08dadaf366f1d
        run: |
          set -euo pipefail
          cd /tmp/usmle-q1290-sim
          python usmle/step2_import_q1281_q1290.py | tee /tmp/q1281-q1290-simulation-result.json
      - name: Independently verify simulated post-state
        run: |
          set -euo pipefail
          cd /tmp/usmle-q1290-sim
          python - <<'PY'
          import hashlib,json,pathlib,re,sqlite3,subprocess
          db=pathlib.Path('usmle/data/usmle-step1.db')
          s=json.loads(pathlib.Path('usmle/state/step2_final_q0001_q1290.json').read_text())
          f=json.loads(pathlib.Path('usmle/audit/STEP2_FINAL_10_10_Q0001_Q1290.json').read_text())
          assert s['final_status']=='FINAL_10_10_PASS' and s['item_count']==1290 and s['step2_final_review_count']==1290
          assert s['contiguous_q0001_q1290'] is True and s['q1281_q1290_present_exactly_once'] is True
          assert s['sqlite_integrity_check']=='ok' and s['payload_review_consistency']=='PASS'
          assert s['answer_position_new_block']['balanced']=={'A':2,'B':2,'C':2,'D':2,'E':2}
          assert s['answer_position_new_block']['sequence']=='BDACECAEDB'
          assert s['blueprint_increment_new_block']=={'Reproductive & Endocrine Systems':5,'Respiratory & Renal/Urinary Systems':5}
          assert s['competency_increment_new_block']=={'Patient Care: Diagnosis':5,'Medical Knowledge: Applying Foundational Science Concepts':5}
          assert s['new_block']['candidate_batch_blob']=='fdda09072509425b0321aafbe921aa95fed53aee'
          assert s['new_block']['final_qa_manifest_blob']=='96f83602bf0fe923355e6d337de08dadaf366f1d'
          assert f['production_import_completed'] is True and f['final_verdict']=='FINAL_10_10_PASS_NO_MATERIAL_DEFECT'
          blob=subprocess.check_output(['git','hash-object',str(db)],text=True).strip()
          assert blob==s['post_authoritative_db_blob'] and blob!='c6d3a9df9c8887b6ff3f3dbac6c710ed564bb4ed'
          assert hashlib.sha256(db.read_bytes()).hexdigest()==s['post_authoritative_db_sha256']
          con=sqlite3.connect(db.resolve().as_uri()+'?mode=ro&immutable=1',uri=True)
          assert con.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert con.execute("select count(*) from step2_final_items where final_status='FINAL_10_10_PASS'").fetchone()[0]==1290
          assert con.execute("select count(*) from step2_final_reviews where final_status='FINAL_10_10_PASS'").fetchone()[0]==1290
          rows=con.execute("select candidate_id,payload_json from step2_final_items where final_status='FINAL_10_10_PASS'").fetchall(); con.close()
          nums=[];new={}
          for cid,pj in rows:
              m=re.search(r'DIRECT-(\d{4})',cid);assert m,cid
              n=int(m.group(1));nums.append(n)
              if 1281<=n<=1290:new[n]=json.loads(pj)
          assert set(nums)==set(range(1,1291)) and len(nums)==len(set(nums))==1290
          assert set(new)==set(range(1281,1291))
          assert ''.join(new[n]['item']['intended_key'] for n in range(1281,1291))=='BDACECAEDB'
          assert all(new[n]['blueprint']['primary_system'] in {'Reproductive & Endocrine Systems','Respiratory & Renal/Urinary Systems'} for n in new)
          assert all(new[n]['blueprint']['primary_competency'] in {'Patient Care: Diagnosis','Medical Knowledge: Applying Foundational Science Concepts'} for n in new)
          assert all(new[n]['blueprint']['official_outline_path']==[new[n]['blueprint']['primary_system']] for n in new)
          assert all(new[n]['step2_final_audit']['final_10_10_gate']=='FINAL_10_10_PASS' for n in new)
          assert all(new[n]['step2_final_audit']['canonical_duplicate_gate_passed'] is True for n in new)
          assert all(new[n]['step2_final_audit']['second_answer_attack_passed'] is True for n in new)
          assert not pathlib.Path(str(db)+'-wal').exists() and not pathlib.Path(str(db)+'-shm').exists()
          print('SIMULATED_POSTSTATE_VERIFY=PASS COUNT=1290 REVIEWS=1290 BLOB='+blob)
          PY
      - name: Prove main checkout remained untouched
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test "$(git hash-object usmle/data/usmle-step1.db)" = "c6d3a9df9c8887b6ff3f3dbac6c710ed564bb4ed"
          test ! -e usmle/state/step2_final_q0001_q1290.json
          test ! -e usmle/audit/STEP2_FINAL_10_10_Q0001_Q1290.json
          echo MAIN_CHECKOUT_UNTOUCHED=PASS
