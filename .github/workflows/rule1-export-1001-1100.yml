name: Rule 1 export V2-Q1001-V2-Q1100
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rule1-export-1001-1100.yml'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Export exact source rows and pin DB blobs
        shell: bash
        run: |
          python3 - <<'PY'
          import json, sqlite3, subprocess
          from pathlib import Path
          SOURCE='NCLEX_COMMERCIAL_MASTER_CURRENT.db'
          CANON='NCLEX_CANONICAL.db'
          EXPECTED_SOURCE='07e335d471ef1b4689406ba41eb98eaa2ca41472'
          EXPECTED_CANON='70e98d4a4b1ea3313f77856a91d58b14fc63c86f'
          sb=subprocess.check_output(['git','rev-parse',f'HEAD:{SOURCE}'],text=True).strip()
          cb=subprocess.check_output(['git','rev-parse',f'HEAD:{CANON}'],text=True).strip()
          if sb!=EXPECTED_SOURCE: raise SystemExit(f'BLOCKED source blob {sb}')
          if cb!=EXPECTED_CANON: raise SystemExit(f'BLOCKED canonical blob {cb}')
          for db,expected in [(SOURCE,3525),(CANON,1000)]:
            con=sqlite3.connect(db)
            integ=con.execute('PRAGMA integrity_check').fetchone()[0]
            cnt=con.execute('SELECT COUNT(*) FROM questions').fetchone()[0]
            dup=con.execute('SELECT COUNT(*) FROM (SELECT question_uid,COUNT(*) n FROM questions GROUP BY question_uid HAVING n>1)').fetchone()[0]
            con.close()
            if integ!='ok' or cnt!=expected or dup!=0: raise SystemExit(f'BLOCKED {db}: integrity={integ} count={cnt} dup={dup}')
          uids=[f'V2-Q{n:04d}' for n in range(1001,1101)]
          con=sqlite3.connect(SOURCE); con.row_factory=sqlite3.Row
          marks=','.join('?' for _ in uids)
          rows=con.execute(f'SELECT * FROM questions WHERE question_uid IN ({marks})',uids).fetchall()
          con.close()
          by={r['question_uid']:dict(r) for r in rows}
          if set(by)!=set(uids) or len(by)!=100: raise SystemExit(f'BLOCKED source UID set/count {len(by)}')
          out=Path('/tmp/rule1_q1001_q1100'); out.mkdir(parents=True,exist_ok=True)
          batch=[]
          for uid in uids:
            r=by[uid]
            snap={'source_blob_expected':EXPECTED_SOURCE,'canonical_blob_expected':EXPECTED_CANON,'source_row':r}
            (out/f'{uid}.json').write_text(json.dumps(snap,ensure_ascii=False,indent=2,sort_keys=True),encoding='utf-8')
            batch.append(snap)
          Path('/tmp/RULE1_SOURCE_BATCH_1001_1100.json').write_text(json.dumps(batch,ensure_ascii=False,indent=2),encoding='utf-8')
          print(f'EXPORTED={len(batch)} FIRST={batch[0]["source_row"]["question_uid"]} LAST={batch[-1]["source_row"]["question_uid"]}')
          PY
      - name: Commit snapshots only to staging branch
        shell: bash
        run: |
          git fetch origin rule1-q1001-q1100-staging:refs/remotes/origin/rule1-q1001-q1100-staging
          git checkout -B rule1-q1001-q1100-staging refs/remotes/origin/rule1-q1001-q1100-staging
          mkdir -p staging_items
          for f in /tmp/rule1_q1001_q1100/*.json; do b=$(basename "$f"); test ! -e "staging_items/$b" || { echo "BLOCKED overwrite staging_items/$b"; exit 1; }; cp "$f" "staging_items/$b"; done
          test ! -e RULE1_SOURCE_BATCH_1001_1100.json || { echo 'BLOCKED batch index exists'; exit 1; }
          cp /tmp/RULE1_SOURCE_BATCH_1001_1100.json .
          git config user.name 'Genc2025'
          git config user.email 'gencgrajqevci23@gmail.com'
          git add staging_items/V2-Q10*.json staging_items/V2-Q1100.json RULE1_SOURCE_BATCH_1001_1100.json
          test "$(git diff --cached --name-only | wc -l)" -eq 101
          git commit -m 'Rule 1 stage source snapshots V2-Q1001-V2-Q1100'
          git push origin HEAD:rule1-q1001-q1100-staging
