name: Rule 1 Chronological Batch 006 Q0251-Q0300 Final v2

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-rule1-batch006-chronological-final-v2.yml']

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode existing staged payloads
        run: |
          shopt -s nullglob
          for file in data/clinical_overrides_*.json.gz.b64; do
            json_file="${file%.gz.b64}"; [[ -f "$json_file" ]] && continue
            base64 --decode "$file" | gzip -dc > "$json_file"
          done
          for file in data/clinical_overrides_*.b64; do
            [[ "$file" == *.json.gz.b64 ]] && continue
            json_file="${file%.b64}.json"; [[ -f "$json_file" ]] && continue
            base64 --decode "$file" > "$json_file"
          done
      - name: Build Rule 1 Batch 006 audit artifacts
        run: python tools/build_batch006_chronological_audit.py
      - name: Validate authored evidence and override
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('data/rule1_batch006_chronological_reaudit_evidence_q0251_q0300.json').read_text())
          o=json.loads(Path('data/clinical_overrides_z_rule1_batch006_chronological_q0251_q0300.json').read_text())
          ids=[f'V2-Q{i:04d}' for i in range(251,301)]
          assert [x['id'] for x in e['items']]==ids and len(e['items'])==50
          assert [x['question_uid'] for x in o['questions']]==ids and len(o['questions'])==50
          assert e['legacy_status_evidence'] is False
          assert set(e['substantive_corrections'])=={'V2-Q0271','V2-Q0287','V2-Q0292'}
          assert set(e['secondary_source_exceptions'])=={'V2-Q0251','V2-Q0295'}
          assert len(e['ncsbn_first_check_applicable'])==14
          for x in e['items']:
            assert x['criteria']==11 and x['second_pass']=='PASS' and x['final']=='FINAL_QA_PASS'
            assert x['source_url'].startswith('https://') and x['source_locator'] and x['source_version'] and '2026-08-15' in x['source_version'], (x['id'],x['source_version'])
            q=x['option_qc']; assert q['max_min_ratio']<=1.15 and q['correct_deviation']<=0.10 and q['correct_unique_length_extreme'] is False and q['artificial_padding'] is False
          print('BATCH006_AUTHORED_INPUTS_VALID items=50/50 criteria11=50/50 corrections=3/3 secondary=2/2 ncsbn=14/14')
          PY
      - run: python tools/rebuild_wave27_manifest.py
      - name: Build master DB with Batch 006 override
        run: python tools/build_nclex_master.py
      - run: python tools/enforce_commercial_gate.py
      - run: python tools/enforce_strict_question_gate.py
      - run: python tools/apply_wave26_option_balance.py
      - run: python tools/report_wave26_option_metrics.py
      - name: Apply prior Rule 1 gates
        run: |
          python tools/apply_batch001_final_gate.py
          python tools/apply_batch002_rule1_final_gate.py
          python tools/apply_batch003_rule1_final_gate.py
          python tools/apply_batch004_rule1_final_gate.py
          python tools/verify_batch004_rule1_round2.py
          python tools/apply_batch005_chronological_rule1_final_gate.py
      - name: Apply chronological Rule 1 Batch 006
        run: python tools/apply_batch006_chronological_rule1_final_gate.py
      - name: Preserve off-sequence and wave gates
        run: |
          python tools/apply_batch005_rule1_final_gate.py
          python tools/apply_batch006_rule1_final_gate.py
          python tools/apply_wave25_final_gate.py
          python tools/apply_wave26_manual_final_gate.py
          python tools/apply_wave27_manual_final_gate.py
      - run: python tools/export_pending_audit.py
      - name: Verify integrated Batch 006 and DB
        run: |
          python - <<'PY'
          import json,sqlite3
          from pathlib import Path
          con=sqlite3.connect('NCLEX_COMMERCIAL_MASTER_CURRENT.db')
          integrity=con.execute('PRAGMA integrity_check').fetchone()[0]
          total=con.execute('SELECT COUNT(*) FROM questions').fetchone()[0]
          ready=con.execute('SELECT COUNT(*) FROM questions WHERE commercial_release_ready=1').fetchone()[0]
          gate=con.execute("SELECT value FROM bank_metadata WHERE key='commercial_release_gate'").fetchone()[0]
          meta=con.execute("SELECT value FROM bank_metadata WHERE key='batch006_chronological_q0251_q0300_rule1_final_gate'").fetchone()[0]
          final=con.execute("SELECT COUNT(*) FROM question_final_gate WHERE question_uid BETWEEN 'V2-Q0251' AND 'V2-Q0300' AND final_status='FINAL_QA_PASS'").fetchone()[0]
          manual=con.execute("SELECT COUNT(*) FROM rule1_manual_audit WHERE question_uid BETWEEN 'V2-Q0251' AND 'V2-Q0300' AND criteria_passed_count=11 AND second_pass='PASS' AND final_disposition='FINAL_QA_PASS'").fetchone()[0]
          ev=con.execute("SELECT COUNT(*) FROM rule1_batch006_chronological_reaudit_evidence WHERE criteria_passed_count=11 AND second_pass='PASS' AND final_disposition='FINAL_QA_PASS'").fetchone()[0]
          ncsbn=con.execute("SELECT COUNT(*) FROM rule1_batch006_chronological_reaudit_evidence WHERE ncsbn_first_check=1").fetchone()[0]
          bad=con.execute("SELECT COUNT(*) FROM question_final_gate WHERE question_uid BETWEEN 'V2-Q0251' AND 'V2-Q0300' AND (source_verified<>1 OR blueprint_verified<>1 OR question_quality_verified<>1 OR correct_answer_verified<>1 OR distractors_verified<>1 OR explanation_verified<>1 OR currentness_verified<>1 OR independent_qa_passed<>1 OR no_unresolved_conflict<>1)").fetchone()[0]
          q271=con.execute("SELECT category_id,client_need,difficulty FROM questions WHERE question_uid='V2-Q0271'").fetchone()
          q287=con.execute("SELECT stem,correct_answer_json FROM questions WHERE question_uid='V2-Q0287'").fetchone()
          q292=con.execute("SELECT category_id,client_need,difficulty FROM questions WHERE question_uid='V2-Q0292'").fetchone()
          con.close()
          pending=json.loads(Path('data/pending_audit_next.json').read_text())
          assert integrity=='ok' and total==3525 and ready==0
          assert gate=='CLOSED_PENDING_FULL_BANK_CLINICAL_CURRENTNESS_SOURCE_LICENSING_AND_RELEASE_QA'
          assert meta=='PASS_50_OF_50_REAL_REAUDIT_SECOND_PASS_11_OF_11_2026_08_15'
          assert (final,manual,ev,ncsbn,bad)==(50,50,50,14,0)
          assert q271==(3,'Safety & Infection Prevention and Control','easy')
          assert 'quiet, awake term newborn' in q287[0].lower() and json.loads(q287[1])['correct_option']=='A'
          assert q292==(4,'Health Promotion and Maintenance','easy')
          assert pending['range']==[301,350] and pending['count']==50
          print(f'BATCH006_INTEGRATED_VERIFIED integrity={integrity} total={total} final={final}/50 manual11={manual}/50 evidence11={ev}/50 ncsbn={ncsbn}/14 bad={bad} next={pending["range"]} ready={ready}')
          PY
      - name: Commit integrated Batch 006
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NCLEX_COMMERCIAL_MASTER_CURRENT.db NCLEX_COMMERCIAL_MASTER_CURRENT_AUDIT.md FINAL_QA_BATCH006_Q0251_Q0300_RULE1_10OF10.md data/pending_audit_next.json data/rule1_batch006_chronological_reaudit_evidence_q0251_q0300.json data/clinical_overrides_z_rule1_batch006_chronological_q0251_q0300.json
          git commit -m 'Integrate chronological Rule 1 Batch 006 Q0251-Q0300 [skip ci]'
          git push
