name: USMLE Detached Import Simulation Q1551-Q1555
on:
  push:
    paths:
      - '.github/workflows/usmle-simulate-import-q1551-q1555.yml'
permissions:
  contents: write
jobs:
  detached-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      START_Q: '1551'
      END_Q: '1555'
      PRE_COUNT: '1550'
      DB_BLOB: b909be98a4f3861c443f3b188c2597a290b0b17a
      CAND_PATH: usmle/batch_specs_1501_1600/11_q1551_q1555_author_20260912.json
      CAND_BLOB: 881c9b74438cc0e80a659306bcdbb822f93a76bc
      MAN_PATH: usmle/audit/Q1551_Q1555_FINAL_QA_PASS.json
      MAN_BLOB: 5b2a1b11a810dcfaec32abd66fecfd5cb30f5aef
      SIM_OUT: usmle/audit/Q1551_Q1555_DETACHED_IMPORT_SIMULATION.json
      AUDIT_DATE: '20260912'
      CANDIDATE_STAMP: '20260912T170400Z'
      FINALIZED_AT: '2026-09-12T17:04:00Z'
    steps:
      - uses: actions/checkout@v6
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Run detached next-five simulation
        run: |
          set -euo pipefail
          test "$(git hash-object usmle/data/usmle-step1.db)" = "$DB_BLOB"
          test "$(git hash-object "$CAND_PATH")" = "$CAND_BLOB"
          test "$(git hash-object "$MAN_PATH")" = "$MAN_BLOB"
          python -m py_compile usmle/simulate_import_next5.py
          python usmle/simulate_import_next5.py
          test "$(git hash-object usmle/data/usmle-step1.db)" = "$DB_BLOB"
          python - <<'PY'
          import json,os
          r=json.load(open(os.environ['SIM_OUT']))
          assert r['audit_id']=='Q1551-Q1555-DETACHED-IMPORT-SIMULATION-20260912'
          assert r['status']=='DETACHED_IMPORT_SIMULATION_PASS'
          assert r['pre_production_count']==1550 and r['simulated_post_count']==1555
          assert r['post_simulation_contiguous_q0001_q1555'] is True
          assert r['all_final_qa_gates_bound'] is True
          assert r['production_transactional_import_ready'] is True
          assert r['production_db_modified'] is False
          assert r['failures']==[]
          PY
      - name: Commit simulation report only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$SIM_OUT"
          git commit -m 'usmle: pass detached import simulation Q1551-Q1555'
          git pull --rebase origin main
          git push
