name: USMLE Detached Import Simulation Q1596-Q1600
on:
  push:
    paths: ['.github/workflows/usmle-simulate-import-q1596-q1600.yml']
permissions:
  contents: write
jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      START_Q: '1596'
      END_Q: '1600'
      PRE_COUNT: '1595'
      DB_BLOB: a14db08555d69cf0f1eb62111acc347cf3dfb38d
      CAND_PATH: usmle/batch_specs_1501_1600/20_q1596_q1600_author_20260915.json
      CAND_BLOB: 585afeba8b7751f0a922a990c1d4f537908f6a1f
      MAN_PATH: usmle/audit/Q1596_Q1600_FINAL_QA_PASS.json
      MAN_BLOB: 830268f9d1a36e368577ff3e1feaae36d5884b69
      SIM_OUT: usmle/audit/Q1596_Q1600_DETACHED_IMPORT_SIMULATION.json
      AUDIT_DATE: '20260915'
      CANDIDATE_STAMP: '20260915T075700Z'
      FINALIZED_AT: '2026-09-15T07:57:00Z'
    steps:
      - uses: actions/checkout@v6
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Simulate next five
        run: |
          set -euo pipefail
          test "$(git hash-object usmle/data/usmle-step1.db)" = "$DB_BLOB"
          test "$(git hash-object "$CAND_PATH")" = "$CAND_BLOB"
          test "$(git hash-object "$MAN_PATH")" = "$MAN_BLOB"
          python usmle/simulate_import_next5.py
          test "$(git hash-object usmle/data/usmle-step1.db)" = "$DB_BLOB"
          python - <<'PY'
          import json,os
          r=json.load(open(os.environ['SIM_OUT']))
          assert r['status']=='DETACHED_IMPORT_SIMULATION_PASS'
          assert r['pre_production_count']==1595 and r['simulated_post_count']==1600
          assert r['post_simulation_contiguous_q0001_q1600'] is True
          assert r['production_transactional_import_ready'] is True
          assert r['production_db_modified'] is False and r['failures']==[]
          PY
      - name: Persist simulation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$SIM_OUT"
          git commit -m 'usmle: pass detached import simulation Q1596-Q1600'
          git pull --rebase origin main
          git push
