name: Check Batch 006 source version locators
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-batch006-version-locators.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/build_batch006_chronological_audit.py
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('data/rule1_batch006_chronological_reaudit_evidence_q0251_q0300.json').read_text())
          for x in e['items']:
              bad=[]
              if not x['source_url'].startswith('https://'): bad.append('url')
              if not x['source_locator']: bad.append('locator')
              if not x['source_version']: bad.append('version')
              if '2026-08-15' not in x['source_version']: bad.append('date')
              if bad: print('BAD',x['id'],bad,repr(x['source_version']))
          PY
