name: USMLE Research Q1261-Q1270 NCBI

on:
  push:
    branches: [main]
    paths:
      - 'usmle/audit/RESEARCH_TRIGGER_Q1261_Q1270_NCBI'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Query NCBI E-utilities directly
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile usmle/research_q1261_q1270_ncbi.py
          python usmle/research_q1261_q1270_ncbi.py > q1261-q1270-ncbi-evidence.json
      - name: Print evidence index
        shell: bash
        run: |
          python - <<'PY'
          import json
          d=json.load(open('q1261-q1270-ncbi-evidence.json'))
          for k,v in d.items():
              print('\n###',k)
              for h in v['hits']:
                  print(h['pmid'],h['date'],h['title'])
                  print('URL',h['url'])
                  print('ABSTRACT',h['abstract'][:1600])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: q1261-q1270-ncbi-evidence
          path: q1261-q1270-ncbi-evidence.json
          if-no-files-found: error
