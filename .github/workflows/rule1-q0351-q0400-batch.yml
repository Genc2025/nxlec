name: Rule1 Q0351-Q0400 canonical batch
on:
  push:
    branches: [rule1-q0351-q0400-staging]
    paths:
      - '.github/workflows/rule1-q0351-q0400-batch.yml'
permissions:
  contents: write
concurrency:
  group: rule1-q0351-q0400-batch
  cancel-in-progress: false
jobs:
  batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate approved payloads and apply one SQLite transaction
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib, json, sqlite3, subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          SOURCE=Path('NCLEX_COMMERCIAL_MASTER_CURRENT.db')
          CANONICAL=Path('NCLEX_CANONICAL.db')
          APPROVED=Path('approved_items')
          REPORT=Path('RULE1_BATCH_Q0351_Q0400_REPORT.json')
          EXPECTED_SOURCE_BLOB='07e335d471ef1b4689406ba41eb98eaa2ca41472'
          EXPECTED_CANONICAL_BLOB='fb6d0cd1be359bbb7198bf149b286af779565927'
          GATES=[
            'source_authority_verified','currentness_verified','exact_locator_verified','stem_verified',
            'correct_answer_verified','distractors_verified','rationale_verified','educational_objective_verified',
            'ambiguity_verified','second_answer_excluded','cueing_verified','blueprint_verified',
            'independent_qa_passed','no_unresolved_conflict'
          ]
          REQUIRED_TOP=[
            'question_uid','source_bank','source_table','source_id','mode','category_id','client_need',
            'difficulty','item_type_raw','renderer_type','stem','item_data','correct_answer','rationale',
            'educational_objective','source_organization','source_document_title','source_version_date',
            'source_accessed_date','source_locator','source_url','source_claim_supported',
            'blueprint_source_organization','blueprint_document_title','blueprint_version','blueprint_locator',
            'blueprint_url','blueprint_topic','stable_sort_key','source_db_filename','source_db_blob_sha',
            'source_original','correction_summary','audit_status','second_pass_status','audit_date_utc',
            'audit_reviewer','gates','audit_findings'
          ]
          OPTIONAL_NULL={'case_uid','original_sequence','official_case_slot','slot_variant','specialty','cjmm_skill','scoring_rule'}
          REQUIRED_DB=[
            'question_uid','source_bank','source_table','source_id','mode','category_id','client_need','difficulty',
            'item_type_raw','renderer_type','stem','item_data_json','correct_answer_json','rationale','educational_objective',
            'source_organization','source_document_title','source_version_date','source_accessed_date','source_locator',
            'source_url','source_claim_supported','blueprint_source_organization','blueprint_document_title','blueprint_version',
            'blueprint_locator','blueprint_url','blueprint_topic','stable_sort_key','source_db_filename','source_db_blob_sha',
            'source_original_json','correction_summary','audit_status','second_pass_status','audit_date_utc','audit_reviewer',
            'audit_findings_json','payload_sha256','created_at_utc'
          ]
          JSON_COLS=['item_data_json','correct_answer_json','source_original_json','audit_findings_json']

          def sh(*args):
              return subprocess.check_output(args,text=True).strip()
          def cjson(v):
              return json.dumps(v,ensure_ascii=False,sort_keys=True,separators=(',',':'))
          def payload_hash(p):
              return hashlib.sha256(cjson(p).encode('utf-8')).hexdigest()
          def fingerprint(con, where, params=()):
              rows=con.execute(f'SELECT * FROM questions WHERE {where} ORDER BY question_uid',params).fetchall()
              packed=[list(r) for r in rows]
              return hashlib.sha256(json.dumps(packed,ensure_ascii=False,separators=(',',':')).encode('utf-8')).hexdigest(),len(rows)
          def vals_for(p, now):
              vals={
                'question_uid':p['question_uid'],'source_bank':p['source_bank'],'source_table':p['source_table'],'source_id':p['source_id'],
                'mode':p['mode'],'case_uid':p.get('case_uid'),'original_sequence':p.get('original_sequence'),
                'official_case_slot':p.get('official_case_slot'),'slot_variant':p.get('slot_variant'),'category_id':p['category_id'],
                'client_need':p['client_need'],'specialty':p.get('specialty'),'difficulty':p['difficulty'],'cjmm_skill':p.get('cjmm_skill'),
                'item_type_raw':p['item_type_raw'],'renderer_type':p['renderer_type'],'stem':p['stem'],
                'item_data_json':cjson(p['item_data']),'correct_answer_json':cjson(p['correct_answer']),
                'rationale':p['rationale'],'scoring_rule':p.get('scoring_rule'),'educational_objective':p['educational_objective'],
                'source_organization':p['source_organization'],'source_document_title':p['source_document_title'],
                'source_version_date':p['source_version_date'],'source_accessed_date':p['source_accessed_date'],
                'source_locator':p['source_locator'],'source_url':p['source_url'],'source_claim_supported':p['source_claim_supported'],
                'blueprint_source_organization':p['blueprint_source_organization'],'blueprint_document_title':p['blueprint_document_title'],
                'blueprint_version':p['blueprint_version'],'blueprint_locator':p['blueprint_locator'],'blueprint_url':p['blueprint_url'],
                'blueprint_topic':p['blueprint_topic'],'stable_sort_key':p['stable_sort_key'],'source_db_filename':p['source_db_filename'],
                'source_db_blob_sha':p['source_db_blob_sha'],'source_original_json':cjson(p['source_original']),
                'correction_summary':p['correction_summary'],'audit_status':p['audit_status'],'second_pass_status':p['second_pass_status'],
                'audit_date_utc':p['audit_date_utc'],'audit_reviewer':p['audit_reviewer'],
                **{g:int(p['gates'][g]) for g in GATES},
                'audit_findings_json':cjson(p['audit_findings']),'payload_sha256':payload_hash(p),'created_at_utc':now,
              }
              return vals

          # PRE-TRANSACTION GATE: files + JSON + SHA + real SQLite + source snapshots.
          expected_uids=[f'V2-Q{i:04d}' for i in range(351,401)]
          expected_files={f'{u}.json' for u in expected_uids}
          actual_files={p.name for p in APPROVED.glob('*.json')}
          if actual_files != expected_files:
              raise SystemExit(f'approved_items set mismatch expected=50 actual={len(actual_files)} missing={sorted(expected_files-actual_files)} extra={sorted(actual_files-expected_files)}')

          payloads=[]
          for uid in expected_uids:
              path=APPROVED/f'{uid}.json'
              try:
                  p=json.loads(path.read_text(encoding='utf-8'))
              except Exception as e:
                  raise SystemExit(f'Bad JSON {path}: {e}')
              missing=[k for k in REQUIRED_TOP if k not in p or (p[k] in ('',None) and k not in OPTIONAL_NULL)]
              if missing: raise SystemExit(f'{uid} missing required fields: {missing}')
              if p['question_uid']!=uid: raise SystemExit(f'{uid} filename/payload UID mismatch')
              if p['source_bank']!='v2' or p['source_id']!=int(uid[-4:]): raise SystemExit(f'{uid} source identity mismatch')
              if p['audit_status']!='FINAL_QA_PASS' or p['second_pass_status']!='PASS': raise SystemExit(f'{uid} final status invalid')
              bad=[g for g in GATES if p['gates'].get(g)!=1]
              if bad: raise SystemExit(f'{uid} failed gates: {bad}')
              if p['source_db_filename']!=SOURCE.name or p['source_db_blob_sha']!=EXPECTED_SOURCE_BLOB: raise SystemExit(f'{uid} source DB metadata mismatch')
              payloads.append(p)
          if len({p['question_uid'] for p in payloads})!=50: raise SystemExit('Duplicate approved UID')

          head_source=sh('git','rev-parse',f'HEAD:{SOURCE}')
          head_canonical=sh('git','rev-parse',f'HEAD:{CANONICAL}')
          file_source=sh('git','hash-object',str(SOURCE))
          file_canonical_before=sh('git','hash-object',str(CANONICAL))
          if head_source!=EXPECTED_SOURCE_BLOB or file_source!=EXPECTED_SOURCE_BLOB:
              raise SystemExit(f'Source blob mismatch HEAD={head_source} file={file_source}')
          if head_canonical!=EXPECTED_CANONICAL_BLOB or file_canonical_before!=EXPECTED_CANONICAL_BLOB:
              raise SystemExit(f'Canonical base blob mismatch HEAD={head_canonical} file={file_canonical_before}')

          src=sqlite3.connect(SOURCE); src.row_factory=sqlite3.Row
          con=sqlite3.connect(CANONICAL); con.row_factory=sqlite3.Row
          if src.execute('PRAGMA integrity_check').fetchone()[0]!='ok': raise SystemExit('Source integrity_check failed')
          if con.execute('PRAGMA integrity_check').fetchone()[0]!='ok': raise SystemExit('Canonical pre-write integrity_check failed')
          pre_count=con.execute('SELECT COUNT(*) FROM questions').fetchone()[0]
          if pre_count!=350: raise SystemExit(f'Canonical pre-count expected 350 got {pre_count}')
          pre_dup=con.execute('SELECT COUNT(*) FROM (SELECT question_uid,COUNT(*) c FROM questions GROUP BY question_uid HAVING c>1)').fetchone()[0]
          if pre_dup!=0: raise SystemExit(f'Canonical pre-write duplicate UID={pre_dup}')
          existing_new=con.execute("SELECT question_uid FROM questions WHERE question_uid BETWEEN 'V2-Q0351' AND 'V2-Q0400' ORDER BY question_uid").fetchall()
          if existing_new: raise SystemExit(f'Batch UIDs already exist: {[r[0] for r in existing_new]}')
          old_fp,old_n=fingerprint(con,"question_uid BETWEEN 'V2-Q0001' AND 'V2-Q0350'")
          if old_n!=350: raise SystemExit(f'Expected 350 protected rows, got {old_n}')

          for p in payloads:
              row=src.execute('SELECT * FROM questions WHERE question_uid=?',(p['question_uid'],)).fetchone()
              if row is None: raise SystemExit(f"Source row missing {p['question_uid']}")
              if row['source_bank']!=p['source_bank'] or row['source_id']!=p['source_id'] or row['source_table']!=p['source_table']:
                  raise SystemExit(f"Source identity moved {p['question_uid']}")
              orig=p['source_original']
              exact={
                'stem':row['stem']==orig['stem'],
                'options':json.loads(row['item_data_json'])['options']==orig['options'],
                'correct_option':json.loads(row['correct_answer_json'])['correct_option']==orig['correct_option'],
                'rationale':row['rationale']==orig['rationale'],
                'source_url':row['source_url']==orig['source_url'],
                'source_detail':row['source_detail']==orig['source_detail'],
                'difficulty':row['difficulty']==orig['difficulty'],
              }
              if not all(exact.values()): raise SystemExit(f"Source snapshot mismatch {p['question_uid']}: {exact}")

          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat()
          # ONE AND ONLY ONE SQLite transaction for all 50 inserts.
          try:
              con.execute('BEGIN IMMEDIATE')
              for p in payloads:
                  vals=vals_for(p,now)
                  cols=list(vals)
                  con.execute(f"INSERT INTO questions ({','.join(cols)}) VALUES ({','.join('?' for _ in cols)})",[vals[c] for c in cols])
              con.commit()
          except Exception:
              con.rollback()
              raise

          # POST-WRITE VERIFICATION AGAINST REAL SQLITE.
          integrity=con.execute('PRAGMA integrity_check').fetchone()[0]
          total=con.execute('SELECT COUNT(*) FROM questions').fetchone()[0]
          duplicate_uid=con.execute('SELECT COUNT(*) FROM (SELECT question_uid,COUNT(*) c FROM questions GROUP BY question_uid HAVING c>1)').fetchone()[0]
          if integrity!='ok' or total!=400 or duplicate_uid!=0:
              raise SystemExit(f'Post-write core failure integrity={integrity} count={total} duplicate_uid={duplicate_uid}')

          missing_required=0
          for r in con.execute('SELECT * FROM questions'):
              for c in REQUIRED_DB:
                  v=r[c]
                  if v is None or (isinstance(v,str) and not v.strip()):
                      missing_required+=1
          if missing_required!=0: raise SystemExit(f'missing_required={missing_required}')

          bad_json=0
          for r in con.execute('SELECT * FROM questions'):
              for c in JSON_COLS:
                  try: json.loads(r[c])
                  except Exception: bad_json+=1
          if bad_json!=0: raise SystemExit(f'bad_json={bad_json}')

          failed_gate_rows=con.execute(
              'SELECT COUNT(*) FROM questions WHERE audit_status<>? OR second_pass_status<>? OR '+
              ' OR '.join(f'{g}<>1' for g in GATES),('FINAL_QA_PASS','PASS')
          ).fetchone()[0]
          if failed_gate_rows!=0: raise SystemExit(f'Rows failing final status/14 gates={failed_gate_rows}')

          reread_exact=0
          mismatches={}
          for p in payloads:
              saved=con.execute('SELECT * FROM questions WHERE question_uid=?',(p['question_uid'],)).fetchone()
              expected=vals_for(p,now)
              diff={k:(expected[k],saved[k]) for k in expected if saved[k]!=expected[k]}
              if diff: mismatches[p['question_uid']]=diff
              else: reread_exact+=1
          if reread_exact!=50: raise SystemExit(f'reread_exact={reread_exact}/50 mismatches={list(mismatches)}')

          new_fp,new_n=fingerprint(con,"question_uid BETWEEN 'V2-Q0001' AND 'V2-Q0350'")
          protected_unchanged=(old_fp==new_fp and old_n==new_n==350)
          if not protected_unchanged: raise SystemExit('Q0001-Q0350 changed')

          completed={r[0] for r in con.execute('SELECT question_uid FROM questions')}
          nxt=None
          for r in src.execute("SELECT question_uid FROM questions WHERE source_bank='v2' ORDER BY source_id ASC"):
              if r['question_uid'] not in completed:
                  nxt=r['question_uid']; break
          if nxt!='V2-Q0401': raise SystemExit(f'next UID expected V2-Q0401 got {nxt}')

          con.close(); src.close()
          source_file_after=sh('git','hash-object',str(SOURCE))
          source_unchanged=(source_file_after==EXPECTED_SOURCE_BLOB and sh('git','diff','--name-only','--',str(SOURCE))=='')
          if not source_unchanged: raise SystemExit('Source DB changed during batch')
          canonical_new_blob=sh('git','hash-object',str(CANONICAL))

          report={
            'status':'PASS','batch':'V2-Q0351-V2-Q0400','approved_items_count':50,'approved_json_valid':50,
            'canonical_base_blob':EXPECTED_CANONICAL_BLOB,'canonical_new_blob':canonical_new_blob,
            'source_blob_before':EXPECTED_SOURCE_BLOB,'source_blob_after':source_file_after,'source_db_unchanged':True,
            'canonical_integrity':integrity,'canonical_question_count_before':pre_count,'canonical_question_count_after':total,
            'duplicate_uid_count':duplicate_uid,'missing_required_count':missing_required,'bad_json_count':bad_json,
            'reread_exact':'50/50','all_14_gates_pass_rows':'400/400','protected_q0001_q0350_unchanged':protected_unchanged,
            'protected_q0001_q0350_fingerprint_before':old_fp,'protected_q0001_q0350_fingerprint_after':new_fp,
            'next_uid':nxt,'single_sqlite_transaction':True,'verified_at_utc':now
          }
          REPORT.write_text(json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,sort_keys=True))
          PY
      - name: Commit verified staging DB and PASS report
        shell: bash
        run: |
          test "$(python3 -c "import json; print(json.load(open('RULE1_BATCH_Q0351_Q0400_REPORT.json'))['status'])")" = PASS
          git config user.name 'OpenAI GitHub Connector'
          git config user.email 'github-connector@openai.com'
          git add NCLEX_CANONICAL.db RULE1_BATCH_Q0351_Q0400_REPORT.json
          changed=$(git diff --cached --name-only)
          printf '%s\n' "$changed"
          test "$changed" = $'NCLEX_CANONICAL.db\nRULE1_BATCH_Q0351_Q0400_REPORT.json'
          git commit -m 'Stage canonical batch V2-Q0351-V2-Q0400 350 to 400'
          git pull --rebase origin rule1-q0351-q0400-staging
          git push origin rule1-q0351-q0400-staging
