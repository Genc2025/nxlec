name: Repair Batch 006 builder syntax

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-batch006-builder-syntax.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair malformed Q0288 metadata line
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/build_batch006_chronological_rule1_artifacts.py')
          s=p.read_text()
          bad='288:("American Heart Association — Treating Arrhythmias in Children, Normal ranges for children: infants have faster resting rates (about 100–190) than older children/teenagers (about 60–100)."," +\n""AHA page last reviewed 2024-10-29; currentness rechecked 2026-08-15 against current AHA pediatric resuscitation resources."),'
          good='288:("American Heart Association — Treating Arrhythmias in Children, Normal ranges for children: infants have faster resting rates (about 100–190) than older children/teenagers (about 60–100).","AHA page last reviewed 2024-10-29; currentness rechecked 2026-08-15 against current AHA pediatric resuscitation resources."),'
          if bad not in s:
              raise SystemExit('expected malformed snippet not found')
          p.write_text(s.replace(bad,good))
          PY
          python -m py_compile tools/build_batch006_chronological_rule1_artifacts.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/build_batch006_chronological_rule1_artifacts.py
          git commit -m "Fix Batch 006 builder metadata syntax [skip ci]"
          git push
