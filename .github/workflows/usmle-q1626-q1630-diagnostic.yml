name: USMLE Q1626-Q1630 Diagnostic
on:
  push:
    paths: ['.github/workflows/usmle-q1626-q1630-diagnostic.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DB_BLOB: 3560a1d056dd8aca9367f8079215d18b4379174d
      CANONICAL_COUNT: '1625'
      CAND_PATH: usmle/batch_specs_1601_1700/06_q1626_q1630_author_20260919.json
      START_Q: '1626'
      END_Q: '1630'
      OUT_PATH: usmle/audit/Q1626_Q1630_ZERO_TRUST.json
      AUDIT_DATE: '20260919'
      FREEZE_DATE: '2026-09-19'
      DIAG_OUT: usmle/audit/Q1626_Q1630_DIAGNOSTIC_20260919.json
    steps:
      - uses: actions/checkout@v6
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Diagnose
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          def run(cmd):
              p=subprocess.run(cmd,shell=True,text=True,capture_output=True,env=os.environ.copy())
              return {'rc':p.returncode,'stdout_tail':p.stdout[-5000:],'stderr_tail':p.stderr[-5000:]}
          d={'db_blob':os.environ['DB_BLOB'],'stages':{}}
          d['stages']['bind']=run('test "$(git hash-object usmle/data/usmle-step1.db)" = "$DB_BLOB"')
          d['stages']['author']=run('python usmle/author_q1626_q1630.py')
          d['stages']['freeze']=run('python usmle/freeze_candidate_generic.py') if d['stages']['author']['rc']==0 else {'rc':999,'stdout_tail':'','stderr_tail':'skipped'}
          d['stages']['audit']=run('python usmle/audit_candidate_zero_trust_current.py') if d['stages']['freeze']['rc']==0 else {'rc':999,'stdout_tail':'','stderr_tail':'skipped'}
          d['candidate_exists']=Path(os.environ['CAND_PATH']).exists()
          d['audit_exists']=Path(os.environ['OUT_PATH']).exists()
          d['overall']='PASS' if all(d['stages'][k]['rc']==0 for k in ('bind','author','freeze','audit')) else 'FAIL'
          Path(os.environ['DIAG_OUT']).parent.mkdir(exist_ok=True)
          Path(os.environ['DIAG_OUT']).write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          PY
      - name: Persist
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DIAG_OUT"
          git commit -m 'usmle: diagnose Q1626-Q1630 zero-trust'
          git pull --rebase origin main
          git push

