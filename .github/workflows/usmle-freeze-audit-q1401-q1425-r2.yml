name: USMLE Freeze Audit Q1401-Q1425 R2
on:
  push:
    paths:
      - '.github/workflows/usmle-freeze-audit-q1401-q1425-r2.yml'
permissions:
  contents: write
jobs:
  freeze-audit-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CAND_PATH: usmle/batch_specs_1401_1500/01_q1401_q1425_author_20260908_schema_repaired.json
      DB_BLOB: 1a0f0b702f86a57624161413ba60fa4ce88e8d97
      START_Q: '1401'
      END_Q: '1425'
      OUT_PATH: usmle/audit/Q1401_Q1425_ZERO_TRUST.json
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Bind immutable pre-repair state
        run: |
          set -euo pipefail
          test "$(git hash-object "$CAND_PATH")" = "077c7fdcf8deda30407f0fdd4cca16edcceb6bca"
          test "$(git hash-object usmle/data/usmle-step1.db)" = "$DB_BLOB"
      - name: Apply seven unique-construct replacements
        run: |
          set -euo pipefail
          python -m py_compile usmle/repair_q1401_q1425_cross_collisions.py
          python usmle/repair_q1401_q1425_cross_collisions.py
      - name: Freeze all declared source locator components
        run: |
          set -euo pipefail
          python -m py_compile usmle/freeze_candidate_generic.py
          python usmle/freeze_candidate_generic.py
          echo "CAND_BLOB=$(git hash-object "$CAND_PATH")" >> "$GITHUB_ENV"
          python - <<'PY'
          import json,os
          b=json.load(open(os.environ['CAND_PATH']))
          assert b['technical_integrity']['source_hashes_complete'] is True
          assert 'ncjmm' not in open(os.environ['CAND_PATH']).read().casefold()
          assert all(s.get('source_page_sha256') and s.get('cited_section_sha256') and s.get('cited_locator_component_count',0)>=1 for x in b['items'] for s in x['sources'])
          expected={1401:'elacestrant',1402:'mavorixafor',1404:'maribavir',1411:'pirtobrutinib',1414:'lenacapavir',1423:'fezolinetant',1425:'vamorolone'}
          docs={x['num']:x for x in b['items']}
          assert all(docs[q]['drug']==d for q,d in expected.items())
          print('Q1401_Q1425_REPAIR_FREEZE=PASS')
          PY
      - name: Zero-trust audit from zero
        run: |
          set -euo pipefail
          python -m py_compile usmle/audit_candidate_zero_trust_adaptive.py
          python usmle/audit_candidate_zero_trust_adaptive.py
      - name: Enforce and build R2 final manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          a=pathlib.Path(os.environ['OUT_PATH']); r=json.load(open(a)); n=25
          assert r['verdict']=='ZERO_TRUST_PASS' and r['failures']==[] and r['item_count']==n
          assert all(x['status']=='PASS' and x['source_live_binding']=='PASS' and x['second_answer_attack']=='PASS' and x['blueprint']=='PASS' for x in r['item_reports'])
          assert all(x['evidence_derived_key']==x['intended_key'] for x in r['item_reports'])
          cand=os.environ['CAND_PATH']; b=json.load(open(cand)); keys=''.join(x['item']['intended_key'] for x in b['items'])
          assert keys==b['answer_key_sequence']
          m={'audit_id':'Q1401-Q1425-FINAL-QA-PASS-R2-20260910','status':'FINAL_QA_PASS','final_qa_verdict':'FINAL_QA_PASS_NO_MATERIAL_DEFECT','item_range':'Q1401-Q1425','item_count':n,'candidate_batch_blob':subprocess.check_output(['git','hash-object',cand],text=True).strip(),'candidate_batch_sha256':hashlib.sha256(pathlib.Path(cand).read_bytes()).hexdigest(),'authoritative_db_blob':os.environ['DB_BLOB'],'authoritative_db_final_count':1300,'authoritative_review_count':1300,'technical_freeze':'PASS_ALL_DECLARED_LOCATOR_COMPONENTS','cross_workstream_collision_repair':'PASS_7_REPLACEMENTS','replaced_items':[1401,1402,1404,1411,1414,1423,1425],'zero_trust_audit_sha256':hashlib.sha256(a.read_bytes()).hexdigest(),'answer_key_sequence':keys,'all_items_final_10_10_pass':True,'unresolved_defects':[],'suggested_changes':[],'production_import_ready':True,'production_db_modified':False,'trusted_importer_complete':False}
          pathlib.Path('usmle/audit/Q1401_Q1425_FINAL_QA_PASS.json').write_text(json.dumps(m,indent=2,ensure_ascii=False)+'\n')
          print('Q1401_Q1425_R2_FINAL_GATE=PASS')
          PY
      - name: Persist repaired candidate audit and manifest
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$CAND_PATH" usmle/audit/Q1401_Q1425_ZERO_TRUST.json usmle/audit/Q1401_Q1425_FINAL_QA_PASS.json
          git commit -m 'usmle: refinalize Q1401-Q1425 after cross-batch repair'
          git push
