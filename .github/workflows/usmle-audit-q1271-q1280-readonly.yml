name: USMLE Audit Q1271-Q1280 Readonly

on:
  push:
    branches: [main]
    paths:
      - 'usmle/audit/AUDIT_TRIGGER_Q1271_Q1280_READONLY'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Bind audit to exact candidate and canonical state
        run: |
          set -euo pipefail
          test "$(git hash-object usmle/batch_specs_1201_1300/10_q1271_q1280_author_20260906.json)" = "8d4dbeff50a3ec7301a3d915a694645bb007514a"
          test "$(git hash-object usmle/data/usmle-step1.db)" = "cbfe7c4b469fa49555813cffcc6604d2003dcdac"
      - name: Reverify source and evidence contract from zero
        run: |
          set -euo pipefail
          python -m py_compile usmle/verify_author_q1271_q1280.py usmle/audit_q1271_q1280_readonly.py
          python usmle/verify_author_q1271_q1280.py
      - name: Execute readonly adversarial audit
        env:
          EXPECTED_CANDIDATE_BLOB: 8d4dbeff50a3ec7301a3d915a694645bb007514a
        run: |
          set -euo pipefail
          python usmle/audit_q1271_q1280_readonly.py
      - name: Verify readonly output
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('usmle/audit/Q1271_Q1280_READONLY_AUDIT.json'))
          assert r['verdict']=='READONLY_QA_PASS' and r['failures']==[]
          assert r['candidate_blob']=='8d4dbeff50a3ec7301a3d915a694645bb007514a'
          assert r['canonical_db_blob']=='cbfe7c4b469fa49555813cffcc6604d2003dcdac' and r['canonical_count']==r['canonical_review_count']==1270
          assert r['answer_key_sequence']=='CEADBADCBE' and r['answer_distribution']=={'A':2,'B':2,'C':2,'D':2,'E':2}
          assert len(r['item_reports'])==10
          for x in r['item_reports']:
              assert x['status']=='PASS' and x['adversarial_second_pass']=='PASS' and x['second_possible_answer']=='PASS_NONE'
              assert x['blind_audit']['status']=='PASS' and x['canonical_duplicate_gate']['status']=='PASS' and x['ncjmm']=='NOT_APPLICABLE_USMLE'
          print('READONLY_ZERO_TRUST_AUDIT=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: q1271-q1280-readonly-audit
          path: usmle/audit/Q1271_Q1280_READONLY_AUDIT.json
          if-no-files-found: error
