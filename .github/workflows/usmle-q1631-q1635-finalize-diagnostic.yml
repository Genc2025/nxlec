name: USMLE Q1631-Q1635 Finalize Diagnostic
on:
  push:
    paths: ['.github/workflows/usmle-q1631-q1635-finalize-diagnostic.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CAND_PATH: usmle/batch_specs_1601_1700/07_q1631_q1635_author_20260919.json
      CAND_BLOB: 1b179f416daf99f2e7ca475cb9416c4badae34f6
      OUT_PATH: usmle/audit/Q1631_Q1635_ZERO_TRUST.json
      AUD_BLOB: 4492800e54e68f2af2d05c7cdddef6488eecd9ce
      TOP_PATH: usmle/audit/Q1631_Q1635_TOP_MATCH_INSPECTION.json
      TOP_BLOB: 7383e1c572f9446c4836cd36e3096bd3378fba98
      SEM_PATH: usmle/audit/Q1631_Q1635_SEMANTIC_DUPLICATE_REVIEW_20260919.json
      SEM_BLOB: 081631f6b55a056e5b91c48768ddee54450f73d8
      MAN_OUT: usmle/audit/Q1631_Q1635_FINAL_QA_PASS.json
      DB_BLOB: 0676129cbcfa9cab819708389e22d75062f837d6
      CANONICAL_COUNT: '1630'
      START_Q: '1631'
      END_Q: '1635'
      AUDIT_DATE: '20260919'
      DIAG_OUT: usmle/audit/Q1631_Q1635_FINALIZE_DIAGNOSTIC_20260919.json
    steps:
      - uses: actions/checkout@v6
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Diagnose finalize
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          def run(cmd):
              p=subprocess.run(cmd,shell=True,text=True,capture_output=True,env=os.environ.copy())
              return {'rc':p.returncode,'stdout_tail':p.stdout[-6000:],'stderr_tail':p.stderr[-6000:]}
          d={'stages':{}}
          d['stages']['db']=run('test "$(git hash-object usmle/data/usmle-step1.db)" = "$DB_BLOB"')
          d['stages']['cand']=run('test "$(git hash-object "$CAND_PATH")" = "$CAND_BLOB"')
          d['stages']['audit']=run('test "$(git hash-object "$OUT_PATH")" = "$AUD_BLOB"')
          d['stages']['top']=run('test "$(git hash-object "$TOP_PATH")" = "$TOP_BLOB"')
          d['stages']['sem']=run('test "$(git hash-object "$SEM_PATH")" = "$SEM_BLOB"')
          if all(d['stages'][x]['rc']==0 for x in ('db','cand','audit','top','sem')):
              d['stages']['finalize']=run('python usmle/finalize_candidate_current.py')
          else:
              d['stages']['finalize']={'rc':999,'stdout_tail':'','stderr_tail':'skipped after binding failure'}
          d['manifest_exists']=Path(os.environ['MAN_OUT']).exists()
          d['overall']='PASS' if d['stages']['finalize']['rc']==0 else 'FAIL'
          Path(os.environ['DIAG_OUT']).write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          PY
      - name: Persist
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DIAG_OUT"
          git commit -m 'usmle: diagnose Q1631-Q1635 finalization'
          git pull --rebase origin main
          git push
