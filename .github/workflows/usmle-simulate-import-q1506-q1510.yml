name: USMLE Detached Import Simulation Q1506-Q1510
on:
  push:
    paths:
      - '.github/workflows/usmle-simulate-import-q1506-q1510.yml'
permissions:
  contents: write
jobs:
  detached-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      START_Q: '1506'
      END_Q: '1510'
      PRE_COUNT: '1505'
      DB_BLOB: 921a18dae711f516de4d90d8935c850bc611eff3
      CAND_PATH: usmle/batch_specs_1501_1600/02_q1506_q1510_author_20260910.json
      CAND_BLOB: 5d8c0621c40284ba5aa98ec8744848fdfe354a23
      MAN_PATH: usmle/audit/Q1506_Q1510_FINAL_QA_PASS.json
      MAN_BLOB: fdb0b648a7ea8f1bd9c012a2ac8e3fcb8f5739b7
      SIM_OUT: usmle/audit/Q1506_Q1510_DETACHED_IMPORT_SIMULATION.json
    steps:
      - uses: actions/checkout@v6
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Run detached next-five simulation
        run: |
          set -euo pipefail
          BEFORE=$(git hash-object usmle/data/usmle-step1.db)
          test "$BEFORE" = "$DB_BLOB"
          python -m py_compile usmle/simulate_import_next5.py
          python usmle/simulate_import_next5.py
          test "$(git hash-object usmle/data/usmle-step1.db)" = "$BEFORE"
          python - <<'PY'
          import json,os
          r=json.load(open(os.environ['SIM_OUT']))
          assert r['status']=='DETACHED_IMPORT_SIMULATION_PASS' and r['incoming_count']==5
          assert r['pre_production_count']==1505 and r['simulated_post_count']==1510
          assert r['post_simulation_contiguous_q0001_q1510'] is True
          assert r['sqlite_integrity']=='ok' and r['payload_review_consistency']=='PASS'
          assert r['production_db_modified'] is False and r['production_transactional_import_ready'] is True and r['failures']==[]
          PY
      - name: Commit simulation report only
        run: |
          set -euo pipefail
          test "$(git hash-object usmle/data/usmle-step1.db)" = "$DB_BLOB"
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$SIM_OUT"
          git commit -m 'usmle: pass detached import simulation Q1506-Q1510'
          git push
