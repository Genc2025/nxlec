name: RULE1 build reviewed snapshot 1125
on:
  push:
    branches: [rule1-cleanup-2000]
    paths:
      - 'RULE1_BUILD_SNAPSHOT_1125.trigger'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rule1-cleanup-2000
          fetch-depth: 0
      - name: Build consolidated 2000-question snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_rule1_reviewed_snapshot.py \
            --expected-reviewed 1125 \
            --output NCLEX_CANONICAL_RULE1_1125.db \
            --report RULE1_CONSOLIDATED_1125_REPORT.json
      - name: Commit consolidated DB and report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI GitHub Connector'
          git config user.email 'github-connector@openai.com'
          git add NCLEX_CANONICAL_RULE1_1125.db RULE1_CONSOLIDATED_1125_REPORT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'RULE1 consolidate 1125 reviewed into 2000-question DB'
          git push origin HEAD:rule1-cleanup-2000
