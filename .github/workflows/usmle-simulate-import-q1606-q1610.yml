name: USMLE Detached Import Simulation Q1606-Q1610
on:
  push:
    paths: ['.github/workflows/usmle-simulate-import-q1606-q1610.yml']
permissions:
  contents: write
jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      START_Q: '1606'
      END_Q: '1610'
      PRE_COUNT: '1605'
      DB_BLOB: b987a53b0c983dacaf78ffbdb5a47188fe192420
      CAND_PATH: usmle/batch_specs_1601_1700/02_q1606_q1610_author_20260918.json
      CAND_BLOB: b17a5447d5d61f12dc8cfe171116f796ecb20573
      MAN_PATH: usmle/audit/Q1606_Q1610_FINAL_QA_PASS.json
      MAN_BLOB: 3b27cc1150c34baa2c0206c6ed81ecbb3892f859
      SIM_OUT: usmle/audit/Q1606_Q1610_DETACHED_IMPORT_SIMULATION.json
      AUDIT_DATE: '20260918'
      CANDIDATE_STAMP: '20260917T222500Z'
      FINALIZED_AT: '2026-09-17T22:25:00Z'
    steps:
      - uses: actions/checkout@v6
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Bind Q1605 production and FINAL QA
        run: |
          set -euo pipefail
          test "$(git hash-object usmle/data/usmle-step1.db)" = "$DB_BLOB"
          test "$(git hash-object "$CAND_PATH")" = "$CAND_BLOB"
          test "$(git hash-object "$MAN_PATH")" = "$MAN_BLOB"
          python - <<'PY'
          import json,os
          st=json.load(open('usmle/state/step2_final_q0001_q1605.json'))
          assert st['item_count']==st['step2_final_review_count']==1605
          assert st['contiguous_q0001_q1605'] is True and st['sqlite_integrity']=='ok'
          assert st['post_db_blob']==os.environ['DB_BLOB']
          m=json.load(open(os.environ['MAN_PATH']))
          assert m['status']=='FINAL_QA_PASS'
          assert m['final_qa_verdict']=='FINAL_QA_PASS_NO_MATERIAL_DEFECT'
          assert m['production_import_ready'] is True
          assert m['unresolved_defects']==[] and m['suggested_changes']==[]
          assert m['candidate_batch_blob']==os.environ['CAND_BLOB']
          assert m['authoritative_db_blob']==os.environ['DB_BLOB']
          assert m['authoritative_db_final_count']==1605 and m['authoritative_review_count']==1605
          PY
      - name: Simulate next five
        run: |
          set -euo pipefail
          BEFORE="$(git hash-object usmle/data/usmle-step1.db)"
          python usmle/simulate_import_next5.py
          AFTER="$(git hash-object usmle/data/usmle-step1.db)"
          test "$BEFORE" = "$AFTER"
          test "$AFTER" = "$DB_BLOB"
          python - <<'PY'
          import json,os
          r=json.load(open(os.environ['SIM_OUT']))
          assert r['status']=='DETACHED_IMPORT_SIMULATION_PASS'
          assert r['pre_production_count']==1605 and r['simulated_post_count']==1610
          assert r['post_simulation_contiguous_q0001_q1610'] is True
          assert r['production_transactional_import_ready'] is True
          assert r['production_db_modified'] is False and r['failures']==[]
          PY
      - name: Persist simulation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$SIM_OUT"
          git commit -m 'usmle: pass detached import simulation Q1606-Q1610'
          git pull --rebase origin main
          git push
