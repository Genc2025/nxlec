name: USMLE Detached Import Simulation Q1571-Q1575
on:
  push:
    paths: ['.github/workflows/usmle-simulate-import-q1571-q1575.yml']
permissions:
  contents: write
jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      START_Q: '1571'
      END_Q: '1575'
      PRE_COUNT: '1570'
      DB_BLOB: c0f369b414a36f6db6d89e540db66e3bfad61912
      CAND_PATH: usmle/batch_specs_1501_1600/15_q1571_q1575_author_20260913.json
      CAND_BLOB: 2c7e53945e72d7587c27fe9c8f1abe662a93131d
      MAN_PATH: usmle/audit/Q1571_Q1575_FINAL_QA_PASS.json
      MAN_BLOB: 4b5ab35df6a169d37a68ae291fea2bc7d2777ce0
      SIM_OUT: usmle/audit/Q1571_Q1575_DETACHED_IMPORT_SIMULATION.json
      AUDIT_DATE: '20260913'
      CANDIDATE_STAMP: '20260913T050500Z'
      FINALIZED_AT: '2026-09-13T05:05:00Z'
    steps:
      - uses: actions/checkout@v6
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Simulate next five
        run: |
          set -euo pipefail
          test "$(git hash-object usmle/data/usmle-step1.db)" = "$DB_BLOB"
          test "$(git hash-object "$CAND_PATH")" = "$CAND_BLOB"
          test "$(git hash-object "$MAN_PATH")" = "$MAN_BLOB"
          python usmle/simulate_import_next5.py
          test "$(git hash-object usmle/data/usmle-step1.db)" = "$DB_BLOB"
          python - <<'PY'
          import json,os
          r=json.load(open(os.environ['SIM_OUT']))
          assert r['status']=='DETACHED_IMPORT_SIMULATION_PASS'
          assert r['pre_production_count']==1570 and r['simulated_post_count']==1575
          assert r['post_simulation_contiguous_q0001_q1575'] is True
          assert r['production_transactional_import_ready'] is True
          assert r['production_db_modified'] is False and r['failures']==[]
          PY
      - name: Persist simulation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$SIM_OUT"
          git commit -m 'usmle: pass detached import simulation Q1571-Q1575'
          git pull --rebase origin main
          git push
