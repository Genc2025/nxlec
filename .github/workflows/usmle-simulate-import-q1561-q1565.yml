name: USMLE Detached Import Simulation Q1561-Q1565
on:
  push:
    paths:
      - '.github/workflows/usmle-simulate-import-q1561-q1565.yml'
permissions:
  contents: write
jobs:
  detached-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      START_Q: '1561'
      END_Q: '1565'
      PRE_COUNT: '1560'
      DB_BLOB: 4c66c4f671a46eb3b0d29cbf8f8e6d15db85b83f
      CAND_PATH: usmle/batch_specs_1501_1600/13_q1561_q1565_author_20260912.json
      CAND_BLOB: 0c8d07bb5fa6a45a8ffa32c3af3686122c008d14
      MAN_PATH: usmle/audit/Q1561_Q1565_FINAL_QA_PASS.json
      MAN_BLOB: 1213cd15358f900a6b29f02d5adeaa3dfac550bc
      SIM_OUT: usmle/audit/Q1561_Q1565_DETACHED_IMPORT_SIMULATION.json
      AUDIT_DATE: '20260912'
      CANDIDATE_STAMP: '20260912T185300Z'
      FINALIZED_AT: '2026-09-12T18:53:00Z'
    steps:
      - uses: actions/checkout@v6
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Run detached next-five simulation
        run: |
          set -euo pipefail
          test "$(git hash-object usmle/data/usmle-step1.db)" = "$DB_BLOB"
          test "$(git hash-object "$CAND_PATH")" = "$CAND_BLOB"
          test "$(git hash-object "$MAN_PATH")" = "$MAN_BLOB"
          python -m py_compile usmle/simulate_import_next5.py
          python usmle/simulate_import_next5.py
          test "$(git hash-object usmle/data/usmle-step1.db)" = "$DB_BLOB"
          python - <<'PY'
          import json,os
          r=json.load(open(os.environ['SIM_OUT']))
          assert r['audit_id']=='Q1561-Q1565-DETACHED-IMPORT-SIMULATION-20260912'
          assert r['status']=='DETACHED_IMPORT_SIMULATION_PASS'
          assert r['pre_production_count']==1560 and r['simulated_post_count']==1565
          assert r['post_simulation_contiguous_q0001_q1565'] is True
          assert r['all_final_qa_gates_bound'] is True
          assert r['production_transactional_import_ready'] is True
          assert r['production_db_modified'] is False
          assert r['failures']==[]
          PY
      - name: Commit simulation report only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$SIM_OUT"
          git commit -m 'usmle: pass detached import simulation Q1561-Q1565'
          git pull --rebase origin main
          git push
