name: USMLE Q1331-Q1355 Zero Trust
on:
  push:
    paths:
      - '.github/workflows/usmle-q1331-q1355-zero-trust.yml'
permissions:
  contents: write
jobs:
  audit-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CAND_PATH: usmle/batch_specs_1301_1400/03_q1331_q1355_author_20260907.json
      CAND_BLOB: cdec9061a0c92c36369fb572f4f8a47deb8e0f97
      DB_BLOB: 1a0f0b702f86a57624161413ba60fa4ce88e8d97
      START_Q: '1331'
      END_Q: '1355'
      OUT_PATH: usmle/audit/Q1331_Q1355_ZERO_TRUST.json
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Bind immutable candidate and canonical DB
        run: |
          set -euo pipefail
          test "$(git hash-object "$CAND_PATH")" = "$CAND_BLOB"
          test "$(git hash-object usmle/data/usmle-step1.db)" = "$DB_BLOB"
      - name: Execute zero-trust audit
        run: |
          set -euo pipefail
          python -m py_compile usmle/audit_candidate_zero_trust_generic.py
          python usmle/audit_candidate_zero_trust_generic.py
      - name: Enforce full pass and build manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          a=pathlib.Path(os.environ['OUT_PATH']); r=json.load(open(a)); n=int(os.environ['END_Q'])-int(os.environ['START_Q'])+1
          assert r['verdict']=='ZERO_TRUST_PASS' and r['failures']==[] and r['item_count']==n
          assert all(x['status']=='PASS' for x in r['item_reports'])
          assert all(x['evidence_derived_key']==x['intended_key'] for x in r['item_reports'])
          assert all(x['source_live_binding']=='PASS' and x['second_answer_attack']=='PASS' and x['blueprint']=='PASS' for x in r['item_reports'])
          cand=os.environ['CAND_PATH']; b=json.load(open(cand)); keys=''.join(x['item']['intended_key'] for x in b['items'])
          assert keys==b['answer_key_sequence']
          m={'audit_id':'Q1331-Q1355-FINAL-QA-PASS-20260910','status':'FINAL_QA_PASS','final_qa_verdict':'FINAL_QA_PASS_NO_MATERIAL_DEFECT','item_range':'Q1331-Q1355','item_count':n,'candidate_batch_blob':subprocess.check_output(['git','hash-object',cand],text=True).strip(),'candidate_batch_sha256':hashlib.sha256(pathlib.Path(cand).read_bytes()).hexdigest(),'authoritative_db_blob':os.environ['DB_BLOB'],'authoritative_db_final_count':1300,'authoritative_review_count':1300,'zero_trust_audit_sha256':hashlib.sha256(a.read_bytes()).hexdigest(),'answer_key_sequence':keys,'all_items_final_10_10_pass':True,'unresolved_defects':[],'suggested_changes':[],'ncjmm':'NOT_APPLICABLE_USMLE','production_import_ready':True,'production_db_modified':False,'trusted_importer_complete':False}
          pathlib.Path('usmle/audit/Q1331_Q1355_FINAL_QA_PASS.json').write_text(json.dumps(m,indent=2,ensure_ascii=False)+'\n')
          print('Q1331_Q1355_FINAL_GATE=PASS')
          PY
      - name: Commit audit and manifest
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add usmle/audit/Q1331_Q1355_ZERO_TRUST.json usmle/audit/Q1331_Q1355_FINAL_QA_PASS.json
          git commit -m 'usmle: finalize Q1331-Q1355 QA pass'
          git push
# rerun after extended evidence-map schema support
# rerun after None-safe option parser fix
