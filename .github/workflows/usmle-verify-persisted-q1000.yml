name: USMLE Verify Persisted Q1000 State

on:
  push:
    paths:
      - 'usmle/audit/VERIFY_PERSISTED_Q1000_TRIGGER'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify authoritative persisted Q0001-Q1000 state
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, re, sqlite3, subprocess
          from collections import Counter

          DB='usmle/data/usmle-step1.db'
          STATE='usmle/state/step2_final_q0001_q1000.json'
          AUDIT='usmle/audit/STEP2_FINAL_10_10_Q0001_Q1000.json'
          PRE_BLOB='d48fe12bb4b8cc2e7a0fbfcb58003b49df9662ac'
          EXPECTED_POST_BLOB='a9ffb8d25a82013cd2f789a3d7ba545846a3ee45'
          AUDIT_ID='STEP2-FINAL-Q0001-Q1000-20260902'
          OFFICIAL=('Pathology','Physiology','Nutrition','Gross Anatomy & Embryology','Microbiology','Pharmacology','Behavioral Sciences','Biochemistry','Histology & Cell Biology','Immunology','Genetics')
          EXPECTED_BP={
            'Human Development':21,
            'Respiratory and Renal/Urinary Systems':129,
            'Blood, Lymphoreticular and Immune Systems':109,
            'Behavioral Health, Nervous Systems and Special Senses':115,
            'Musculoskeletal, Skin and Subcutaneous Tissue':94,
            'Cardiovascular System':90,
            'Gastrointestinal System':82,
            'Reproductive and Endocrine Systems':132,
            'Multisystem Processes and Disorders':108,
            'Biostatistics, Epidemiology and Population Health':53,
            'Social Sciences: Communication and Interpersonal Skills':67,
          }
          EXPECTED_CP={
            'Medical Knowledge: Applying Foundational Science Concepts':677,
            'Patient Care: Diagnosis, including history and physical examination':201,
            'Practice-Based Learning and Improvement':54,
            'Communication and Interpersonal Skills':68,
          }
          EXPECTED_DISC={'Pathology':2,'Physiology':8,'Nutrition':0,'Gross Anatomy & Embryology':0,'Microbiology':0,'Pharmacology':1,'Behavioral Sciences':1,'Biochemistry':7,'Histology & Cell Biology':1,'Immunology':0,'Genetics':4}

          def canon(o):
              return json.dumps(o,sort_keys=True,separators=(',',':'),ensure_ascii=False)
          def hobj(o):
              return hashlib.sha256(canon(o).encode()).hexdigest()
          def qnum(cid):
              m=re.search(r'DIRECT-(\d{4})',cid or '')
              assert m, cid
              return int(m.group(1))

          state=json.load(open(STATE))
          audit=json.load(open(AUDIT))
          assert state==audit
          assert state['audit_id']==AUDIT_ID
          assert state['final_status']=='FINAL_10_10_PASS'
          assert state['item_count']==1000 and state['step2_final_review_count']==1000
          assert state['new_block']=={'range':'Q0991-Q1000','item_count':10,'clinical_audit_files_verified':10,'fresh_item_by_item_audit':True}
          assert state['blueprint_counts']==EXPECTED_BP
          assert state['competency_counts']==EXPECTED_CP
          assert state['official_discipline_new_block_counts']==EXPECTED_DISC
          assert state['pre_authoritative_db_blob']==PRE_BLOB
          assert state['post_authoritative_db_blob']==EXPECTED_POST_BLOB
          assert state['sqlite_integrity_check']=='ok'
          assert state['duplicate_candidate_id_count']==0
          assert state['payload_review_consistency']=='PASS'
          assert state['reread_verified_count']==1000 and state['new_block_reread_verified_count']==10
          assert state['q0991_q1000_present_exactly_once'] is True
          assert state['contiguous_q0001_q1000'] is True
          assert state['wal_sidecar_present_after_close'] is False
          assert state['shm_sidecar_present_after_close'] is False

          head_blob=subprocess.check_output(['git','rev-parse','HEAD:'+DB],text=True).strip()
          assert head_blob==EXPECTED_POST_BLOB==state['post_authoritative_db_blob'], (head_blob,state['post_authoritative_db_blob'])

          con=sqlite3.connect(DB)
          assert con.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          required={'step2_final_items','step2_final_reviews','step2_finalization'}
          tables={r[0] for r in con.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert required.issubset(tables)

          items=con.execute("SELECT candidate_id,payload_json,payload_sha256,audit_sha256 FROM step2_final_items WHERE final_status='FINAL_10_10_PASS'").fetchall()
          reviews=con.execute("SELECT candidate_id,review_json,review_sha256,final_status FROM step2_final_reviews WHERE final_status='FINAL_10_10_PASS'").fetchall()
          assert len(items)==1000 and len(reviews)==1000
          assert con.execute('SELECT COUNT(*) FROM (SELECT candidate_id FROM step2_final_items GROUP BY candidate_id HAVING COUNT(*)>1)').fetchone()[0]==0
          assert con.execute('SELECT COUNT(*) FROM (SELECT candidate_id FROM step2_final_reviews GROUP BY candidate_id HAVING COUNT(*)>1)').fetchone()[0]==0

          ids={r[0] for r in items}
          rids={r[0] for r in reviews}
          assert ids==rids
          assert {qnum(cid) for cid in ids}==set(range(1,1001))
          assert all(sum(1 for cid in ids if qnum(cid)==n)==1 for n in range(991,1001))

          payloads=[]
          new_count=0
          for cid,pj,ps,ash in items:
              obj=json.loads(pj)
              assert hobj(obj)==ps, cid
              rr=con.execute('SELECT review_json,review_sha256,final_status FROM step2_final_reviews WHERE candidate_id=?',(cid,)).fetchone()
              assert rr and rr[1]==ash and rr[2]=='FINAL_10_10_PASS', cid
              rev=json.loads(rr[0])
              assert rev.get('review_sha256')==rr[1], cid
              assert obj.get('step2_final_audit',{}).get('review_sha256')==rr[1], cid
              assert len(obj['item']['options'])==5 and len(set(obj['item']['options'].values()))==5, cid
              assert len(obj.get('sources',[]))>=2 and all(s.get('section_locator') for s in obj['sources']), cid
              n=qnum(cid)
              if 991<=n<=1000:
                  ca=rev.get('clinical_audit',{})
                  assert rev.get('verdict')=='FINAL_10_10_PASS', cid
                  assert ca.get('status')=='FINAL_10_10_PASS' and ca.get('unresolved_conflicts')==0, cid
                  for k,v in {
                      'source_authority':'PASS','exact_locator':'PASS','stem':'PASS','lead_in':'PASS',
                      'correct_answer':'PASS','rationale':'PASS','educational_objective':'PASS',
                      'ambiguity':'PASS','second_possible_answer':'PASS_NONE','cueing':'PASS',
                      'overlap':'PASS','zero_unsupported_precision':'PASS',
                      'canonical_main_construct_overlap':'PASS_NONE'
                  }.items():
                      assert ca.get(k)==v, (cid,k,ca.get(k))
                  assert ca.get('source_currentness',{}).get('status')=='PASS', cid
                  assert ca.get('adversarial_second_pass',{}).get('result')=='PASS', cid
                  assert ca.get('adversarial_second_pass',{}).get('second_defensible_answer')=='NONE', cid
                  assert ca.get('expert_review_layer',{}).get('status')=='PASS', cid
                  assert ca.get('key_integrity_gate',{}).get('status')=='PASS', cid
                  assert ca.get('realism_gate',{}).get('status')=='PASS', cid
                  dg=ca.get('official_discipline_gate',{})
                  tags=obj.get('blueprint',{}).get('disciplines',[])
                  assert dg.get('status')=='PASS' and dg.get('all_tags_in_usmle_table3') is True, cid
                  assert tags==dg.get('tags') and tags and all(t in OFFICIAL for t in tags), cid
                  new_count+=1
              payloads.append(obj)
          assert new_count==10

          bp=dict(Counter(p['blueprint']['primary_system'] for p in payloads))
          cp=dict(Counter(p['blueprint']['primary_competency'] for p in payloads))
          assert bp==EXPECTED_BP, bp
          assert cp==EXPECTED_CP, cp

          ndc=Counter()
          for p in payloads:
              n=qnum(p['candidate_id'])
              if 991<=n<=1000:
                  ndc.update(p['blueprint']['disciplines'])
          disc={d:ndc.get(d,0) for d in OFFICIAL}
          assert disc==EXPECTED_DISC, disc

          ordered=sorted(payloads,key=lambda p:qnum(p['candidate_id']))
          seq=''.join(p['item']['intended_key'] for p in ordered if 991<=qnum(p['candidate_id'])<=1000)
          assert seq==state['answer_position_new_block']['sequence']
          assert Counter(seq)==Counter({'A':2,'B':2,'C':2,'D':2,'E':2})
          assert hashlib.sha256(seq.encode()).hexdigest()==state['answer_position_new_block']['schedule_sha256']

          fin=con.execute('SELECT audit_id,item_count FROM step2_finalization WHERE id=1').fetchone()
          assert fin==(AUDIT_ID,1000), fin
          con.close()

          assert not pathlib.Path(DB+'-wal').exists()
          assert not pathlib.Path(DB+'-shm').exists()

          print(json.dumps({
              'verified':True,
              'audit_id':AUDIT_ID,
              'items':1000,
              'reviews':1000,
              'new_block':'Q0991-Q1000',
              'duplicates':0,
              'contiguous':True,
              'integrity_check':'ok',
              'db_blob':head_blob,
              'answer_sequence':seq
          },sort_keys=True))
          PY
