name: Rule 1 batch V2-Q1201-V2-Q1300

on:
  push:
    branches: [rule1-q1201-q1300-staging]
    paths:
      - '.github/workflows/rule1-batch-1201-1300.yml'

permissions:
  contents: write

concurrency:
  group: rule1-canonical-main
  cancel-in-progress: false

jobs:
  batch-write:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main canonical state
        uses: actions/checkout@v4
        with:
          ref: main
          path: mainrepo
          fetch-depth: 0

      - name: Checkout exact approved staging payload checkpoint
        uses: actions/checkout@v4
        with:
          ref: 8fdd6d785e7003652c42ffe0818d4da8b338a777
          path: stage
          fetch-depth: 1
          sparse-checkout: |
            approved_items
            staging_items
          sparse-checkout-cone-mode: false

      - name: Technical preflight, single SQLite transaction, exact reread, final read-only gate
        shell: bash
        working-directory: mainrepo
        run: |
          python3 - <<'PY'
          import hashlib, json, sqlite3, subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT=Path('.')
          STAGE=Path('../stage')
          CANONICAL=ROOT/'NCLEX_CANONICAL.db'
          SOURCE=ROOT/'NCLEX_COMMERCIAL_MASTER_CURRENT.db'
          RESULT=ROOT/'RULE1_BATCH_1201_1300_RESULT.json'

          EXPECTED_MAIN_HEAD='a426f38c543a7d0d13e881ec6904d1f02206ff52'
          EXPECTED_CANONICAL_BLOB='a2818a1bd1141b08fed9a8e18ccb637256fad3a5'
          EXPECTED_SOURCE_BLOB='07e335d471ef1b4689406ba41eb98eaa2ca41472'
          EXPECTED_STAGE='8fdd6d785e7003652c42ffe0818d4da8b338a777'
          EXPECTED_UIDS=[f'V2-Q{n:04d}' for n in range(1201,1301)]
          GATES=[
              'source_authority_verified','currentness_verified','exact_locator_verified',
              'stem_verified','correct_answer_verified','distractors_verified',
              'rationale_verified','educational_objective_verified','ambiguity_verified',
              'second_answer_excluded','cueing_verified','blueprint_verified',
              'independent_qa_passed','no_unresolved_conflict'
          ]
          REQUIRED_APPROVED=[
              'question_uid','category_id','client_need','difficulty','stem','options','correct_option',
              'rationale','educational_objective','source_organization','source_document_title',
              'source_version_date','source_accessed_date','source_locator','source_url',
              'source_claim_supported','blueprint_source_organization','blueprint_document_title',
              'blueprint_version','blueprint_locator','blueprint_url','blueprint_topic',
              'correction_summary','audit_status','second_pass_status','audit_reviewer','gates','audit_findings'
          ]
          REQUIRED_SAVED=[
              'question_uid','stem','item_data_json','correct_answer_json','rationale','educational_objective',
              'source_organization','source_document_title','source_version_date','source_accessed_date',
              'source_locator','source_url','source_claim_supported','blueprint_source_organization',
              'blueprint_document_title','blueprint_version','blueprint_locator','blueprint_url','blueprint_topic',
              'source_db_filename','source_db_blob_sha','source_original_json','correction_summary','audit_status',
              'second_pass_status','audit_date_utc','audit_reviewer','audit_findings_json','payload_sha256','created_at_utc'
          ]
          SOURCE_COMPARE=[
              'question_uid','source_id','source_bank','source_table','mode','category_id','client_need',
              'difficulty','item_type_raw','renderer_type','stem','item_data_json','correct_answer_json',
              'rationale','source_detail','source_name','source_url','stable_sort_key'
          ]

          def canon(v):
              return json.dumps(v, ensure_ascii=False, sort_keys=True, separators=(',',':'))

          def read_json(base, rel):
              p=base/rel
              if not p.is_file():
                  raise SystemExit(f'BLOCKED: missing file {p}')
              try:
                  return json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  raise SystemExit(f'BLOCKED: invalid JSON {p}: {e}')

          def git_out(cwd, *args):
              return subprocess.check_output(['git','-C',str(cwd),*args], text=True).strip()

          # State truth: exact branch checkpoints + real Git blobs.
          main_head=git_out(ROOT,'rev-parse','HEAD')
          stage_head=git_out(STAGE,'rev-parse','HEAD')
          canonical_blob=git_out(ROOT,'rev-parse','HEAD:NCLEX_CANONICAL.db')
          source_blob=git_out(ROOT,'rev-parse','HEAD:NCLEX_COMMERCIAL_MASTER_CURRENT.db')
          if main_head != EXPECTED_MAIN_HEAD:
              raise SystemExit(f'BLOCKED: main HEAD changed: {main_head}')
          if stage_head != EXPECTED_STAGE:
              raise SystemExit(f'BLOCKED: staging payload checkpoint changed: {stage_head}')
          if canonical_blob != EXPECTED_CANONICAL_BLOB:
              raise SystemExit(f'BLOCKED: canonical blob changed: {canonical_blob}')
          if source_blob != EXPECTED_SOURCE_BLOB:
              raise SystemExit(f'BLOCKED: source blob changed: {source_blob}')

          # Open and inspect the actual SQLite binaries.
          src=sqlite3.connect(SOURCE); src.row_factory=sqlite3.Row
          can=sqlite3.connect(CANONICAL); can.row_factory=sqlite3.Row
          src_integrity=src.execute('PRAGMA integrity_check').fetchone()[0]
          can_integrity=can.execute('PRAGMA integrity_check').fetchone()[0]
          src_count=src.execute('SELECT COUNT(*) FROM questions').fetchone()[0]
          can_count=can.execute('SELECT COUNT(*) FROM questions').fetchone()[0]
          src_dup=src.execute('SELECT COUNT(*) FROM (SELECT question_uid,COUNT(*) n FROM questions GROUP BY question_uid HAVING n>1)').fetchone()[0]
          can_dup=can.execute('SELECT COUNT(*) FROM (SELECT question_uid,COUNT(*) n FROM questions GROUP BY question_uid HAVING n>1)').fetchone()[0]
          src_cols={r['name'] for r in src.execute('PRAGMA table_info(questions)')}
          can_cols={r['name'] for r in can.execute('PRAGMA table_info(questions)')}
          src_fk=src.execute('PRAGMA foreign_key_check').fetchall()
          can_fk=can.execute('PRAGMA foreign_key_check').fetchall()
          if src_integrity != 'ok' or src_dup != 0 or src_count < 1300 or src_fk:
              raise SystemExit(f'BLOCKED: source SQLite preflight integrity={src_integrity} count={src_count} dup={src_dup} fk={len(src_fk)}')
          if can_integrity != 'ok' or can_count != 1200 or can_dup != 0 or can_fk:
              raise SystemExit(f'BLOCKED: canonical SQLite preflight integrity={can_integrity} count={can_count} dup={can_dup} fk={len(can_fk)}')
          missing_src=set(SOURCE_COMPARE)-src_cols
          if missing_src:
              raise SystemExit(f'BLOCKED: source schema missing {sorted(missing_src)}')

          needed_can={
              'question_uid','source_bank','source_table','source_id','mode','case_uid','original_sequence',
              'official_case_slot','slot_variant','category_id','client_need','specialty','difficulty','cjmm_skill',
              'item_type_raw','renderer_type','stem','item_data_json','correct_answer_json','rationale','scoring_rule',
              'educational_objective','source_organization','source_document_title','source_version_date',
              'source_accessed_date','source_locator','source_url','source_claim_supported',
              'blueprint_source_organization','blueprint_document_title','blueprint_version','blueprint_locator',
              'blueprint_url','blueprint_topic','stable_sort_key','source_db_filename','source_db_blob_sha',
              'source_original_json','correction_summary','audit_status','second_pass_status','audit_date_utc',
              'audit_reviewer','audit_findings_json','payload_sha256','created_at_utc',*GATES
          }
          missing_can=needed_can-can_cols
          if missing_can:
              raise SystemExit(f'BLOCKED: canonical schema missing {sorted(missing_can)}')

          # Stable-sort anti-join must begin at Q1201 for this pinned state.
          src.execute("ATTACH DATABASE 'NCLEX_CANONICAL.db' AS canlive")
          first=src.execute('''
              SELECT s.question_uid,s.stable_sort_key
              FROM questions s
              LEFT JOIN canlive.questions c ON c.question_uid=s.question_uid
              WHERE c.question_uid IS NULL AND s.source_bank='v2' AND s.mode='standalone'
              ORDER BY s.stable_sort_key,s.question_uid LIMIT 1
          ''').fetchone()
          if first is None or first['question_uid'] != 'V2-Q1201':
              raise SystemExit(f"BLOCKED: first eligible source-minus-canonical is {None if first is None else first['question_uid']}")

          # Preflight all 100 approved payloads against exact live source rows.
          payloads=[]
          source_exact=0
          finalize_ts=datetime.now(timezone.utc).replace(microsecond=0).isoformat()
          for uid in EXPECTED_UIDS:
              a=read_json(STAGE, Path('approved_items')/f'{uid}.json')
              snap=read_json(STAGE, Path('staging_items')/f'{uid}.json')
              r=snap.get('source_row') or {}
              if a.get('question_uid') != uid or r.get('question_uid') != uid:
                  raise SystemExit(f'BLOCKED: UID mismatch {uid}')
              missing=[k for k in REQUIRED_APPROVED if k not in a or a[k] in ('',None)]
              if missing:
                  raise SystemExit(f'BLOCKED: {uid} approved missing {missing}')
              if a['audit_status'] != 'FINAL_QA_PASS' or a['second_pass_status'] != 'PASS':
                  raise SystemExit(f'BLOCKED: {uid} status not FINAL_QA_PASS/PASS')
              bad=[g for g in GATES if a.get('gates',{}).get(g) != 1]
              if bad:
                  raise SystemExit(f'BLOCKED: {uid} failed gate metadata {bad}')
              if not isinstance(a['options'],dict) or sorted(a['options']) != ['A','B','C','D']:
                  raise SystemExit(f'BLOCKED: malformed A-D options {uid}')
              if a['correct_option'] not in a['options']:
                  raise SystemExit(f'BLOCKED: malformed key {uid}')
              if snap.get('source_blob_expected') != EXPECTED_SOURCE_BLOB or snap.get('canonical_blob_expected') != EXPECTED_CANONICAL_BLOB:
                  raise SystemExit(f'BLOCKED: SHA pin mismatch in snapshot {uid}')

              live=src.execute('SELECT * FROM questions WHERE question_uid=?',(uid,)).fetchone()
              if live is None:
                  raise SystemExit(f'BLOCKED: live source row missing {uid}')
              mism=[k for k in SOURCE_COMPARE if live[k] != r.get(k)]
              if mism:
                  raise SystemExit(f'BLOCKED: source snapshot != live SQLite {uid}: {mism}')
              source_exact += 1

              source_opts=json.loads(r['item_data_json'])['options']
              source_ans=json.loads(r['correct_answer_json'])['correct_option']
              source_original={
                  'stem':r['stem'],
                  'options':source_opts,
                  'correct_option':source_ans,
                  'rationale':r['rationale'],
                  'source_url':r['source_url'],
                  'source_detail':r['source_detail'],
                  'difficulty':r['difficulty']
              }
              p={
                  'question_uid':uid,
                  'source_bank':r['source_bank'],'source_table':r['source_table'],'source_id':r['source_id'],
                  'mode':r['mode'],'case_uid':r.get('case_uid'),'original_sequence':r.get('original_sequence'),
                  'official_case_slot':r.get('official_case_slot'),'slot_variant':r.get('slot_variant'),
                  'category_id':a['category_id'],'client_need':a['client_need'],'specialty':r.get('specialty'),
                  'difficulty':a['difficulty'],'cjmm_skill':r.get('cjmm_skill'),'item_type_raw':r['item_type_raw'],
                  'renderer_type':r['renderer_type'],'stem':a['stem'],'item_data':{'options':a['options']},
                  'correct_answer':{'correct_option':a['correct_option']},'rationale':a['rationale'],
                  'scoring_rule':r.get('scoring_rule'),'educational_objective':a['educational_objective'],
                  'source_organization':a['source_organization'],'source_document_title':a['source_document_title'],
                  'source_version_date':a['source_version_date'],'source_accessed_date':a['source_accessed_date'],
                  'source_locator':a['source_locator'],'source_url':a['source_url'],
                  'source_claim_supported':a['source_claim_supported'],
                  'blueprint_source_organization':a['blueprint_source_organization'],
                  'blueprint_document_title':a['blueprint_document_title'],'blueprint_version':a['blueprint_version'],
                  'blueprint_locator':a['blueprint_locator'],'blueprint_url':a['blueprint_url'],
                  'blueprint_topic':a['blueprint_topic'],'stable_sort_key':r['stable_sort_key'],
                  'source_db_filename':SOURCE.name,'source_db_blob_sha':EXPECTED_SOURCE_BLOB,
                  'source_original':source_original,'correction_summary':a['correction_summary'],
                  'audit_status':'FINAL_QA_PASS','second_pass_status':'PASS',
                  'audit_date_utc':a.get('audit_date_utc') or a.get('final_reaudit_date') or finalize_ts,
                  'audit_reviewer':a['audit_reviewer'],'gates':{g:int(a['gates'][g]) for g in GATES},
                  'audit_findings':a['audit_findings']
              }
              payloads.append(p)

          src.execute('DETACH DATABASE canlive')
          src.close()
          can.close()

          if source_exact != 100:
              raise SystemExit(f'BLOCKED: source exact count {source_exact}/100')
          if [p['question_uid'] for p in payloads] != EXPECTED_UIDS or len({p['question_uid'] for p in payloads}) != 100:
              raise SystemExit('BLOCKED: approved payload sequence/uniqueness gate failed')

          # Canonical anti-join before write.
          con=sqlite3.connect(CANONICAL); con.row_factory=sqlite3.Row; con.execute('PRAGMA foreign_keys=ON')
          marks=','.join('?' for _ in EXPECTED_UIDS)
          existing=[r[0] for r in con.execute(f'SELECT question_uid FROM questions WHERE question_uid IN ({marks})',EXPECTED_UIDS)]
          if existing:
              raise SystemExit(f'BLOCKED: batch UID already exists in canonical: {existing}')

          # ONE transaction for all 100 rows.
          created_ts=datetime.now(timezone.utc).replace(microsecond=0).isoformat()
          expected_saved={}
          payload_hashes={}
          try:
              con.execute('BEGIN IMMEDIATE')
              for p in payloads:
                  ph=hashlib.sha256(canon(p).encode('utf-8')).hexdigest()
                  payload_hashes[p['question_uid']]=ph
                  vals={
                      'question_uid':p['question_uid'],'source_bank':p['source_bank'],'source_table':p['source_table'],
                      'source_id':p['source_id'],'mode':p['mode'],'case_uid':p.get('case_uid'),
                      'original_sequence':p.get('original_sequence'),'official_case_slot':p.get('official_case_slot'),
                      'slot_variant':p.get('slot_variant'),'category_id':p['category_id'],'client_need':p['client_need'],
                      'specialty':p.get('specialty'),'difficulty':p['difficulty'],'cjmm_skill':p.get('cjmm_skill'),
                      'item_type_raw':p['item_type_raw'],'renderer_type':p['renderer_type'],'stem':p['stem'],
                      'item_data_json':canon(p['item_data']),'correct_answer_json':canon(p['correct_answer']),
                      'rationale':p['rationale'],'scoring_rule':p.get('scoring_rule'),
                      'educational_objective':p['educational_objective'],'source_organization':p['source_organization'],
                      'source_document_title':p['source_document_title'],'source_version_date':p['source_version_date'],
                      'source_accessed_date':p['source_accessed_date'],'source_locator':p['source_locator'],
                      'source_url':p['source_url'],'source_claim_supported':p['source_claim_supported'],
                      'blueprint_source_organization':p['blueprint_source_organization'],
                      'blueprint_document_title':p['blueprint_document_title'],'blueprint_version':p['blueprint_version'],
                      'blueprint_locator':p['blueprint_locator'],'blueprint_url':p['blueprint_url'],
                      'blueprint_topic':p['blueprint_topic'],'stable_sort_key':p['stable_sort_key'],
                      'source_db_filename':p['source_db_filename'],'source_db_blob_sha':p['source_db_blob_sha'],
                      'source_original_json':canon(p['source_original']),'correction_summary':p['correction_summary'],
                      'audit_status':p['audit_status'],'second_pass_status':p['second_pass_status'],
                      'audit_date_utc':p['audit_date_utc'],'audit_reviewer':p['audit_reviewer'],
                      **{g:int(p['gates'][g]) for g in GATES},
                      'audit_findings_json':canon(p['audit_findings']),'payload_sha256':ph,
                      'created_at_utc':created_ts
                  }
                  expected_saved[p['question_uid']]=vals
                  cols=list(vals)
                  con.execute(
                      f"INSERT INTO questions ({','.join(cols)}) VALUES ({','.join('?' for _ in cols)})",
                      [vals[c] for c in cols]
                  )
              con.commit()
          except Exception:
              con.rollback()
              raise

          # Post-transaction gates.
          integrity=con.execute('PRAGMA integrity_check').fetchone()[0]
          fk_after=con.execute('PRAGMA foreign_key_check').fetchall()
          total=con.execute('SELECT COUNT(*) FROM questions').fetchone()[0]
          dup=con.execute('SELECT COUNT(*) FROM (SELECT question_uid,COUNT(*) n FROM questions GROUP BY question_uid HAVING n>1)').fetchone()[0]
          rows=con.execute(f'SELECT * FROM questions WHERE question_uid IN ({marks}) ORDER BY question_uid',EXPECTED_UIDS).fetchall()
          required_ok=exact_ok=finalqa_ok=secondpass_ok=gates_ok=0
          for row in rows:
              uid=row['question_uid']; exp=expected_saved[uid]
              if all(row[k] is not None and (not isinstance(row[k],str) or row[k].strip()) for k in REQUIRED_SAVED):
                  required_ok += 1
              if all(row[k] == v for k,v in exp.items()):
                  exact_ok += 1
              if row['audit_status'] == 'FINAL_QA_PASS':
                  finalqa_ok += 1
              if row['second_pass_status'] == 'PASS':
                  secondpass_ok += 1
              if all(row[g] == 1 for g in GATES):
                  gates_ok += 1

          if integrity != 'ok' or fk_after or total != 1300 or dup != 0:
              raise SystemExit(f'BLOCKED: postwrite DB gate integrity={integrity} fk={len(fk_after)} count={total} dup={dup}')
          if len(rows) != 100 or required_ok != 100 or exact_ok != 100 or finalqa_ok != 100 or secondpass_ok != 100 or gates_ok != 100:
              raise SystemExit(
                  f'BLOCKED: postwrite row gates reread={len(rows)} required={required_ok} exact={exact_ok} '
                  f'finalqa={finalqa_ok} secondpass={secondpass_ok} gates14={gates_ok}'
              )
          con.close()

          # FINAL READ-ONLY GATE: reopen the actual saved DB in read-only/query-only mode.
          ro=sqlite3.connect(f'file:{CANONICAL.resolve()}?mode=ro', uri=True); ro.row_factory=sqlite3.Row
          ro.execute('PRAGMA query_only=ON')
          ro_integrity=ro.execute('PRAGMA integrity_check').fetchone()[0]
          ro_fk=ro.execute('PRAGMA foreign_key_check').fetchall()
          ro_count=ro.execute('SELECT COUNT(*) FROM questions').fetchone()[0]
          ro_dup=ro.execute('SELECT COUNT(*) FROM (SELECT question_uid,COUNT(*) n FROM questions GROUP BY question_uid HAVING n>1)').fetchone()[0]
          ro_rows=ro.execute(f'SELECT * FROM questions WHERE question_uid IN ({marks}) ORDER BY question_uid',EXPECTED_UIDS).fetchall()
          ro_exact=0
          for row in ro_rows:
              exp=expected_saved[row['question_uid']]
              if all(row[k] == v for k,v in exp.items()) and row['audit_status']=='FINAL_QA_PASS' and row['second_pass_status']=='PASS' and all(row[g]==1 for g in GATES):
                  ro_exact += 1
          ro.close()
          if ro_integrity != 'ok' or ro_fk or ro_count != 1300 or ro_dup != 0 or len(ro_rows) != 100 or ro_exact != 100:
              raise SystemExit(
                  f'BLOCKED: final read-only gate integrity={ro_integrity} fk={len(ro_fk)} count={ro_count} '
                  f'dup={ro_dup} reread={len(ro_rows)} exact={ro_exact}'
              )

          result={
              'status':'FINAL_QA_PASS',
              'batch':'V2-Q1201-V2-Q1300',
              'generated_at_utc':datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              'main_head_before':main_head,
              'staging_payload_commit':stage_head,
              'canonical_blob_before':canonical_blob,
              'source_blob_verified':source_blob,
              'source_sqlite':{'integrity_check':src_integrity,'count':src_count,'duplicate_uid':src_dup,'foreign_key_violations':len(src_fk)},
              'canonical_prewrite':{'integrity_check':can_integrity,'count':can_count,'duplicate_uid':can_dup,'foreign_key_violations':len(can_fk)},
              'technical_preflight':{
                  'approved_payloads':100,
                  'source_snapshot_vs_live_sqlite':'100/100',
                  'uid_absent_from_canonical':'100/100',
                  'all_14_gate_metadata':'100/100'
              },
              'write':{'transactions':1,'inserted':100,'count_before':1200,'count_after':1300},
              'postwrite':{
                  'integrity_check':integrity,'foreign_key_violations':len(fk_after),'duplicate_uid':dup,
                  'required_fields':'100/100','reread':'100/100','exact_saved_payload':'100/100',
                  'FINAL_QA_PASS':'100/100','independent_second_pass':'100/100','all_14_gates':'100/100'
              },
              'final_read_only_gate':{
                  'integrity_check':ro_integrity,'foreign_key_violations':len(ro_fk),'count':ro_count,
                  'duplicate_uid':ro_dup,'reread':'100/100','exact_saved_payload_and_status':'100/100'
              },
              'payload_sha256':payload_hashes
          }
          RESULT.write_text(json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True))
          PY

      - name: Commit to main only after all gates passed
        shell: bash
        working-directory: mainrepo
        run: |
          set -euo pipefail
          git config user.name 'OpenAI GitHub Connector'
          git config user.email 'github-connector@openai.com'
          git add NCLEX_CANONICAL.db RULE1_BATCH_1201_1300_RESULT.json
          test -n "$(git diff --cached --name-only)"
          changed=$(git diff --cached --name-only | sort | tr '\n' ' ')
          if [ "$changed" != "NCLEX_CANONICAL.db RULE1_BATCH_1201_1300_RESULT.json " ]; then
            echo "BLOCKED: unexpected staged paths: $changed"
            exit 1
          fi
          git commit -m 'Rule 1 batch V2-Q1201-V2-Q1300 FINAL_QA_PASS canonical 1200 to 1300'
          local_head=$(git rev-parse HEAD)
          new_blob=$(git rev-parse HEAD:NCLEX_CANONICAL.db)
          git push origin HEAD:main
          git fetch origin main
          remote_head=$(git rev-parse origin/main)
          if [ "$remote_head" != "$local_head" ]; then
            echo "BLOCKED: remote main did not land exact commit"
            exit 1
          fi
          echo "FINAL_MAIN_COMMIT=$local_head"
          echo "FINAL_CANONICAL_BLOB=$new_blob"
