name: NCLEX audit and merge

on:
  push:
    branches:
      - audit/nclex-commercial
    paths:
      - '.github/workflows/nclex-audit-merge.yml'
      - 'tools/audit_merge_nclex.py'
      - '*.db'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: audit/nclex-commercial

      - name: Run structural audit and merge
        run: python3 tools/audit_merge_nclex.py

      - name: Commit audit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NCLEX_AUDIT_REPORT.json NCLEX_AUDIT_REPORT.md nclex_commercial_merged.db
          if git diff --cached --quiet; then
            echo "No output changes to commit"
          else
            git commit -m "Generate NCLEX commercial audit and merged bank"
            git push origin HEAD:audit/nclex-commercial
          fi

      - name: Upload merged database artifact
        uses: actions/upload-artifact@v4
        with:
          name: nclex-commercial-merged
          path: |
            nclex_commercial_merged.db
            NCLEX_AUDIT_REPORT.json
            NCLEX_AUDIT_REPORT.md
          retention-days: 30
