        if rg.get('status')!='PASS' or any(rg.get(k)!='PASS' for k in realism_required): raise SystemExit(f'Q{n:04d} realism failure')
        dg=a.get('official_discipline_gate',{})
        if dg.get('status')!='PASS' or dg.get('all_tags_in_usmle_table3') is not True or not dg.get('tags') or any(t not in OFFICIAL_DISCIPLINES for t in dg.get('tags',[])):
            raise SystemExit(f'Q{n:04d} discipline gate failure')
        out[n]=(a,p)
    return out

"""
          src=src[:s]+load_aud+src[e:]
          # Remaining exact guarded replacements.
