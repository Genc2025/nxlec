            raise SystemExit(f'Q{n:04d} audit identity/status failure')
        if a.get('authoritative_db_blob')!=EXPECTED_PRE_DB_BLOB or int(a.get('authoritative_db_final_count',-1))!=1190:
            raise SystemExit(f'Q{n:04d} audit DB binding failure')
        if a.get('exact_spec_sha')!=sha_by[n]:
            raise SystemExit(f'Q{n:04d} audit spec binding failure')
        if a.get('db_write') is not False or int(a.get('unresolved_conflicts',-1))!=0:
            raise SystemExit(f'Q{n:04d} staged/write/conflict failure')
        required={'source_authority':'PASS','exact_locator':'PASS','stem':'PASS','lead_in':'PASS','correct_answer':'PASS','rationale':'PASS','educational_objective':'PASS','ambiguity':'PASS','second_possible_answer':'PASS_NONE','cueing':'PASS','overlap':'PASS','zero_unsupported_precision':'PASS','forward_exact_duplicate_check':'PASS','canonical_main_construct_overlap':'PASS_NONE','within_batch_construct_collision':'PASS_NONE'}
        for k,v in required.items():
            if a.get(k)!=v: raise SystemExit(f'Q{n:04d}: audit gate {k}={a.get(k)!r}, expected {v!r}')
        if a.get('source_currentness',{}).get('status')!='PASS' or a.get('distractors')!=['PASS']*4:
            raise SystemExit(f'Q{n:04d} source/distractor audit failure')
        if a.get('second_answer_attack',{}).get('result')!='PASS_NONE' or a.get('adversarial_second_pass',{}).get('result')!='PASS':
            raise SystemExit(f'Q{n:04d} second-answer/adversarial failure')
        expert=a.get('expert_review_layer',{}); expert_required=('answer_granularity','mechanism_direction','temporal_sequence','scope_match','negative_evidence','distractor_ontology','answer_key_inversion','minimal_information','clinical_base_rate','units_numbers_thresholds','terminology_drift','source_disagreement','educational_objective_leakage','cross_item_contamination','expert_reviewer_reversal')
        if expert.get('status')!='PASS' or any(expert.get(k)!='PASS' for k in expert_required): raise SystemExit(f'Q{n:04d} expert layer failure')
        kig=a.get('key_integrity_gate',{}); key_required=('factually_correct','stem_supports_key','lead_in_matches_answer_granularity','no_second_defensible_answer','no_authoritative_source_conflict','no_required_hidden_assumption')
