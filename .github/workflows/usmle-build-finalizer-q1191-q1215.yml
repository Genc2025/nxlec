          required=["NEW_RANGE = range(1191,1216)","KEY_SEQUENCE = 'CEBADDABECEACDBBDECAACBED'","if len(old_items)!=1190 or len(old_reviews)!=1190:","if len(items)!=1215 or len(revs)!=1215:","set(range(1,1191))","set(range(1,1216))","'item_count':1215,","'new_block_reread_verified_count':25,","'q1191_q1215_present_exactly_once':True,","'contiguous_q0001_q1215':True,"]
