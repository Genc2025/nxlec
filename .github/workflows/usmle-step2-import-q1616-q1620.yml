name: USMLE Step2 Import Q1616-Q1620
on:
  push:
    paths: ['.github/workflows/usmle-step2-import-q1616-q1620.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      START_Q: '1616'
      END_Q: '1620'
      PRE_COUNT: '1615'
      DB_BLOB: e764efe19c25a0cf53148c6c8f2afa5c861752ef
      CAND_PATH: usmle/batch_specs_1601_1700/04_q1616_q1620_author_20260918.json
      CAND_BLOB: c0ff5babcb250de9eaf204681db7bd06c6cb3d5e
      MAN_PATH: usmle/audit/Q1616_Q1620_FINAL_QA_PASS.json
      MAN_BLOB: 958271e50fc08883a04112b811e234ea5039ba36
      SEM_PATH: usmle/audit/Q1616_Q1620_SEMANTIC_DUPLICATE_REVIEW_20260918.json
      SEM_BLOB: 550c1f781efe4ae21082eec27f23f271f7243aaa
      TOP_PATH: usmle/audit/Q1616_Q1620_TOP_MATCH_INSPECTION.json
      TOP_BLOB: 1104f546ee730fffed3178509ebfef9973b2ac45
      SIM_PATH: usmle/audit/Q1616_Q1620_DETACHED_IMPORT_SIMULATION.json
      SIM_BLOB: 93cbd41892c4d440e0f7118b090c60f7a84dd1b7
      VERIFY_OUT: usmle/audit/Q1616_Q1620_PRODUCTION_IMPORT_VERIFY.json
      STATE_OUT: usmle/state/step2_final_q0001_q1620.json
      AUDIT_DATE: '20260918'
      CANDIDATE_STAMP: '20260918T172900Z'
      FINALIZED_AT: '2026-09-18T17:29:00Z'
    steps:
      - uses: actions/checkout@v6
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Bind all evidence and remediated production
        run: |
          set -euo pipefail
          test "$(git hash-object usmle/data/usmle-step1.db)" = "$DB_BLOB"
          test "$(git hash-object "$CAND_PATH")" = "$CAND_BLOB"
          test "$(git hash-object "$MAN_PATH")" = "$MAN_BLOB"
          test "$(git hash-object "$SEM_PATH")" = "$SEM_BLOB"
          test "$(git hash-object "$TOP_PATH")" = "$TOP_BLOB"
          test "$(git hash-object "$SIM_PATH")" = "$SIM_BLOB"
          python - <<'PY'
          import json,os
          st=json.load(open('usmle/state/step2_final_q0001_q1615.json'))
          rem=json.load(open('usmle/audit/Q1612_REMEDIATION_FINAL_QA_PASS_20260918.json'))
          m=json.load(open(os.environ['MAN_PATH']))
          sem=json.load(open(os.environ['SEM_PATH']))
          s=json.load(open(os.environ['SIM_PATH']))
          assert st['item_count']==st['step2_final_review_count']==1615
          assert st['contiguous_q0001_q1615'] is True and st['sqlite_integrity']=='ok'
          assert st['post_db_blob']==os.environ['DB_BLOB']
          assert st['production_import_status']=='PASS_WITH_Q1612_REMEDIATION'
          assert rem['status']=='FINAL_QA_PASS' and rem['final_qa_verdict']=='FINAL_QA_PASS_NO_MATERIAL_DEFECT'
          assert rem['post_db_blob']==os.environ['DB_BLOB']
          assert m['status']=='FINAL_QA_PASS' and m['final_qa_verdict']=='FINAL_QA_PASS_NO_MATERIAL_DEFECT'
          assert m['production_import_ready'] is True and m['unresolved_defects']==[] and m['suggested_changes']==[]
          assert m['candidate_batch_blob']==os.environ['CAND_BLOB'] and m['authoritative_db_blob']==os.environ['DB_BLOB']
          assert m['authoritative_db_final_count']==m['authoritative_review_count']==1615
          assert sem['status']=='PASS_NO_MATERIAL_CONSTRUCT_DUPLICATION'
          assert sem['candidate_batch_blob']==os.environ['CAND_BLOB'] and sem['canonical_db_blob']==os.environ['DB_BLOB']
          assert sem['material_duplicates']==[] and sem['unresolved_defects']==[] and sem['import_gate']=='PASS'
          assert s['status']=='DETACHED_IMPORT_SIMULATION_PASS'
          assert s['pre_production_count']==1615 and s['simulated_post_count']==1620
          assert s['post_simulation_contiguous_q0001_q1620'] is True
          assert s['production_transactional_import_ready'] is True and s['production_db_modified'] is False and s['failures']==[]
          PY
      - name: Import and verify
        run: |
          set -euo pipefail
          python usmle/step2_import_next5.py
          python - <<'PY'
          import json,os,re,sqlite3
          db='usmle/data/usmle-step1.db'
          c=sqlite3.connect(db)
          assert c.execute('pragma integrity_check').fetchone()[0]=='ok'
          rows=c.execute("select candidate_id,payload_json,finalized_at from step2_final_items where final_status='FINAL_10_10_PASS'").fetchall()
          rc=c.execute("select count(*) from step2_final_reviews where final_status='FINAL_10_10_PASS'").fetchone()[0]
          fin=c.execute('select item_count from step2_finalization where id=1').fetchone()[0]
          nums=[int(re.search(r'DIRECT-(\d{4})',x[0]).group(1)) for x in rows]
          assert len(rows)==rc==fin==1620
          assert len(set(nums))==1620 and set(nums)==set(range(1,1621))
          incoming=[x for x in rows if 1616<=int(re.search(r'DIRECT-(\d{4})',x[0]).group(1))<=1620]
          assert len(incoming)==5
          assert all('20260918T172900Z' in x[0] for x in incoming)
          assert all(x[2]=='2026-09-18T17:29:00Z' for x in incoming)
          docs={int(re.search(r'DIRECT-(\d{4})',x[0]).group(1)):json.loads(x[1]) for x in incoming}
          assert ''.join(docs[n]['item']['intended_key'] for n in range(1616,1621))=='ABCDE'
          assert 'MAGT1' in docs[1616]['item']['tested_construct']
          assert 'Citrin' in docs[1617]['item']['tested_construct']
          assert 'ALDH7A1' in docs[1618]['item']['tested_construct']
          assert 'SLC46A1' in docs[1619]['item']['tested_construct']
          assert 'carbonic anhydrase VA' in docs[1620]['item']['tested_construct']
          q1612=[x for x in rows if re.search(r'DIRECT-1612-',x[0])]
          assert len(q1612)==1
          p1612=json.loads(q1612[0][1])
          assert p1612['item']['intended_key']=='B'
          assert 'CDC42-PAK' in p1612['item']['options']['B']
          assert 'WASp' not in p1612['item']['options']['B']
          c.close()
          v=json.load(open(os.environ['VERIFY_OUT']))
          st=json.load(open(os.environ['STATE_OUT']))
          assert v['status']=='PRODUCTION_IMPORT_PASS'
          assert v['item_count']==v['review_count']==1620
          assert v['contiguous_q0001_q1620'] is True and v['failures']==[]
          assert st['item_count']==st['step2_final_review_count']==1620
          assert st['contiguous_q0001_q1620'] is True
          assert st['production_import_status']=='PASS'
          assert st['post_db_blob']==v['post_db_blob']
          st['prior_q1612_remediation_preserved']=True
          st['q1612_remediation_audit']='Q1612_REMEDIATION_FINAL_QA_PASS_20260918'
          st['semantic_duplicate_review_blob']=os.environ['SEM_BLOB']
          st['top_match_inspection_blob']=os.environ['TOP_BLOB']
          open(os.environ['STATE_OUT'],'w').write(json.dumps(st,indent=2,ensure_ascii=False)+'\n')
          v['prior_q1612_remediation_preserved']=True
          v['semantic_duplicate_review_blob']=os.environ['SEM_BLOB']
          v['top_match_inspection_blob']=os.environ['TOP_BLOB']
          open(os.environ['VERIFY_OUT'],'w').write(json.dumps(v,indent=2,ensure_ascii=False)+'\n')
          PY
      - name: Persist production
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add usmle/data/usmle-step1.db "$VERIFY_OUT" "$STATE_OUT"
          git commit -m 'usmle: import Q1616-Q1620 into production'
          git pull --rebase origin main
          git push
