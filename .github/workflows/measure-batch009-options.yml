name: Measure Batch 009 Options

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/measure-batch009-options.yml'
      - 'data/manual_rule1_batch009_q0401_q0410_20260815.json'
      - 'data/manual_rule1_batch009_q0411_q0420_20260815.json'
      - 'data/manual_rule1_batch009_q0421_q0430_20260815.json'
      - 'data/manual_rule1_batch009_q0431_q0440_20260815.json'
      - 'data/manual_rule1_batch009_q0441_q0450_20260815.json'

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Report option-length measurements only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths=[Path(f'data/manual_rule1_batch009_q{s:04d}_q{s+9:04d}_20260815.json') for s in (401,411,421,431,441)]
          flagged=[]
          for p in paths:
              for q in json.loads(p.read_text())['items']:
                  ls={k:len(q['options'][k].strip()) for k in 'ABCD'}
                  key=q['key']; dm=sum(ls[k] for k in 'ABCD' if k!=key)/3
                  ratio=max(ls.values())/min(ls.values())
                  dev=abs(ls[key]-dm)/dm
                  extreme=ls[key] in (min(ls.values()),max(ls.values()))
                  print(q['id'], 'key='+key, 'lengths='+str(ls), f'ratio={ratio:.3f}', f'key_dev={dev:.3f}', 'key_extreme='+str(int(extreme)))
                  if ratio>1.25 or dev>0.20:
                      flagged.append((q['id'],round(ratio,3),round(dev,3),ls))
          print('MEASUREMENT_FLAGS', len(flagged))
          for x in flagged: print('MEASURE_REVIEW', x)
          print('NOTE: measurement only; no semantic PASS/FAIL decision is made by this script.')
          PY
