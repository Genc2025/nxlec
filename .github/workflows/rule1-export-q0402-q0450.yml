name: Rule1 export source Q0402-Q0450
on:
  push:
    branches: [rule1-q0401-q0450-staging]
    paths:
      - '.github/workflows/rule1-export-q0402-q0450.yml'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export exact source rows only
        shell: bash
        run: |
          python3 - <<'PY'
          import json, sqlite3, subprocess
          from pathlib import Path
          SOURCE=Path('NCLEX_COMMERCIAL_MASTER_CURRENT.db')
          CANONICAL=Path('NCLEX_CANONICAL.db')
          EXPECTED_SOURCE='07e335d471ef1b4689406ba41eb98eaa2ca41472'
          EXPECTED_CANONICAL='5c8742c6577add1bba251ba16dd1a9a316bf2d57'
          def sh(*a): return subprocess.check_output(a,text=True).strip()
          if sh('git','hash-object',str(SOURCE)) != EXPECTED_SOURCE: raise SystemExit('source blob mismatch')
          if sh('git','hash-object',str(CANONICAL)) != EXPECTED_CANONICAL: raise SystemExit('canonical blob mismatch')
          src=sqlite3.connect(SOURCE); src.row_factory=sqlite3.Row
          cc=sqlite3.connect(CANONICAL)
          if src.execute('PRAGMA integrity_check').fetchone()[0] != 'ok': raise SystemExit('source integrity failed')
          if cc.execute('PRAGMA integrity_check').fetchone()[0] != 'ok': raise SystemExit('canonical integrity failed')
          if cc.execute('SELECT COUNT(*) FROM questions').fetchone()[0] != 400: raise SystemExit('canonical count is not 400')
          out=Path('staging_items'); out.mkdir(exist_ok=True)
          exported=[]
          for i in range(402,451):
              uid=f'V2-Q{i:04d}'
              row=src.execute('SELECT * FROM questions WHERE question_uid=?',(uid,)).fetchone()
              if row is None: raise SystemExit(f'missing source row {uid}')
              bp=src.execute('SELECT * FROM nclex_2026_blueprint WHERE category_id=?',(row['category_id'],)).fetchone()
              payload={
                'blueprint_row':dict(bp) if bp else None,
                'canonical_blob_expected':EXPECTED_CANONICAL,
                'source_blob_expected':EXPECTED_SOURCE,
                'source_row':dict(row)
              }
              (out/f'{uid}.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2,sort_keys=True),encoding='utf-8')
              exported.append(uid)
          src.close(); cc.close()
          if len(exported)!=49 or exported[0]!='V2-Q0402' or exported[-1]!='V2-Q0450': raise SystemExit('export range mismatch')
          print('SOURCE_EXPORT_EXACT=49/49')
          PY
      - name: Commit source staging rows
        shell: bash
        run: |
          git config user.name 'OpenAI GitHub Connector'
          git config user.email 'github-connector@openai.com'
          git add staging_items/V2-Q04*.json
          git commit -m 'Stage exact source rows V2-Q0402-V2-Q0450'
          git push origin rule1-q0401-q0450-staging
