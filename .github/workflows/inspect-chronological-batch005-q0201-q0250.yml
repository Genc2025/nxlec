name: Inspect chronological Batch 005 Q0201-Q0250

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-chronological-batch005-q0201-q0250.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect semantic hotspots
        run: |
          python - <<'PY'
          import sqlite3, json
          ids=[205,215,216,220,223,230,231,232,234,236,241,242,243]
          con=sqlite3.connect('NCLEX_COMMERCIAL_MASTER_CURRENT.db'); con.row_factory=sqlite3.Row
          for sid in ids:
              q=con.execute("SELECT question_uid,source_id,category_id,client_need,difficulty,stem,item_data_json,correct_answer_json,rationale,source_name,source_detail,source_url,clinical_qa_status FROM questions WHERE source_bank='v2' AND source_id=?",(sid,)).fetchone()
              print('===== '+q['question_uid']+' =====')
              for k in q.keys():
                  print(k+'='+str(q[k]))
          con.close()
          PY
