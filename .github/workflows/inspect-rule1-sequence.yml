name: Inspect Rule 1 Sequence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-rule1-sequence.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect chronological Rule 1 coverage
        run: |
          python - <<'PY'
          import sqlite3
          con=sqlite3.connect('NCLEX_COMMERCIAL_MASTER_CURRENT.db')
          for a,b in [(1,50),(51,100),(101,150),(151,200),(201,250),(251,300),(301,350),(351,400),(401,450),(451,500),(501,550),(551,600),(601,650),(651,700),(701,750),(751,781),(782,831),(832,881)]:
              qa=con.execute("SELECT COUNT(*) FROM questions WHERE source_bank='v2' AND source_id BETWEEN ? AND ? AND clinical_qa_status LIKE 'SOURCE_VERIFIED_2026_%'",(a,b)).fetchone()[0]
              fg=con.execute("SELECT COUNT(*) FROM question_final_gate qfg JOIN questions q ON q.question_uid=qfg.question_uid WHERE q.source_bank='v2' AND q.source_id BETWEEN ? AND ? AND qfg.final_status='FINAL_QA_PASS'",(a,b)).fetchone()[0]
              ra=con.execute("SELECT COUNT(*) FROM rule1_manual_audit r JOIN questions q ON q.question_uid=r.question_uid WHERE q.source_bank='v2' AND q.source_id BETWEEN ? AND ? AND r.criteria_passed_count=11 AND r.second_pass='PASS' AND r.final_disposition='FINAL_QA_PASS'",(a,b)).fetchone()[0]
              print(f'RANGE {a:04d}-{b:04d} clinical_source_verified={qa}/{b-a+1} final_gate={fg}/{b-a+1} rule1_manual11={ra}/{b-a+1}')
          rows=con.execute("SELECT q.source_id,q.question_uid,q.clinical_qa_status,COALESCE(f.final_status,'NONE'),COALESCE(r.criteria_passed_count,0),COALESCE(r.second_pass,'NONE') FROM questions q LEFT JOIN question_final_gate f ON f.question_uid=q.question_uid LEFT JOIN rule1_manual_audit r ON r.question_uid=q.question_uid WHERE q.source_bank='v2' AND q.source_id BETWEEN 195 AND 260 ORDER BY q.source_id").fetchall()
          for row in rows: print('ITEM',*row,sep='|')
          con.close()
          PY
