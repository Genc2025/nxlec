            'blueprint':{'primary_system':'Behavioral Health, Nervous Systems and Special Senses','official_outline_path':['Nervous System & Special Senses','Degenerative and hereditary neurologic disorders','Hereditary ataxias'],'primary_competency':'Medical Knowledge: Applying Foundational Science Concepts','disciplines':['Biochemistry','Genetics','Physiology'],'coverage_deficit_addressed':'Mitochondrial coenzyme Q biology in hereditary ataxia'},
            'item':{'vignette':'A 12-year-old boy has slowly progressive gait ataxia, dysarthria, exercise intolerance, and cerebellar atrophy on MRI. His parents are unaffected. Muscle testing shows reduced coenzyme Q10, and genetic testing identifies biallelic loss-of-function variants in COQ8A.','lead_in':'Which cellular process is most directly impaired by this defect?','options':{'A':'Lysosomal degradation of gangliosides','B':'Peroxisomal import of very-long-chain fatty acids','C':'Coenzyme Q10 production needed for mitochondrial oxidative phosphorylation','D':'Formation of connexin-32 gap junctions in Schwann cells','E':'Endosomal sodium-hydrogen exchange that regulates organelle pH'},'intended_key':'C','difficulty':'moderate-hard','difficulty_basis':'Expert estimate only; genotype is provided and the item tests the downstream mitochondrial role of coenzyme Q10.','tested_construct':'COQ8A-related primary coenzyme Q10 deficiency impairs mitochondrial oxidative phosphorylation','reasoning_steps_count':4},
            'explanation':{'key_explanation':'COQ8A is required for normal coenzyme Q10 biosynthesis. Coenzyme Q10 is a mitochondrial lipid required for oxidative phosphorylation; COQ8A loss can therefore produce primary CoQ10 deficiency with cerebellar ataxia and exercise intolerance.','distractor_explanations':{'A':'Ganglioside degradation is lysosomal and is not the COQ8A pathway.','B':'Very-long-chain fatty-acid import is a peroxisomal process and does not depend on COQ8A.','C':'Correct. COQ8A loss reduces CoQ10 production and impairs mitochondrial oxidative phosphorylation.','D':'Connexin-32 gap junctions are encoded by GJB1 and are relevant to CMT1X.','E':'Endosomal sodium-hydrogen exchange is mediated by NHE6/SLC9A6, not COQ8A.'},'educational_objective':'Connect biallelic COQ8A loss with primary coenzyme Q10 deficiency and impaired mitochondrial oxidative phosphorylation.'},
