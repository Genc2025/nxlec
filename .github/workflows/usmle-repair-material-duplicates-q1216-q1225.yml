            'sources':[usmle('Q1216-S1'),src('Q1216-S2','National Library of Medicine','COQ8A gene: MedlinePlus Genetics','https://medlineplus.gov/genetics/gene/coq8a/','page accessible and reverified 2026-09-05','Normal Function; Primary coenzyme Q10 deficiency','COQ8A participates in CoQ10 production; CoQ10 has an essential role in mitochondrial oxidative phosphorylation.'),src('Q1216-S3','NCBI Bookshelf / GeneReviews','Primary Coenzyme Q10 Deficiency Overview','https://www.ncbi.nlm.nih.gov/books/NBK410087/','Last Update 2023-06-08; reverified 2026-09-05','Clinical characteristics; COQ8A; molecular pathogenesis','Primary CoQ10 deficiency results from biallelic variants in CoQ biosynthesis genes; COQ8A disease commonly features cerebellar ataxia.','true'=='true','NCBI-hosted GeneReviews; facts paraphrased')],
