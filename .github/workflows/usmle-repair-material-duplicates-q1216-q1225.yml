          old_terms=['friedreich ataxia','abcd1','pmp22 duplication','rett syndrome','gnas','mc2r','familial hypocalciuric hypercalcemia']
          for n,o in got.items():
            assert o['status']=='CANDIDATE_FROZEN' and o['item']['intended_key']==expected[n]
            assert list(o['item']['options'])==['A','B','C','D','E'] and len(set(o['item']['options'].values()))==5
            assert all(t in official for t in o['blueprint']['disciplines'])
            assert len(o['sources'])>=2 and all(s['url'].startswith('https://') and s['section_locator'] for s in o['sources'])
            assert 'ncjmm' not in json.dumps(o).casefold()
            assert not any(t in o['item']['tested_construct'].casefold() for t in old_terms)
          print(json.dumps({'status':'PASS','replaced':sorted(got),'keys':expected,'production_db_modified':False},sort_keys=True))
