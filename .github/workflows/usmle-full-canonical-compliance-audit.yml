name: USMLE Full Canonical Compliance Audit
on:
  push:
    paths:
      - '.github/workflows/usmle-full-canonical-compliance-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_COUNT: '1535'
      DB_BLOB: a3f28fcfd0a89161ed003e60d0d797c5fa103f1a
      AUDIT_OUT: usmle/audit/FULL_CANONICAL_Q0001_Q1535_COMPLIANCE.json
    steps:
      - uses: actions/checkout@v6
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Bind production DB and compile auditor
        run: |
          set -euo pipefail
          test "$(git hash-object usmle/data/usmle-step1.db)" = "$DB_BLOB"
          python -m py_compile usmle/audit_full_canonical_compliance.py
      - name: Run read-only full canonical audit
        run: |
          set -euo pipefail
          BEFORE="$(git hash-object usmle/data/usmle-step1.db)"
          python usmle/audit_full_canonical_compliance.py
          AFTER="$(git hash-object usmle/data/usmle-step1.db)"
          test "$BEFORE" = "$AFTER"
          test "$AFTER" = "$DB_BLOB"
      - name: Persist audit report only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$AUDIT_OUT"
          git commit -m 'usmle: audit full Q0001-Q1535 canonical compliance'
          git push

