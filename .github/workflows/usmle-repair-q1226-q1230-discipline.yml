name: USMLE Repair Q1226-Q1230 Discipline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/usmle-repair-q1226-q1230-discipline.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Repair official discipline labels and revalidate JSON
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('usmle/batch_specs_1201_1300/q1226_q1230_r2')
          for n in range(1226,1231):
              p=root/f'Q{n}.json'
              d=json.loads(p.read_text())
              tags=d['blueprint']['disciplines']
              tags=['Histology & Cell Biology' if x=='Cell Biology' else x for x in tags]
              d['blueprint']['disciplines']=tags
              assert 'Cell Biology' not in tags
              assert 'Histology & Cell Biology' in tags
              p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          PY
          python -m json.tool usmle/batch_specs_1201_1300/q1226_q1230_r2/Q1226.json >/dev/null
          python -m json.tool usmle/batch_specs_1201_1300/q1226_q1230_r2/Q1227.json >/dev/null
          python -m json.tool usmle/batch_specs_1201_1300/q1226_q1230_r2/Q1228.json >/dev/null
          python -m json.tool usmle/batch_specs_1201_1300/q1226_q1230_r2/Q1229.json >/dev/null
          python -m json.tool usmle/batch_specs_1201_1300/q1226_q1230_r2/Q1230.json >/dev/null
      - name: Persist repair
        shell: bash
        run: |
          git config user.name 'USMLE QA Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add usmle/batch_specs_1201_1300/q1226_q1230_r2/Q1226.json \
                  usmle/batch_specs_1201_1300/q1226_q1230_r2/Q1227.json \
                  usmle/batch_specs_1201_1300/q1226_q1230_r2/Q1228.json \
                  usmle/batch_specs_1201_1300/q1226_q1230_r2/Q1229.json \
                  usmle/batch_specs_1201_1300/q1226_q1230_r2/Q1230.json
          git commit -m 'Repair Q1226-Q1230 USMLE discipline labels'
          git pull --rebase origin main
          git push origin HEAD:main
