name: Fix Batch 006 Q0282 currentness evidence
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-batch006-q0282-version.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/build_batch006_chronological_audit.py')
          s=p.read_text()
          old='CDC About Meningitis updated 2025-09-09; currentness cross-checked against CDC meningococcal clinical guidance dated 2026-06-04.'
          new='CDC About Meningitis updated 2025-09-09; currentness cross-checked against CDC meningococcal clinical guidance dated 2026-06-04 and rechecked 2026-08-15.'
          if old not in s: raise SystemExit('Q0282 version pattern not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/build_batch006_chronological_audit.py
          git commit -m 'Fix Batch 006 Q0282 currentness locator date'
          git push
