name: Repair Batch 010 Payload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-batch010-payload.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize authored payload encoding
        run: |
          python - <<'PY'
          import base64, gzip, zlib, bz2, lzma
          from pathlib import Path
          p=Path('data/batch010_manual_payload.json.gz.b64')
          s=p.read_text(encoding='ascii').strip(); s += '=' * (-len(s)%4)
          blob=base64.b64decode(s, validate=True)
          decoders=[
            ('gzip', gzip.decompress),
            ('zlib', zlib.decompress),
            ('raw-deflate', lambda b:zlib.decompress(b,-15)),
            ('bz2', bz2.decompress),
            ('lzma', lzma.decompress),
          ]
          raw=None
          for name,fn in decoders:
            try:
              candidate=fn(blob)
              candidate.decode('utf-8')
              raw=candidate
              print(f'PAYLOAD_DECODED codec={name} bytes={len(raw)}')
              break
            except Exception as exc:
              print(f'codec={name} failed={type(exc).__name__}')
          if raw is None:
            raise SystemExit('No supported payload codec decoded the authored payload')
          fixed=base64.b64encode(gzip.compress(raw,compresslevel=9,mtime=0)).decode('ascii')+'\n'
          p.write_text(fixed,encoding='ascii')
          print(f'PAYLOAD_NORMALIZED gzip_base64_chars={len(fixed.strip())}')
          PY
      - name: Commit normalized payload
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/batch010_manual_payload.json.gz.b64
          if git diff --cached --quiet; then
            echo 'Payload already normalized'
          else
            git commit -m 'Normalize Batch 010 manual payload encoding'
            git push
          fi
