name: USMLE Audit Q1281-Q1290 Readonly

on:
  push:
    branches: [main]
    paths:
      - 'usmle/audit/AUDIT_TRIGGER_Q1281_Q1290_READONLY'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Bind audit to exact candidate and canonical state
        run: |
          set -euo pipefail
          test "$(git hash-object usmle/batch_specs_1201_1300/11_q1281_q1290_author_20260906.json)" = "fdda09072509425b0321aafbe921aa95fed53aee"
          test "$(git hash-object usmle/data/usmle-step1.db)" = "c6d3a9df9c8887b6ff3f3dbac6c710ed564bb4ed"
      - name: Reverify source and evidence contract from zero
        run: |
          set -euo pipefail
          python -m py_compile usmle/verify_author_q1281_q1290.py usmle/audit_q1281_q1290_readonly.py
          python usmle/verify_author_q1281_q1290.py
      - name: Execute readonly adversarial audit
        env:
          EXPECTED_CANDIDATE_BLOB: fdda09072509425b0321aafbe921aa95fed53aee
        run: |
          set -euo pipefail
          python usmle/audit_q1281_q1290_readonly.py
      - name: Verify readonly output
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('usmle/audit/Q1281_Q1290_READONLY_AUDIT.json'))
          assert r['verdict']=='READONLY_QA_PASS' and r['failures']==[]
          assert r['candidate_blob']=='fdda09072509425b0321aafbe921aa95fed53aee'
          assert r['canonical_db_blob']=='c6d3a9df9c8887b6ff3f3dbac6c710ed564bb4ed' and r['canonical_count']==r['canonical_review_count']==1280
          assert r['answer_key_sequence']=='BDACECAEDB' and r['answer_distribution']=={'A':2,'B':2,'C':2,'D':2,'E':2}
          assert len(r['item_reports'])==10
          for x in r['item_reports']:
              assert x['status']=='PASS' and x['adversarial_second_pass']=='PASS' and x['second_possible_answer']=='PASS_NONE'
              assert x['blind_audit']['status']=='PASS' and x['canonical_duplicate_gate']['status']=='PASS' and x['ncjmm']=='NOT_APPLICABLE_USMLE'
          print('READONLY_ZERO_TRUST_AUDIT=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: q1281-q1290-readonly-audit
          path: usmle/audit/Q1281_Q1290_READONLY_AUDIT.json
          if-no-files-found: error
