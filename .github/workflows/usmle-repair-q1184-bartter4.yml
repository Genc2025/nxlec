name: USMLE Repair Q1184 Bartter IV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/usmle-repair-q1184-bartter4.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Replace only Q1184
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('usmle/batch_specs_1101_1200/10_q1181_q1185.json')
          arr=json.loads(p.read_text())
          assert [x['num'] for x in arr]==[1181,1182,1183,1184,1185]
          i=next(i for i,x in enumerate(arr) if x['num']==1184)
          arr[i]={
            'num':1184,
            'system':'Respiratory and Renal/Urinary Systems',
            'outline':['Renal & Urinary System','Metabolic and regulatory disorders','disorders of renal tubular function'],
            'primary_competency':'Medical Knowledge: Applying Foundational Science Concepts',
            'discipline':'Physiology / Genetics','disciplines':['Physiology','Genetics'],
            'diagnosis':'Bartter syndrome type IV due to BSND dysfunction',
            'mechanism':'BSND encodes barttin, an essential beta subunit required for trafficking and function of ClC-Ka and ClC-Kb chloride channels. In the thick ascending limb, loss of barttin impairs basolateral chloride exit and salt reabsorption, producing renal salt wasting, secondary hyperreninemic hyperaldosteronism, hypokalemic metabolic alkalosis and low-to-normal blood pressure. The same ClC-K channel complex in the inner ear explains congenital sensorineural hearing loss.',
            'vignette':'A 3-month-old boy is evaluated for poor weight gain, polyuria, and recurrent dehydration. He was born prematurely after a pregnancy complicated by polyhydramnios. Laboratory studies show hypokalemia, hypochloremic metabolic alkalosis, and markedly elevated plasma renin and aldosterone concentrations; blood pressure is low-normal. Auditory brainstem testing confirms bilateral sensorineural hearing loss. Genetic testing identifies biallelic pathogenic variants in BSND.',
            'lead':'Which transport abnormality most directly explains the combination of this patient’s renal and auditory findings?',
            'correct':'Impaired function of barttin-dependent ClC-Ka and ClC-Kb chloride channels in renal tubules and the inner ear',
            'distractors':['Impaired apical Na-K-2Cl cotransport caused by SLC12A1 dysfunction only in the thick ascending limb','Impaired apical ROMK potassium recycling caused by KCNJ1 dysfunction only in the thick ascending limb','Loss of the thiazide-sensitive Na-Cl cotransporter in the distal convoluted tubule','Loss of epithelial sodium-channel activity in the collecting duct and secretory epithelia'],
            'distractor_notes':['SLC12A1 causes Bartter type I and explains antenatal salt wasting but not the defining sensorineural deafness produced by the ClC-K/barttin complex in kidney and inner ear.','KCNJ1 causes Bartter type II and can produce severe neonatal salt wasting but does not explain the characteristic sensorineural hearing loss of type IV.','SLC12A3 deficiency causes Gitelman syndrome, a later-onset distal-convoluted-tubule salt-wasting disorder without congenital sensorineural deafness.','ENaC loss causes systemic pseudohypoaldosteronism type I with salt wasting and hyperkalemia/metabolic acidosis rather than hypokalemic metabolic alkalosis.' ],
            'key_expl':'Bartter syndrome type IV can result from BSND variants. Barttin is required for ClC-Ka/ClC-Kb chloride-channel function in renal tubules and potassium-secreting epithelia of the inner ear. Loss of this complex causes severe renal salt wasting with hypokalemic metabolic alkalosis and sensorineural deafness.',
            'objective':'Link BSND/barttin dysfunction to impaired ClC-Ka/ClC-Kb channel function and recognize Bartter type IV from antenatal salt wasting plus sensorineural hearing loss.',
            'clues':['polyhydramnios and prematurity','neonatal salt wasting','hypokalemic hypochloremic metabolic alkalosis','high renin and aldosterone','low-normal blood pressure','sensorineural hearing loss','biallelic BSND variants'],
            'difficulty':'moderate-hard','reasoning_steps_count':4,
            'duplicate_probe_terms':['Bartter syndrome type IV BSND','barttin ClC-Ka ClC-Kb hearing loss','antenatal Bartter sensorineural deafness','BSND salt wasting deafness'],
            'sources':[
              {'organization':'United States Medical Licensing Examination','title':'Step 1 Exam Content','url':'https://www.usmle.org/exam-resources/step-1-materials/step-1-content-outline-and-specifications','date':'Current official Step 1 specifications; verified 2026-09-04','locator':'Step 1 Content Specifications — Respiratory and Renal/Urinary Systems; Medical Knowledge: Applying Foundational Science Concepts','support':'Supports the Step 1 system and competency classification.'},
              {'organization':'United States Medical Licensing Examination','title':'USMLE Content Outline (2026)','url':'https://www.usmle.org/sites/default/files/2022-01/USMLE_Content_Outline_0.pdf','date':'For Public Release: USMLE Content Outline (2026); verified 2026-09-04','locator':'p.24 — Renal & Urinary System > Metabolic/regulatory disorders and disorders of renal tubular function','support':'Places renal tubular salt-handling disorders in the official 2026 renal outline.'},
              {'organization':'National Library of Medicine, MedlinePlus Genetics','title':'Bartter syndrome','url':'https://medlineplus.gov/genetics/condition/bartter-syndrome/','date':'Current MedlinePlus Genetics page; verified 2026-09-04','locator':'Description; Causes; Inheritance','support':'Supports antenatal Bartter syndrome, hypokalemia, salt wasting, BSND as a cause of type IV, and the association of type IV with sensorineural hearing loss.'},
              {'organization':'National Library of Medicine, MedlinePlus Genetics','title':'BSND gene','url':'https://medlineplus.gov/genetics/gene/bsnd/','date':'Current MedlinePlus Genetics gene page; verified 2026-09-04','locator':'Health Conditions Related to Genetic Changes — Bartter syndrome','support':'Supports barttin regulation of ClC-Ka/ClC-Kb channels, renal salt wasting, and inner-ear channel dysfunction causing hearing loss.'},
              {'organization':'National Center for Biotechnology Information, Genetic Testing Registry','title':'BSND barttin CLCNK type accessory subunit beta','url':'https://www.ncbi.nlm.nih.gov/gtr/genes/7809/','date':'Gene record updated July 23, 2026; verified 2026-09-04','locator':'Summary; Associated conditions','support':'Identifies barttin as an essential beta subunit for CLC chloride channels in renal tubules and inner ear and links BSND variants to Bartter syndrome with sensorineural deafness.'}
            ]
          }
          p.write_text(json.dumps(arr,indent=2,ensure_ascii=False)+'\n')
          PY
      - name: Persist repaired spec
        run: |
          git config user.name 'USMLE Spec Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add usmle/batch_specs_1101_1200/10_q1181_q1185.json
          git commit -m 'Replace Q1184 with Bartter type IV BSND construct'
          git pull --rebase origin main
          git push origin HEAD:main
