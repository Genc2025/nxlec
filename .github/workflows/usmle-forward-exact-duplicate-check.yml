name: USMLE Forward Exact Duplicate Check

on:
  push:
    branches: [main]
    paths:
      - 'usmle/batch_specs_0601_0700/**'
      - 'usmle/batch_specs_0701_0800/**'
      - '.github/workflows/usmle-forward-exact-duplicate-check.yml'
      - 'usmle/audit/FORWARD_EXACT_DUPLICATE_CHECK_TRIGGER'
      - 'usmle/audit/FORWARD_CONCEPT_PROBE.json'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Scan authoritative SQLite for staged diagnosis overlap
        run: |
          python - <<'PY'
          import glob, json, re, sqlite3

          def norm(s):
              return re.sub(r'[^a-z0-9]+',' ',(s or '').lower()).strip()

          def walk_strings(v, path='$'):
              if isinstance(v, dict):
                  for k,x in v.items():
                      yield from walk_strings(x, f'{path}.{k}')
              elif isinstance(v, list):
                  for i,x in enumerate(v):
                      yield from walk_strings(x, f'{path}[{i}]')
              elif isinstance(v, str):
                  yield path, v

          staged=[]
          for pattern in ('usmle/batch_specs_0601_0700/*.json','usmle/batch_specs_0701_0800/*.json'):
              for fn in sorted(glob.glob(pattern)):
                  obj=json.load(open(fn))
                  rows=obj if isinstance(obj,list) else obj.get('items',[])
                  for x in rows:
                      if isinstance(x,dict) and x.get('num') and x.get('diagnosis'):
                          staged.append((int(x['num']),x['diagnosis'],fn))

          con=sqlite3.connect('usmle/data/usmle-step1.db')
          assert con.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          finals=con.execute(
              "SELECT candidate_id,payload_json FROM step2_final_items WHERE final_status='FINAL_10_10_PASS'"
          ).fetchall()
          def qnum(cid):
              m=re.search(r'DIRECT-(\d{4})',cid or '')
              assert m, cid
              return int(m.group(1))
          nums=sorted(qnum(cid) for cid,_ in finals)
          assert nums and nums==list(range(1,max(nums)+1)), (len(nums), nums[:3], nums[-3:])

          report=[]
          for num,diag,fn in staged:
              nd=norm(diag)
              hits=[]
              for cid,pj in finals:
                  obj=json.loads(pj)
                  for p,s in walk_strings(obj):
                      ns=norm(s)
                      if nd and nd in ns:
                          hits.append({'candidate_id':cid,'json_path':p,'text':s[:240]})
                          break
              report.append({'num':num,'diagnosis':diag,'file':fn,'canonical_hits':hits})

          probes=[]
          probe_file='usmle/audit/FORWARD_CONCEPT_PROBE.json'
          if glob.glob(probe_file):
              raw=json.load(open(probe_file))
              for probe in raw.get('probes',[]):
                  terms=[norm(x) for x in probe.get('terms',[]) if norm(x)]
                  hits=[]
                  for cid,pj in finals:
                      obj=json.loads(pj)
                      for p,s in walk_strings(obj):
                          ns=norm(s)
                          matched=[t for t in terms if t in ns]
                          if matched:
                              hits.append({'candidate_id':cid,'json_path':p,'matched_terms':matched,'text':s[:260]})
                              break
                  probes.append({'name':probe.get('name'),'terms':probe.get('terms',[]),'canonical_hits':hits})
          print(json.dumps({'canonical_final_count':len(finals),'staged_count':len(staged),'report':report,'probes':probes},indent=2,sort_keys=True))
          PY
