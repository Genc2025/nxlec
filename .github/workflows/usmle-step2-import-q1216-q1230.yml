name: USMLE Step2 Import Q1216-Q1230

on:
  push:
    branches: [main]
    paths:
      - 'usmle/audit/STEP2_IMPORT_TRIGGER_Q1216_Q1230'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile transactional importer
        run: python -m py_compile usmle/step2_import_q1216_q1230.py
      - name: Import Q1216-Q1230 transactionally
        shell: bash
        run: |
          set -euo pipefail
          python usmle/step2_import_q1216_q1230.py | tee /tmp/q1216-q1230-import-result.json
      - name: Independently verify SQLite and state before persist
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,re,sqlite3,subprocess
          db=pathlib.Path('usmle/data/usmle-step1.db')
          state=pathlib.Path('usmle/state/step2_final_q0001_q1230.json')
          final=pathlib.Path('usmle/audit/STEP2_FINAL_10_10_Q0001_Q1230.json')
          s=json.loads(state.read_text()); f=json.loads(final.read_text())
          assert s['final_status']=='FINAL_10_10_PASS'
          assert s['item_count']==1230 and s['step2_final_review_count']==1230
          assert s['contiguous_q0001_q1230'] is True and s['q1216_q1230_present_exactly_once'] is True
          assert s['sqlite_integrity_check']=='ok' and s['payload_review_consistency']=='PASS'
          assert s['official_system_labels_validated'] is True and s['official_discipline_metadata_validated'] is True
          assert s['wal_sidecar_present_after_close'] is False and s['shm_sidecar_present_after_close'] is False
          assert isinstance(s.get('wal_checkpoint_result'),list) and s['wal_checkpoint_result'][0]==0
          assert f['final_verdict']=='FINAL_10_10_PASS_NO_MATERIAL_DEFECT' and f['production_import_completed'] is True
          blob=subprocess.check_output(['git','hash-object',str(db)],text=True).strip()
          assert blob==s['post_authoritative_db_blob']
          assert hashlib.sha256(db.read_bytes()).hexdigest()==s['post_authoritative_db_sha256']
          # immutable=1 prevents this independent read from creating WAL/SHM sidecars itself.
          con=sqlite3.connect(db.resolve().as_uri()+'?mode=ro&immutable=1',uri=True)
          assert con.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          ic=con.execute("SELECT COUNT(*) FROM step2_final_items WHERE final_status='FINAL_10_10_PASS'").fetchone()[0]
          rc=con.execute("SELECT COUNT(*) FROM step2_final_reviews WHERE final_status='FINAL_10_10_PASS'").fetchone()[0]
          assert (ic,rc)==(1230,1230)
          rows=con.execute("SELECT candidate_id FROM step2_final_items WHERE final_status='FINAL_10_10_PASS'").fetchall()
          nums=[]
          for (cid,) in rows:
              m=re.search(r'DIRECT-(\d{4})',cid); assert m,cid; nums.append(int(m.group(1)))
          assert set(nums)==set(range(1,1231)) and len(nums)==len(set(nums))==1230
          con.close()
          print('PRE_PERSIST_VERIFY=PASS COUNT=1230 REVIEWS=1230 BLOB='+blob)
          PY
      - name: Persist authoritative Q1230 database state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'USMLE Production Finalizer'
          git config user.email 'actions@users.noreply.github.com'
          git add usmle/data/usmle-step1.db usmle/state/step2_final_q0001_q1230.json usmle/audit/STEP2_FINAL_10_10_Q0001_Q1230.json
          git diff --cached --quiet && { echo 'No production changes to persist'; exit 1; }
          git commit -m 'USMLE: finalize canonical Q0001-Q1230'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Verify persisted main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          import json,pathlib,re,sqlite3,subprocess
          db=pathlib.Path('usmle/data/usmle-step1.db')
          s=json.loads(pathlib.Path('usmle/state/step2_final_q0001_q1230.json').read_text())
          assert s['item_count']==1230 and s['step2_final_review_count']==1230 and s['contiguous_q0001_q1230'] is True
          assert subprocess.check_output(['git','hash-object',str(db)],text=True).strip()==s['post_authoritative_db_blob']
          con=sqlite3.connect(db.resolve().as_uri()+'?mode=ro&immutable=1',uri=True)
          assert con.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert con.execute("SELECT COUNT(*) FROM step2_final_items WHERE final_status='FINAL_10_10_PASS'").fetchone()[0]==1230
          assert con.execute("SELECT COUNT(*) FROM step2_final_reviews WHERE final_status='FINAL_10_10_PASS'").fetchone()[0]==1230
          rows=con.execute("SELECT candidate_id FROM step2_final_items WHERE final_status='FINAL_10_10_PASS'").fetchall()
          nums=[]
          for (cid,) in rows:
              m=re.search(r'DIRECT-(\d{4})',cid); assert m; nums.append(int(m.group(1)))
          assert set(nums)==set(range(1,1231)) and len(nums)==1230
          con.close()
          print('PERSISTED_MAIN_VERIFY=PASS COUNT=1230 REVIEWS=1230')
          PY
