name: USMLE Author Q1251-Q1260 R3

on:
  push:
    branches: [main]
    paths:
      - 'usmle/audit/AUTHOR_TRIGGER_Q1251_Q1260_R3'

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify exact Q1250 canonical pre-state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object usmle/data/usmle-step1.db)" = "3eeb306808a842cdcd3ba08fb29ec5145ce36ced"
          python - <<'PY'
          import json
          s=json.load(open('usmle/state/step2_final_q0001_q1250.json'))
          assert s['final_status']=='FINAL_10_10_PASS' and s['item_count']==1250 and s['step2_final_review_count']==1250
          assert s['contiguous_q0001_q1250'] is True and s['post_authoritative_db_blob']=='3eeb306808a842cdcd3ba08fb29ec5145ce36ced'
          print('Q1250_PRESTATE=PASS')
          PY
      - name: Regenerate repaired candidate from source of truth
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile usmle/author_q1251_q1260.py usmle/author_q1251_q1260_r2.py usmle/verify_author_q1251_q1260.py
          (cd usmle && python author_q1251_q1260_r2.py)
      - name: Full independent author verification from zero
        shell: bash
        run: |
          set -euo pipefail
          python usmle/verify_author_q1251_q1260.py
      - name: Persist frozen candidate only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'USMLE Author QA'
          git config user.email 'actions@users.noreply.github.com'
          git add usmle/batch_specs_1201_1300/08_q1251_q1260_author_20260906.json
          git diff --cached --quiet && { echo 'No candidate generated'; exit 1; }
          git commit -m 'USMLE: freeze repaired candidate Q1251-Q1260 pending FINAL QA'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Verify persisted candidate and untouched canonical DB
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          test "$(git hash-object usmle/data/usmle-step1.db)" = "3eeb306808a842cdcd3ba08fb29ec5145ce36ced"
          python usmle/verify_author_q1251_q1260.py
          echo "CANDIDATE_PERSISTED=PASS BLOB=$(git hash-object usmle/batch_specs_1201_1300/08_q1251_q1260_author_20260906.json) DB_UNTOUCHED=PASS"
