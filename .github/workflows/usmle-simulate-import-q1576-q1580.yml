name: USMLE Detached Import Simulation Q1576-Q1580
on:
  push:
    paths: ['.github/workflows/usmle-simulate-import-q1576-q1580.yml']
permissions:
  contents: write
jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      START_Q: '1576'
      END_Q: '1580'
      PRE_COUNT: '1575'
      DB_BLOB: 20a68f1500774333f082967440f383bcc5116c14
      CAND_PATH: usmle/batch_specs_1501_1600/16_q1576_q1580_author_20260913.json
      CAND_BLOB: 7215c4c3cb11488d722aef899b3b66a558d25762
      MAN_PATH: usmle/audit/Q1576_Q1580_FINAL_QA_PASS.json
      MAN_BLOB: d5ce56a33179704a63a3565eae7bb1db5173604f
      SIM_OUT: usmle/audit/Q1576_Q1580_DETACHED_IMPORT_SIMULATION.json
      AUDIT_DATE: '20260913'
      CANDIDATE_STAMP: '20260913T154500Z'
      FINALIZED_AT: '2026-09-13T15:45:00Z'
    steps:
      - uses: actions/checkout@v6
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Simulate next five
        run: |
          set -euo pipefail
          test "$(git hash-object usmle/data/usmle-step1.db)" = "$DB_BLOB"
          test "$(git hash-object "$CAND_PATH")" = "$CAND_BLOB"
          test "$(git hash-object "$MAN_PATH")" = "$MAN_BLOB"
          python usmle/simulate_import_next5.py
          test "$(git hash-object usmle/data/usmle-step1.db)" = "$DB_BLOB"
          python - <<'PY'
          import json,os
          r=json.load(open(os.environ['SIM_OUT']))
          assert r['status']=='DETACHED_IMPORT_SIMULATION_PASS'
          assert r['pre_production_count']==1575 and r['simulated_post_count']==1580
          assert r['post_simulation_contiguous_q0001_q1580'] is True
          assert r['production_transactional_import_ready'] is True
          assert r['production_db_modified'] is False and r['failures']==[]
          PY
      - name: Persist simulation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$SIM_OUT"
          git commit -m 'usmle: pass detached import simulation Q1576-Q1580'
          git pull --rebase origin main
          git push
