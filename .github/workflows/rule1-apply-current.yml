name: Rule 1 apply current canonical item
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rule1-apply-current.yml'
      - 'RULE1_CURRENT_PAYLOAD.json'
      - 'tools/rule1_apply.py'
permissions:
  contents: write
concurrency:
  group: rule1-canonical-main
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply one audited item without rebuilding canonical DB
        run: python3 tools/rule1_apply.py
      - name: Commit canonical DB and verification state
        shell: bash
        run: |
          git config user.name 'OpenAI GitHub Connector'
          git config user.email 'github-connector@openai.com'
          git add NCLEX_CANONICAL.db RULE1_CANONICAL_STATE.json RULE1_NEXT_ITEM_STATE.json
          if git diff --cached --quiet; then
            echo 'Canonical DB already contains this exact audited item; verification only.'
            exit 0
          fi
          uid=$(python3 -c "import json; print(json.load(open('RULE1_CURRENT_PAYLOAD.json'))['question_uid'])")
          git commit -m "Rule 1 FINAL_QA_PASS ${uid} canonical checkpoint"
          git pull --rebase origin main
          git push origin main
