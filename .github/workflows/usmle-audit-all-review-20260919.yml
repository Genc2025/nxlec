name: USMLE audit review branch 20260919
on:
  push:
    branches: ['audit/usmle-all-20260919']
    paths: ['.github/workflows/usmle-audit-all-review-20260919.yml']
permissions:
  contents: write
jobs:
  reproduce-reviewed-repairs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/usmle-all-20260919
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reproduce the reviewed snapshot corrections and audit
        run: |
          set -euo pipefail
          python -m unittest discover -s usmle/tests -p test_full_canonical_audit.py
          python usmle/remediation/audit_all_20260919.py
          python usmle/audit_all_items_20260919.py
          AUDIT_DATE=20260919 python usmle/audit_full_canonical_compliance.py
      - name: Commit to the review branch only
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'audit/usmle-all-20260919'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add usmle/data/usmle-step1.db usmle/audit/ALL_ITEMS_20260919_COVERAGE.json usmle/audit/FULL_CANONICAL_Q0001_Q1635_COMPLIANCE.json usmle/remediation/ALL_ITEMS_20260919_BEFORE_ROWS.json usmle/remediation/ALL_ITEMS_20260919_REPAIRS.json
          git commit -m 'usmle: persist blocked audit candidate and complete coverage ledger'
          git push origin HEAD:refs/heads/audit/usmle-all-20260919
