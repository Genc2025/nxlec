name: USMLE Detached Import Simulation Q1566-Q1570
on:
  push:
    paths:
      - '.github/workflows/usmle-simulate-import-q1566-q1570.yml'
permissions:
  contents: write
jobs:
  detached-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      START_Q: '1566'
      END_Q: '1570'
      PRE_COUNT: '1565'
      DB_BLOB: f988cd9d7f04439435cb71ef7289c6269900f020
      CAND_PATH: usmle/batch_specs_1501_1600/14_q1566_q1570_author_20260913.json
      CAND_BLOB: 587e8fc6e15e394d6efdbda90fb4bee1d9cb9eb8
      MAN_PATH: usmle/audit/Q1566_Q1570_FINAL_QA_PASS.json
      MAN_BLOB: 66d33ed529192f4c321302f48e789efcf9bd9eb0
      SIM_OUT: usmle/audit/Q1566_Q1570_DETACHED_IMPORT_SIMULATION.json
      AUDIT_DATE: '20260913'
      CANDIDATE_STAMP: '20260913T040500Z'
      FINALIZED_AT: '2026-09-13T04:05:00Z'
    steps:
      - uses: actions/checkout@v6
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Run detached next-five simulation
        run: |
          set -euo pipefail
          test "$(git hash-object usmle/data/usmle-step1.db)" = "$DB_BLOB"
          test "$(git hash-object "$CAND_PATH")" = "$CAND_BLOB"
          test "$(git hash-object "$MAN_PATH")" = "$MAN_BLOB"
          python -m py_compile usmle/simulate_import_next5.py
          python usmle/simulate_import_next5.py
          test "$(git hash-object usmle/data/usmle-step1.db)" = "$DB_BLOB"
          python - <<'PY'
          import json,os
          r=json.load(open(os.environ['SIM_OUT']))
          assert r['audit_id']=='Q1566-Q1570-DETACHED-IMPORT-SIMULATION-20260913'
          assert r['status']=='DETACHED_IMPORT_SIMULATION_PASS'
          assert r['pre_production_count']==1565 and r['simulated_post_count']==1570
          assert r['post_simulation_contiguous_q0001_q1570'] is True
          assert r['all_final_qa_gates_bound'] is True
          assert r['production_transactional_import_ready'] is True
          assert r['production_db_modified'] is False
          assert r['failures']==[]
          PY
      - name: Commit simulation report only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$SIM_OUT"
          git commit -m 'usmle: pass detached import simulation Q1566-Q1570'
          git pull --rebase origin main
          git push
