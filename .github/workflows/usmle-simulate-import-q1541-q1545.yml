name: USMLE Detached Import Simulation Q1541-Q1545
on:
  push:
    paths:
      - '.github/workflows/usmle-simulate-import-q1541-q1545.yml'
permissions:
  contents: write
jobs:
  detached-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      START_Q: '1541'
      END_Q: '1545'
      PRE_COUNT: '1540'
      DB_BLOB: 6e55027ca4232f0d0c0df99c33702c5f1d6df117
      CAND_PATH: usmle/batch_specs_1501_1600/09_q1541_q1545_author_20260912.json
      CAND_BLOB: 25fd87761b792f43a3422a0c261cba22a1520344
      MAN_PATH: usmle/audit/Q1541_Q1545_FINAL_QA_PASS.json
      MAN_BLOB: 1e5109896583fe44741b4c06606631e1b74bf80a
      SIM_OUT: usmle/audit/Q1541_Q1545_DETACHED_IMPORT_SIMULATION.json
      AUDIT_DATE: '20260912'
      CANDIDATE_STAMP: '20260912T164000Z'
      FINALIZED_AT: '2026-09-12T16:40:00Z'
    steps:
      - uses: actions/checkout@v6
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Run detached next-five simulation
        run: |
          set -euo pipefail
          test "$(git hash-object usmle/data/usmle-step1.db)" = "$DB_BLOB"
          test "$(git hash-object "$CAND_PATH")" = "$CAND_BLOB"
          test "$(git hash-object "$MAN_PATH")" = "$MAN_BLOB"
          python -m py_compile usmle/simulate_import_next5.py
          python usmle/simulate_import_next5.py
          test "$(git hash-object usmle/data/usmle-step1.db)" = "$DB_BLOB"
          python - <<'PY'
          import json,os
          r=json.load(open(os.environ['SIM_OUT']))
          assert r['audit_id']=='Q1541-Q1545-DETACHED-IMPORT-SIMULATION-20260912'
          assert r['status']=='DETACHED_IMPORT_SIMULATION_PASS'
          assert r['pre_production_count']==1540 and r['simulated_post_count']==1545
          assert r['post_simulation_contiguous_q0001_q1545'] is True
          assert r['all_final_qa_gates_bound'] is True
          assert r['production_transactional_import_ready'] is True
          assert r['production_db_modified'] is False
          assert r['failures']==[]
          PY
      - name: Commit simulation report only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$SIM_OUT"
          git commit -m 'usmle: pass detached import simulation Q1541-Q1545'
          git pull --rebase origin main
          git push
