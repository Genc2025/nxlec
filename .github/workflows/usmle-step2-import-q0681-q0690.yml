name: USMLE Step2 Import Approved Q0681-Q0690

on:
  push:
    branches: [main]
    paths:
      - 'usmle/audit/STEP2_FINALIZE_TRIGGER_Q0681_Q0690'

permissions:
  contents: write

concurrency:
  group: usmle-step2-import-q0681-q0690
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Package and insert only individually approved Q0681-Q0690
        run: python usmle/step2_import_q0681_q0690.py
      - name: Independently verify authoritative SQLite
        run: |
          python - <<'PY'
          import hashlib, json, re, sqlite3, subprocess
          from collections import Counter
          def canon(o): return json.dumps(o,sort_keys=True,separators=(',',':'),ensure_ascii=False)
          def h(o): return hashlib.sha256(canon(o).encode()).hexdigest()
          def qnum(cid):
              m=re.search(r'DIRECT-(\d{4})',cid or '')
              assert m, cid
              return int(m.group(1))
          expected_blueprint={
            'Human Development':14,
            'Respiratory and Renal/Urinary Systems':89,
            'Blood, Lymphoreticular and Immune Systems':76,
            'Behavioral Health, Nervous Systems and Special Senses':83,
            'Musculoskeletal, Skin and Subcutaneous Tissue':68,
            'Cardiovascular System':61,
            'Gastrointestinal System':55,
            'Reproductive and Endocrine Systems':93,
            'Multisystem Processes and Disorders':68,
            'Biostatistics, Epidemiology and Population Health':34,
            'Social Sciences: Communication and Interpersonal Skills':49,
          }
          expected_competencies={
            'Medical Knowledge: Applying Foundational Science Concepts':446,
            'Patient Care: Diagnosis, including history and physical examination':159,
            'Practice-Based Learning and Improvement':35,
            'Communication and Interpersonal Skills':50,
          }
          con=sqlite3.connect('usmle/data/usmle-step1.db')
          required_tables={'step2_final_items','step2_final_reviews','step2_finalization'}
          tables={r[0] for r in con.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert required_tables.issubset(tables), sorted(required_tables-tables)
          assert con.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          items=con.execute("SELECT candidate_id,payload_json,payload_sha256,audit_sha256 FROM step2_final_items WHERE final_status='FINAL_10_10_PASS'").fetchall()
          reviews=con.execute("SELECT candidate_id,review_json,review_sha256,final_status FROM step2_final_reviews WHERE final_status='FINAL_10_10_PASS'").fetchall()
          assert len(items)==690 and len(reviews)==690
          assert con.execute('SELECT COUNT(*) FROM (SELECT candidate_id FROM step2_final_items GROUP BY candidate_id HAVING COUNT(*)>1)').fetchone()[0]==0
          assert con.execute('SELECT COUNT(*) FROM (SELECT candidate_id FROM step2_final_reviews GROUP BY candidate_id HAVING COUNT(*)>1)').fetchone()[0]==0
          ids={r[0] for r in items}; rids={r[0] for r in reviews}
          assert ids==rids
          assert {qnum(x) for x in ids}==set(range(1,691))
          assert all(sum(1 for cid in ids if qnum(cid)==n)==1 for n in range(681,691))
          reread=0; new=0; payloads=[]
          for cid,pj,ps,ash in items:
              obj=json.loads(pj); payloads.append(obj)
              assert h(obj)==ps, cid
              rr=con.execute('SELECT review_json,review_sha256,final_status FROM step2_final_reviews WHERE candidate_id=?',(cid,)).fetchone()
              assert rr and rr[1]==ash and rr[2]=='FINAL_10_10_PASS', cid
              rev=json.loads(rr[0])
              assert rev.get('review_sha256')==rr[1], cid
              assert obj.get('step2_final_audit',{}).get('review_sha256')==rr[1], cid
              assert len(obj['item']['options'])==5 and len(set(obj['item']['options'].values()))==5, cid
              assert len(obj.get('sources',[]))>=2, cid
              assert all(s.get('section_locator') for s in obj.get('sources',[])), cid
              n=qnum(cid)
              if 681<=n<=690:
                  ca=rev.get('clinical_audit',{})
                  assert rev.get('verdict')=='FINAL_10_10_PASS', cid
                  assert ca.get('status')=='FINAL_10_10_PASS', cid
                  assert ca.get('unresolved_conflicts')==0, cid
                  assert ca.get('source_authority')=='PASS', cid
                  assert ca.get('exact_locator')=='PASS', cid
                  assert ca.get('second_possible_answer')=='PASS_NONE', cid
                  assert ca.get('zero_unsupported_precision')=='PASS', cid
                  assert ca.get('adversarial_second_pass',{}).get('result')=='PASS', cid
                  assert ca.get('source_currentness',{}).get('status')=='PASS', cid
                  assert ca.get('stem')=='PASS' and ca.get('lead_in')=='PASS', cid
                  assert ca.get('correct_answer')=='PASS' and ca.get('rationale')=='PASS' and ca.get('educational_objective')=='PASS', cid
                  assert ca.get('ambiguity')=='PASS' and ca.get('cueing')=='PASS' and ca.get('overlap')=='PASS', cid
                  new+=1
              reread+=1
          assert reread==690 and new==10
          bp=dict(Counter(p['blueprint']['primary_system'] for p in payloads))
          cp=dict(Counter(p['blueprint']['primary_competency'] for p in payloads))
          assert bp==expected_blueprint, bp
          assert cp==expected_competencies, cp
          assert not any('&' in k for k in bp)
          state=json.load(open('usmle/state/step2_final_q0001_q0690.json'))
          audit=json.load(open('usmle/audit/STEP2_FINAL_10_10_Q0001_Q0690.json'))
          assert state==audit
          assert state['audit_id']=='STEP2-FINAL-Q0001-Q0690-20260829'
          assert state['final_status']=='FINAL_10_10_PASS'
          assert state['item_count']==690 and state['step2_final_review_count']==690
          assert state['new_block']['range']=='Q0681-Q0690' and state['new_block']['clinical_audit_files_verified']==10
          assert state['sqlite_integrity_check']=='ok'
          assert state['duplicate_candidate_id_count']==0
          assert state['payload_review_consistency']=='PASS'
          assert state['reread_verified_count']==690
          assert state['new_block_reread_verified_count']==10
          assert state['q0681_q0690_present_exactly_once'] is True
          assert state['contiguous_q0001_q0690'] is True
          assert state['stale_ampersand_category_count']==0
          assert state['wal_checkpoint_result']==[0,0,0]
          assert state['wal_sidecar_present_after_close'] is False
          assert state['shm_sidecar_present_after_close'] is False
          assert set(state['schema_tables_verified'])==required_tables
          assert state['answer_position_new_block']['balanced']=={'A':2,'B':2,'C':2,'D':2,'E':2}
          ordered=sorted(payloads,key=lambda p:qnum(p['candidate_id']))
          new_seq=''.join(p['item']['intended_key'] for p in ordered if 681<=qnum(p['candidate_id'])<=690)
          assert len(new_seq)==10
          assert Counter(new_seq)==Counter({'A':2,'B':2,'C':2,'D':2,'E':2})
          assert state['answer_position_new_block']['sequence']==new_seq
          assert state['answer_position_new_block']['schedule_sha256']==hashlib.sha256(new_seq.encode()).hexdigest()
          assert state['blueprint_counts']==expected_blueprint
          assert state['competency_counts']==expected_competencies
          blob=subprocess.check_output(['git','hash-object','usmle/data/usmle-step1.db'],text=True).strip()
          assert state['pre_authoritative_db_blob']=='6713c18b8787360a1ad0841a4bfbb7f47cbad6eb'
          assert state['post_authoritative_db_blob']==blob
          assert blob!='6713c18b8787360a1ad0841a4bfbb7f47cbad6eb'
          fin=con.execute('SELECT audit_id,item_count,key_schedule_sha256,aggregate_review_sha256 FROM step2_finalization WHERE id=1').fetchone()
          assert fin and fin[0]=='STEP2-FINAL-Q0001-Q0690-20260829' and fin[1]==690
          print(json.dumps({
              'sqlite_integrity_check':'ok',
              'step2_final_items_FINAL_10_10_PASS':len(items),
              'step2_final_reviews_FINAL_10_10_PASS':len(reviews),
              'duplicate_candidate_id_items':0,
              'duplicate_candidate_id_reviews':0,
              'q0681_q0690_present_exactly_once':True,
              'contiguous_q0001_q0690':True,
              'payload_review_consistency':'PASS',
              'reread_verified_count':reread,
              'new_block_reread_verified_count':new,
              'blueprint_counts_exact':True,
              'competency_counts_exact':True,
              'step2_finalization_row_exact':True,
              'state_file_exact':True,
              'stale_ampersand_category_count':0,
              'post_authoritative_db_blob':blob
          },sort_keys=True))
          PY
      - name: Persist authoritative USMLE state
        run: |
          git config user.name 'USMLE Step2 Finalizer'
          git config user.email 'actions@users.noreply.github.com'
          git add -f usmle/data/usmle-step1.db usmle/audit/STEP2_FINAL_10_10_Q0001_Q0690.json usmle/state/step2_final_q0001_q0690.json
          git commit -m 'Finalize USMLE Step 1 Q0681-Q0690 at Step2 10/10'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify persisted main commit and SQLite blob
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python - <<'PY'
          import json, pathlib, sqlite3, subprocess
          state=json.load(open('usmle/state/step2_final_q0001_q0690.json'))
          head_blob=subprocess.check_output(['git','rev-parse','HEAD:usmle/data/usmle-step1.db'],text=True).strip()
          assert head_blob==state['post_authoritative_db_blob'], (head_blob,state['post_authoritative_db_blob'])
          con=sqlite3.connect('usmle/data/usmle-step1.db')
          assert con.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert con.execute("SELECT COUNT(*) FROM step2_final_items WHERE final_status='FINAL_10_10_PASS'").fetchone()[0]==690
          assert con.execute("SELECT COUNT(*) FROM step2_final_reviews WHERE final_status='FINAL_10_10_PASS'").fetchone()[0]==690
          assert con.execute('SELECT COUNT(*) FROM (SELECT candidate_id FROM step2_final_items GROUP BY candidate_id HAVING COUNT(*)>1)').fetchone()[0]==0
          assert con.execute('SELECT COUNT(*) FROM (SELECT candidate_id FROM step2_final_reviews GROUP BY candidate_id HAVING COUNT(*)>1)').fetchone()[0]==0
          fin=con.execute('SELECT audit_id,item_count FROM step2_finalization WHERE id=1').fetchone()
          assert fin==('STEP2-FINAL-Q0001-Q0690-20260829',690), fin
          con.close()
          assert not pathlib.Path('usmle/data/usmle-step1.db-wal').exists()
          assert not pathlib.Path('usmle/data/usmle-step1.db-shm').exists()
          print(json.dumps({'origin_main_matches_head':True,'persisted_db_blob':head_blob,'integrity_check':'ok','items':690,'reviews':690,'duplicates':0,'wal_sidecar':False,'shm_sidecar':False},sort_keys=True))
          PY
