name: USMLE Author Q1271-Q1280

on:
  push:
    branches: [main]
    paths:
      - 'usmle/audit/AUTHOR_TRIGGER_Q1271_Q1280'

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify exact Q1270 canonical pre-state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object usmle/data/usmle-step1.db)" = "cbfe7c4b469fa49555813cffcc6604d2003dcdac"
          python - <<'PY'
          import json
          s=json.load(open('usmle/state/step2_final_q0001_q1270.json'))
          assert s['final_status']=='FINAL_10_10_PASS' and s['item_count']==1270 and s['step2_final_review_count']==1270
          assert s['contiguous_q0001_q1270'] is True and s['post_authoritative_db_blob']=='cbfe7c4b469fa49555813cffcc6604d2003dcdac'
          print('Q1270_PRESTATE=PASS')
          PY
      - name: Regenerate candidate from source of truth
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile usmle/author_q1271_q1280.py usmle/verify_author_q1271_q1280.py
          python usmle/author_q1271_q1280.py
      - name: Full independent author verification from zero
        shell: bash
        run: |
          set -euo pipefail
          python usmle/verify_author_q1271_q1280.py
      - name: Persist frozen candidate only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'USMLE Author QA'
          git config user.email 'actions@users.noreply.github.com'
          git add usmle/batch_specs_1201_1300/10_q1271_q1280_author_20260906.json
          git diff --cached --quiet && { echo 'No candidate change generated'; exit 1; }
          git commit -m 'USMLE: author and verify Q1271-Q1280'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Verify persisted candidate and untouched canonical DB
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          test "$(git hash-object usmle/data/usmle-step1.db)" = "cbfe7c4b469fa49555813cffcc6604d2003dcdac"
          python usmle/verify_author_q1271_q1280.py
          echo "CANDIDATE_PERSISTED=PASS BLOB=$(git hash-object usmle/batch_specs_1201_1300/10_q1271_q1280_author_20260906.json) DB_UNTOUCHED=PASS"
