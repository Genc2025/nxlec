name: Verify Batch 005 Committed DB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-batch005-committed.yml"

permissions:
  contents: read

jobs:
  verify-committed-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Independently verify committed Batch 005 DB
        run: |
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          db='NCLEX_COMMERCIAL_MASTER_CURRENT.db'
          con=sqlite3.connect(db)
          integrity=con.execute('PRAGMA integrity_check').fetchone()[0]
          total=con.execute('SELECT COUNT(*) FROM questions').fetchone()[0]
          ready=con.execute('SELECT COUNT(*) FROM questions WHERE commercial_release_ready=1').fetchone()[0]
          gate=con.execute("SELECT value FROM bank_metadata WHERE key='commercial_release_gate'").fetchone()
          meta=con.execute("SELECT value FROM bank_metadata WHERE key='batch005_q0782_q0831_rule1_final_gate'").fetchone()
          final=con.execute("SELECT COUNT(*) FROM question_final_gate WHERE question_uid BETWEEN 'V2-Q0782' AND 'V2-Q0831' AND final_status='FINAL_QA_PASS'").fetchone()[0]
          manual=con.execute("SELECT COUNT(*) FROM rule1_manual_audit WHERE question_uid BETWEEN 'V2-Q0782' AND 'V2-Q0831' AND criteria_passed_count=11 AND second_pass='PASS' AND final_disposition='FINAL_QA_PASS'").fetchone()[0]
          evidence=con.execute("SELECT COUNT(*) FROM rule1_batch005_reaudit_evidence WHERE question_uid BETWEEN 'V2-Q0782' AND 'V2-Q0831' AND criteria_passed_count=11 AND second_pass='PASS' AND final_disposition='FINAL_QA_PASS'").fetchone()[0]
          bad=con.execute("SELECT COUNT(*) FROM question_final_gate WHERE question_uid BETWEEN 'V2-Q0782' AND 'V2-Q0831' AND (source_verified<>1 OR blueprint_verified<>1 OR question_quality_verified<>1 OR correct_answer_verified<>1 OR distractors_verified<>1 OR explanation_verified<>1 OR currentness_verified<>1 OR independent_qa_passed<>1 OR no_unresolved_conflict<>1)").fetchone()[0]
          source_rows=con.execute("SELECT q.question_uid,q.source_url,q.source_detail,e.source_url,e.source_locator,e.source_version,e.source_authority FROM questions q JOIN rule1_batch005_reaudit_evidence e USING(question_uid) WHERE q.question_uid BETWEEN 'V2-Q0782' AND 'V2-Q0831' ORDER BY q.question_uid").fetchall()
          source_ok=0; secondary=0
          for uid,qurl,qdetail,eurl,locator,version,authority in source_rows:
              if qurl==eurl and qurl.startswith('https://') and locator.casefold() in qdetail.casefold() and version.casefold() in qdetail.casefold() and '2026-08-15' in qdetail:
                  source_ok += 1
              secondary += int(authority=='SECONDARY_EXCEPTION')
          option_rows=con.execute("SELECT question_uid,option_length_metrics_json FROM question_final_gate WHERE question_uid BETWEEN 'V2-Q0782' AND 'V2-Q0831' ORDER BY question_uid").fetchall()
          option_ok=0; max_ratio=0.0; max_dev=0.0
          for uid,raw in option_rows:
              m=json.loads(raw)
              max_ratio=max(max_ratio,m['max_min_ratio']); max_dev=max(max_dev,m['correct_deviation_from_distractor_mean'])
              if m['max_min_ratio']<=1.15 and m['correct_deviation_from_distractor_mean']<=0.10 and m['correct_unique_length_extreme'] is False and m.get('artificial_padding') is False:
                  option_ok += 1
          signatures={'V2-Q0782':('position-triggered','BPPV'),'V2-Q0784':('20 mm Hg','10 mm Hg'),'V2-Q0791':('4 to 5 half-lives','drug-specific'),'V2-Q0793':('aspiration','fasting'),'V2-Q0794':('1 to 1.5 inches','hands'),'V2-Q0795':('delirium','multicomponent'),'V2-Q0796':('calcium','bone'),'V2-Q0799':('active listening','culture'),'V2-Q0801':('prolonged grief','impairment'),'V2-Q0804':('muscle','report'),'V2-Q0811':('ceiling','respiratory'),'V2-Q0812':('horizontal evacuation','smoke compartment'),'V2-Q0813':('several days','individual'),'V2-Q0817':('Contact Precautions','gown'),'V2-Q0828':('diverticulitis','CT'),'V2-Q0829':('cholecystitis','ultrasound')}
          corrected=0
          for uid,(a,b) in signatures.items():
              r=con.execute('SELECT stem,item_data_json,rationale FROM questions WHERE question_uid=?',(uid,)).fetchone()
              hay=' '.join(r).casefold(); corrected += int(a.casefold() in hay and b.casefold() in hay)
          q799=con.execute("SELECT category_id,client_need,difficulty FROM questions WHERE question_uid='V2-Q0799'").fetchone()
          q813=con.execute("SELECT category_id,client_need,difficulty FROM questions WHERE question_uid='V2-Q0813'").fetchone()
          q829=' '.join(con.execute("SELECT stem,item_data_json,rationale FROM questions WHERE question_uid='V2-Q0829'").fetchone()).casefold()
          con.close()
          report=Path('FINAL_QA_BATCH005_Q0782_Q0831_RULE1_10OF10.md')
          assert integrity=='ok', integrity
          assert total==3525, total
          assert ready==0, ready
          assert gate and gate[0]=='CLOSED_PENDING_FULL_BANK_CLINICAL_CURRENTNESS_SOURCE_LICENSING_AND_RELEASE_QA', gate
          assert meta and meta[0]=='PASS_50_OF_50_REAL_REAUDIT_SECOND_PASS_11_OF_11_2026_08_15', meta
          assert final==50 and manual==50 and evidence==50 and bad==0
          assert len(source_rows)==50 and source_ok==50 and secondary==1
          assert len(option_rows)==50 and option_ok==50
          assert corrected==16
          assert q799==(5,'Psychosocial Integrity','easy'), q799
          assert q813==(3,'Safety & Infection Prevention and Control','easy'), q813
          assert 'cholecystitis' in q829 and 'ultrasound' in q829
          assert report.exists() and 'Final Batch 005 disposition: **FINAL_QA_PASS 50/50**' in report.read_text(encoding='utf-8')
          print(f'BATCH005_COMMITTED_DB_INDEPENDENTLY_VERIFIED integrity={integrity} total={total} final={final}/50 manual11={manual}/50 evidence11={evidence}/50 sources={source_ok}/50 option_qc={option_ok}/50 corrections={corrected}/16 secondary={secondary}/1 bad={bad} max_ratio={max_ratio:.4f} max_dev={max_dev:.4f} ready={ready}')
          PY
