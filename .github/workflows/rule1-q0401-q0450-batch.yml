name: Rule1 final batch Q0401-Q0450

on:
  push:
    branches:
      - rule1-q0401-q0450-staging
    paths:
      - .github/workflows/rule1-q0401-q0450-batch.yml

permissions:
  contents: write

jobs:
  batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate and write canonical batch in one SQLite transaction
        run: python3 tools/rule1_batch_q0401_q0450.py

      - name: Verify output diff scope
        run: |
          python3 - <<'PY'
          import subprocess
          expected={"NCLEX_CANONICAL.db","RULE1_BATCH_Q0401_Q0450_REPORT.json"}
          lines=subprocess.check_output(["git","status","--porcelain"], text=True).splitlines()
          actual={line[3:] for line in lines if line.strip()}
          print("OUTPUT_FILES=", sorted(actual))
          if actual != expected:
              raise SystemExit(f"Unexpected output diff scope: {sorted(actual)}")
          PY

      - name: Commit only canonical DB and batch report to staging
        run: |
          git config user.name 'OpenAI GitHub Connector'
          git config user.email 'github-connector@openai.com'
          git add NCLEX_CANONICAL.db RULE1_BATCH_Q0401_Q0450_REPORT.json
          git commit -m 'Stage canonical batch V2-Q0401-V2-Q0450 400 to 450'
          git push origin rule1-q0401-q0450-staging
