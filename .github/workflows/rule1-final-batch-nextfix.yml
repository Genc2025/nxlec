name: Rule1 final Q0351-Q0400 batch with inspect-next ordering
on:
  push:
    branches: [rule1-q0351-q0400-staging]
    paths:
      - '.github/workflows/rule1-final-batch-nextfix.yml'
permissions:
  contents: write
concurrency:
  group: rule1-q0351-q0400-nextfix
  cancel-in-progress: false
jobs:
  batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Align next-item check with rule1-inspect-next
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/rule1_batch_q0351_q0400.py')
          s=p.read_text(encoding='utf-8')
          old="SELECT question_uid FROM questions WHERE source_bank='v2' ORDER BY stable_sort_key ASC, source_id ASC"
          new="SELECT question_uid FROM questions WHERE source_bank='v2' ORDER BY source_id ASC"
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one next-item query to patch, found {s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8')
          print('NEXT_ITEM_ORDER=source_id ASC (matches rule1-inspect-next)')
          PY
      - name: Revalidate all gates and apply one SQLite transaction 350 to 400
        run: python3 tools/rule1_batch_q0351_q0400.py
      - name: Restore local checker and commit only staging DB plus PASS report
        shell: bash
        run: |
          git checkout -- tools/rule1_batch_q0351_q0400.py
          test "$(python3 -c "import json; print(json.load(open('RULE1_BATCH_Q0351_Q0400_REPORT.json'))['status'])")" = PASS
          git config user.name 'OpenAI GitHub Connector'
          git config user.email 'github-connector@openai.com'
          git add NCLEX_CANONICAL.db RULE1_BATCH_Q0351_Q0400_REPORT.json
          changed=$(git diff --cached --name-only)
          printf '%s\n' "$changed"
          test "$changed" = $'NCLEX_CANONICAL.db\nRULE1_BATCH_Q0351_Q0400_REPORT.json'
          unstaged=$(git diff --name-only)
          test -z "$unstaged"
          git commit -m 'Stage canonical batch V2-Q0351-V2-Q0400 350 to 400'
          git push origin rule1-q0351-q0400-staging
