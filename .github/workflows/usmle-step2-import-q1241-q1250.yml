name: USMLE Step2 Import Q1241-Q1250

on:
  push:
    branches: [main]
    paths:
      - 'usmle/audit/STEP2_IMPORT_TRIGGER_Q1241_Q1250'

permissions:
  contents: write

concurrency:
  group: usmle-step2-canonical-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify exact production preconditions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object usmle/data/usmle-step1.db)" = "ec4393c3699a68616ea2877b464916b0db680328"
          test "$(git hash-object usmle/step2_import_q1241_q1250.py)" = "e2b573a63b4932908c4cc9045f0b7dbd2dcb7270"
          test "$(git hash-object usmle/batch_specs_1201_1300/07_q1241_q1250_author_20260906.json)" = "74a9f64982189d58f0bff5e5204ff39cff931fdb"
          test "$(git hash-object usmle/audit/Q1241_Q1250_FINAL_QA_PASS.json)" = "3cdb253ed2e825593c3aba5b44bec7ea940a6a35"
          python - <<'PY'
          import json,pathlib,sqlite3
          s=json.loads(pathlib.Path('usmle/state/step2_final_q0001_q1240.json').read_text())
          m=json.loads(pathlib.Path('usmle/audit/Q1241_Q1250_FINAL_QA_PASS.json').read_text())
          assert s['final_status']=='FINAL_10_10_PASS' and s['item_count']==1240 and s['step2_final_review_count']==1240
          assert s['contiguous_q0001_q1240'] is True and s['post_authoritative_db_blob']=='ec4393c3699a68616ea2877b464916b0db680328'
          assert m['status']=='FINAL_QA_PASS' and m['final_qa_verdict']=='FINAL_QA_PASS_NO_MATERIAL_DEFECT'
          assert m['production_import_ready'] is True and m['production_db_modified'] is False
          assert m['unresolved_defects']==[] and m['suggested_changes']==[]
          con=sqlite3.connect(pathlib.Path('usmle/data/usmle-step1.db').resolve().as_uri()+'?mode=ro&immutable=1',uri=True)
          assert con.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert con.execute("SELECT COUNT(*) FROM step2_final_items WHERE final_status='FINAL_10_10_PASS'").fetchone()[0]==1240
          assert con.execute("SELECT COUNT(*) FROM step2_final_reviews WHERE final_status='FINAL_10_10_PASS'").fetchone()[0]==1240
          con.close()
          print('PRODUCTION_PRECONDITIONS=PASS COUNT=1240')
          PY
      - name: Compile transactional importer
        run: python -m py_compile usmle/step2_import_q1241_q1250.py
      - name: Import Q1241-Q1250 transactionally
        shell: bash
        run: |
          set -euo pipefail
          python usmle/step2_import_q1241_q1250.py | tee /tmp/q1241-q1250-import-result.json
      - name: Independent post-import verification before persist
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,re,sqlite3,subprocess
          db=pathlib.Path('usmle/data/usmle-step1.db')
          state=pathlib.Path('usmle/state/step2_final_q0001_q1250.json')
          final=pathlib.Path('usmle/audit/STEP2_FINAL_10_10_Q0001_Q1250.json')
          s=json.loads(state.read_text()); f=json.loads(final.read_text())
          assert s['final_status']=='FINAL_10_10_PASS'
          assert s['item_count']==1250 and s['step2_final_review_count']==1250
          assert s['contiguous_q0001_q1250'] is True and s['q1241_q1250_present_exactly_once'] is True
          assert s['sqlite_integrity_check']=='ok' and s['payload_review_consistency']=='PASS'
          assert s['new_block']['item_count']==10 and s['new_block']['fresh_item_by_item_audit'] is True and s['new_block']['canonical_duplicate_rescan'] is True
          assert s['new_block']['candidate_batch_blob']=='74a9f64982189d58f0bff5e5204ff39cff931fdb'
          assert s['new_block']['final_qa_manifest_blob']=='3cdb253ed2e825593c3aba5b44bec7ea940a6a35'
          assert s['answer_position_new_block']['balanced']=={'A':2,'B':2,'C':2,'D':2,'E':2}
          assert s['answer_position_new_block']['sequence']=='BDAECAECDB'
          assert s['blueprint_increment_new_block']=={'Blood & Lymphoreticular/Immune Systems':5,'Musculoskeletal, Skin & Subcutaneous Tissue':5}
          assert s['competency_increment_new_block']=={'Patient Care: Diagnosis':5,'Medical Knowledge: Applying Foundational Science Concepts':5}
          assert f['production_import_manifest_status']=='FINAL_QA_PASS' and f['production_import_completed'] is True
          assert f['final_verdict']=='FINAL_10_10_PASS_NO_MATERIAL_DEFECT'
          blob=subprocess.check_output(['git','hash-object',str(db)],text=True).strip()
          assert blob==s['post_authoritative_db_blob'] and blob!='ec4393c3699a68616ea2877b464916b0db680328'
          assert hashlib.sha256(db.read_bytes()).hexdigest()==s['post_authoritative_db_sha256']
          con=sqlite3.connect(db.resolve().as_uri()+'?mode=ro&immutable=1',uri=True)
          assert con.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          ic=con.execute("SELECT COUNT(*) FROM step2_final_items WHERE final_status='FINAL_10_10_PASS'").fetchone()[0]
          rc=con.execute("SELECT COUNT(*) FROM step2_final_reviews WHERE final_status='FINAL_10_10_PASS'").fetchone()[0]
          assert (ic,rc)==(1250,1250)
          rows=con.execute("SELECT candidate_id,payload_json FROM step2_final_items WHERE final_status='FINAL_10_10_PASS'").fetchall()
          nums=[]; new={}
          for cid,pj in rows:
              m=re.search(r'DIRECT-(\d{4})',cid); assert m,cid; n=int(m.group(1)); nums.append(n)
              if 1241<=n<=1250: new[n]=json.loads(pj)
          assert set(nums)==set(range(1,1251)) and len(nums)==len(set(nums))==1250
          assert set(new)==set(range(1241,1251))
          assert ''.join(new[n]['item']['intended_key'] for n in range(1241,1251))=='BDAECAECDB'
          allowed_sys={'Blood & Lymphoreticular/Immune Systems','Musculoskeletal, Skin & Subcutaneous Tissue'}
          allowed_comp={'Patient Care: Diagnosis','Medical Knowledge: Applying Foundational Science Concepts'}
          for n,p in new.items():
              bp=p['blueprint']; key=p['item']['intended_key']; de=p['explanation']['distractor_explanations']; em={e['option']:e for e in p['evidence_map']}
              assert bp['primary_system'] in allowed_sys and bp['primary_competency'] in allowed_comp
              assert bp['official_outline_path']==[bp['primary_system']] and bp.get('internal_content_path')
              assert set(p['item']['options'])==set('ABCDE') and len(set(p['item']['options'].values()))==5
              assert p['step2_final_audit']['final_10_10_gate']=='FINAL_10_10_PASS'
              assert p['step2_final_audit']['canonical_duplicate_gate_passed'] is True and p['step2_final_audit']['second_answer_attack_passed'] is True
              assert set(em)==set('ABCDE')
              for L in 'ABCDE':
                  assert em[L]['claim']==de[L]
                  assert em[L]['direct_or_inference']==('direct' if L==key else 'inference')
                  if L!=key: assert 'It is not selected because it does not account for' in de[L]
          con.close()
          assert not pathlib.Path(str(db)+'-wal').exists() and not pathlib.Path(str(db)+'-shm').exists()
          print('PRE_PERSIST_VERIFY=PASS COUNT=1250 REVIEWS=1250 BLOB='+blob)
          PY
      - name: Persist authoritative Q1250 canonical state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'USMLE Production Finalizer'
          git config user.email 'actions@users.noreply.github.com'
          git add usmle/data/usmle-step1.db usmle/state/step2_final_q0001_q1250.json usmle/audit/STEP2_FINAL_10_10_Q0001_Q1250.json
          git diff --cached --quiet && { echo 'No production changes to persist'; exit 1; }
          git commit -m 'USMLE: finalize canonical Q0001-Q1250'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Verify persisted main from scratch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          import hashlib,json,pathlib,re,sqlite3,subprocess
          db=pathlib.Path('usmle/data/usmle-step1.db')
          s=json.loads(pathlib.Path('usmle/state/step2_final_q0001_q1250.json').read_text())
          f=json.loads(pathlib.Path('usmle/audit/STEP2_FINAL_10_10_Q0001_Q1250.json').read_text())
          assert s['final_status']=='FINAL_10_10_PASS' and s['item_count']==1250 and s['step2_final_review_count']==1250
          assert s['contiguous_q0001_q1250'] is True and s['q1241_q1250_present_exactly_once'] is True
          assert f['final_verdict']=='FINAL_10_10_PASS_NO_MATERIAL_DEFECT' and f['production_import_completed'] is True
          blob=subprocess.check_output(['git','hash-object',str(db)],text=True).strip()
          assert blob==s['post_authoritative_db_blob']
          assert hashlib.sha256(db.read_bytes()).hexdigest()==s['post_authoritative_db_sha256']
          con=sqlite3.connect(db.resolve().as_uri()+'?mode=ro&immutable=1',uri=True)
          assert con.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert con.execute("SELECT COUNT(*) FROM step2_final_items WHERE final_status='FINAL_10_10_PASS'").fetchone()[0]==1250
          assert con.execute("SELECT COUNT(*) FROM step2_final_reviews WHERE final_status='FINAL_10_10_PASS'").fetchone()[0]==1250
          rows=con.execute("SELECT candidate_id FROM step2_final_items WHERE final_status='FINAL_10_10_PASS'").fetchall()
          nums=[]
          for (cid,) in rows:
              m=re.search(r'DIRECT-(\d{4})',cid); assert m,cid; nums.append(int(m.group(1)))
          assert set(nums)==set(range(1,1251)) and len(nums)==len(set(nums))==1250
          con.close()
          assert not pathlib.Path(str(db)+'-wal').exists() and not pathlib.Path(str(db)+'-shm').exists()
          print('PERSISTED_MAIN_VERIFY=PASS COUNT=1250 REVIEWS=1250 BLOB='+blob)
          PY
