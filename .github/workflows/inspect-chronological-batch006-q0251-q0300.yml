name: Inspect chronological Batch 006 Q0251-Q0300

on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-chronological-batch006-q0251-q0300.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump Q0251-Q0300
        run: |
          python - <<'PY'
          import sqlite3,json
          con=sqlite3.connect('NCLEX_COMMERCIAL_MASTER_CURRENT.db')
          rows=con.execute("SELECT question_uid,source_id,category_id,client_need,difficulty,stem,item_data_json,correct_answer_json,rationale,source_name,source_detail,source_url,clinical_qa_status FROM questions WHERE question_uid BETWEEN 'V2-Q0251' AND 'V2-Q0300' ORDER BY question_uid").fetchall()
          print('COUNT',len(rows))
          cols=['question_uid','source_id','category_id','client_need','difficulty','stem','item_data_json','correct_answer_json','rationale','source_name','source_detail','source_url','clinical_qa_status']
          for r in rows:
              print('ITEM '+json.dumps(dict(zip(cols,r)),ensure_ascii=False,separators=(',',':')))
          con.close()
          PY
