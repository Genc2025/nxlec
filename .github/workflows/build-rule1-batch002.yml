name: Rule 1 Batch 002 Q0051-Q0100

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/apply_batch002_rule1_final_gate.py"
      - "data/rule1_manual_audit_batch002_q0051_q0100.json"
      - "data/clinical_overrides_rule1_batch002_source_upgrades.json"
      - ".github/workflows/build-rule1-batch002.yml"

permissions:
  contents: write

jobs:
  rule1-batch002:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decode staged override payloads
        run: |
          shopt -s nullglob
          for file in data/clinical_overrides_*.json.gz.b64; do
            json_file="${file%.gz.b64}"
            [[ -f "$json_file" ]] && continue
            base64 --decode "$file" | gzip -dc > "$json_file"
          done
          for file in data/clinical_overrides_*.b64; do
            [[ "$file" == *.json.gz.b64 ]] && continue
            json_file="${file%.b64}.json"
            [[ -f "$json_file" ]] && continue
            base64 --decode "$file" > "$json_file"
          done

      - name: Rebuild Wave 27 manifest
        run: python tools/rebuild_wave27_manifest.py
      - name: Build master DB
        run: python tools/build_nclex_master.py
      - name: Enforce commercial hard gate
        run: python tools/enforce_commercial_gate.py
      - name: Enforce strict governance baseline
        run: python tools/enforce_strict_question_gate.py
      - name: Apply Wave 26 option balance
        run: python tools/apply_wave26_option_balance.py
      - name: Apply Rule 1 Batch 001
        run: python tools/apply_batch001_final_gate.py
      - name: Apply Rule 1 Batch 002
        run: python tools/apply_batch002_rule1_final_gate.py
      - name: Apply Wave 25 gate
        run: python tools/apply_wave25_final_gate.py
      - name: Apply Wave 26 gate
        run: python tools/apply_wave26_manual_final_gate.py
      - name: Apply Wave 27 gate
        run: python tools/apply_wave27_manual_final_gate.py
      - name: Export pending audit
        run: python tools/export_pending_audit.py

      - name: Verify Rule 1 Batch 002 and DB
        run: |
          python - <<'PY'
          import sqlite3
          db='NCLEX_COMMERCIAL_MASTER_CURRENT.db'
          con=sqlite3.connect(db)
          integrity=con.execute('PRAGMA integrity_check').fetchone()[0]
          total=con.execute('SELECT COUNT(*) FROM questions').fetchone()[0]
          ready=con.execute('SELECT COUNT(*) FROM questions WHERE commercial_release_ready=1').fetchone()[0]
          meta=con.execute("SELECT value FROM bank_metadata WHERE key='batch002_q0051_q0100_rule1_final_gate'").fetchone()
          passed=con.execute("SELECT COUNT(*) FROM question_final_gate WHERE question_uid BETWEEN 'V2-Q0051' AND 'V2-Q0100' AND final_status='FINAL_QA_PASS'").fetchone()[0]
          manual=con.execute("SELECT COUNT(*) FROM rule1_manual_audit WHERE question_uid BETWEEN 'V2-Q0051' AND 'V2-Q0100' AND semantic_result='PASS' AND second_pass=1").fetchone()[0]
          bad=con.execute("SELECT COUNT(*) FROM question_final_gate WHERE question_uid BETWEEN 'V2-Q0051' AND 'V2-Q0100' AND (source_verified<>1 OR blueprint_verified<>1 OR question_quality_verified<>1 OR correct_answer_verified<>1 OR distractors_verified<>1 OR explanation_verified<>1 OR currentness_verified<>1 OR independent_qa_passed<>1 OR no_unresolved_conflict<>1)").fetchone()[0]
          gate=con.execute("SELECT value FROM bank_metadata WHERE key='commercial_release_gate'").fetchone()
          con.close()
          assert integrity=='ok', integrity
          assert total==3525, total
          assert ready==0, ready
          assert meta and meta[0]=='PASS_50_OF_50_2026_08_14_RULE1_ITEM_BY_ITEM', meta
          assert passed==50, passed
          assert manual==50, manual
          assert bad==0, bad
          assert gate and gate[0]=='CLOSED_PENDING_FULL_BANK_CLINICAL_CURRENTNESS_SOURCE_LICENSING_AND_RELEASE_QA', gate
          print(f'RULE1_BATCH002_VERIFIED integrity={integrity} total={total} pass={passed}/50 manual={manual}/50 bad={bad} ready={ready}')
          PY

      - name: Commit integrated master and Rule 1 report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NCLEX_COMMERCIAL_MASTER_CURRENT.db NCLEX_COMMERCIAL_MASTER_CURRENT_AUDIT.md FINAL_QA_BATCH002_Q0051_Q0100_RULE1_10OF10.md data/pending_audit_next.json data/clinical_overrides_*.json
          if git diff --cached --quiet; then
            echo "Rule 1 Batch 002 outputs already current"
          else
            git commit -m "Integrate Rule 1 Batch 002 Q0051-Q0100 [skip ci]"
            git push
          fi
