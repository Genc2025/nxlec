name: USMLE Step2 Import Approved Q0631-Q0640

on:
  push:
    branches: [main]
    paths:
      - 'usmle/audit/STEP2_FINALIZE_TRIGGER_Q0631_Q0640'

permissions:
  contents: write

concurrency:
  group: usmle-step2-import-q0631-q0640
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Package and insert only individually approved Q0631-Q0640
        run: python usmle/step2_import_q0631_q0640.py
      - name: Independently verify authoritative SQLite
        run: |
          python - <<'PY'
          import hashlib, json, re, sqlite3
          from collections import Counter
          def canon(o): return json.dumps(o,sort_keys=True,separators=(',',':'),ensure_ascii=False)
          def h(o): return hashlib.sha256(canon(o).encode()).hexdigest()
          def qnum(cid):
              m=re.search(r'DIRECT-(\d{4})',cid or '')
              assert m, cid
              return int(m.group(1))
          con=sqlite3.connect('usmle/data/usmle-step1.db')
          assert con.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          items=con.execute("SELECT candidate_id,payload_json,payload_sha256,audit_sha256 FROM step2_final_items WHERE final_status='FINAL_10_10_PASS'").fetchall()
          reviews=con.execute("SELECT candidate_id,review_json,review_sha256,final_status FROM step2_final_reviews WHERE final_status='FINAL_10_10_PASS'").fetchall()
          assert len(items)==640 and len(reviews)==640
          assert con.execute('SELECT COUNT(*) FROM (SELECT candidate_id FROM step2_final_items GROUP BY candidate_id HAVING COUNT(*)>1)').fetchone()[0]==0
          assert con.execute('SELECT COUNT(*) FROM (SELECT candidate_id FROM step2_final_reviews GROUP BY candidate_id HAVING COUNT(*)>1)').fetchone()[0]==0
          ids={r[0] for r in items}; rids={r[0] for r in reviews}
          assert ids==rids
          assert {qnum(x) for x in ids}==set(range(1,641))
          reread=0; new=0; payloads=[]
          for cid,pj,ps,ash in items:
              obj=json.loads(pj); payloads.append(obj)
              assert h(obj)==ps, cid
              rr=con.execute('SELECT review_json,review_sha256,final_status FROM step2_final_reviews WHERE candidate_id=?',(cid,)).fetchone()
              assert rr and rr[1]==ash and rr[2]=='FINAL_10_10_PASS', cid
              rev=json.loads(rr[0])
              assert rev.get('review_sha256')==rr[1], cid
              assert obj.get('step2_final_audit',{}).get('review_sha256')==rr[1], cid
              assert len(obj['item']['options'])==5 and len(set(obj['item']['options'].values()))==5, cid
              assert all(s.get('section_locator') and s.get('section_locator')!='Relevant claim-specific disease/mechanism section' for s in obj.get('sources',[])), cid
              n=qnum(cid)
              if 631<=n<=640:
                  assert rev.get('verdict')=='FINAL_10_10_PASS', cid
                  assert rev.get('clinical_audit',{}).get('status')=='FINAL_10_10_PASS', cid
                  assert rev.get('clinical_audit',{}).get('unresolved_conflicts')==0, cid
                  new+=1
              reread+=1
          assert reread==640 and new==10
          expected_blueprint={
            'Human Development':14,
            'Respiratory and Renal/Urinary Systems':83,
            'Blood, Lymphoreticular and Immune Systems':70,
            'Behavioral Health, Nervous Systems and Special Senses':76,
            'Musculoskeletal, Skin and Subcutaneous Tissue':64,
            'Cardiovascular System':57,
            'Gastrointestinal System':50,
            'Reproductive and Endocrine Systems':88,
            'Multisystem Processes and Disorders':63,
            'Biostatistics, Epidemiology and Population Health':31,
            'Social Sciences: Communication and Interpersonal Skills':44
          }
          expected_competencies={
            'Medical Knowledge: Applying Foundational Science Concepts':426,
            'Patient Care: Diagnosis, including history and physical examination':139,
            'Practice-Based Learning and Improvement':31,
            'Communication and Interpersonal Skills':44
          }
          bp=dict(Counter(p['blueprint']['primary_system'] for p in payloads))
          cp=dict(Counter(p['blueprint']['primary_competency'] for p in payloads))
          assert bp==expected_blueprint, bp
          assert cp==expected_competencies, cp
          assert not any('&' in k for k in bp)
          state=json.load(open('usmle/state/step2_final_q0001_q0640.json'))
          assert state['item_count']==640
          assert state['step2_final_review_count']==640
          assert state['sqlite_integrity_check']=='ok'
          assert state['duplicate_candidate_id_count']==0
          assert state['payload_review_consistency']=='PASS'
          assert state['reread_verified_count']==640
          assert state['new_block_reread_verified_count']==10
          assert state['stale_ampersand_category_count']==0
          assert state['answer_position_new_block']['balanced']=={'A':2,'B':2,'C':2,'D':2,'E':2}
          assert state['blueprint_counts']==expected_blueprint
          assert state['competency_counts']==expected_competencies
          fin=con.execute('SELECT audit_id,item_count,key_schedule_sha256,aggregate_review_sha256 FROM step2_finalization WHERE id=1').fetchone()
          assert fin and fin[0]=='STEP2-FINAL-Q0001-Q0640-20260827' and fin[1]==640
          print(json.dumps({
              'sqlite_integrity_check':'ok',
              'step2_final_items_FINAL_10_10_PASS':len(items),
              'step2_final_reviews_FINAL_10_10_PASS':len(reviews),
              'duplicate_candidate_id_items':0,
              'duplicate_candidate_id_reviews':0,
              'q0631_q0640_present_exactly_once':True,
              'payload_review_consistency':'PASS',
              'reread_verified_count':reread,
              'new_block_reread_verified_count':new,
              'blueprint_counts_exact':True,
              'competency_counts_exact':True,
              'step2_finalization_row_exact':True,
              'stale_ampersand_category_count':0
          },sort_keys=True))
          PY
      - name: Persist authoritative USMLE state
        run: |
          git config user.name 'USMLE Step2 Finalizer'
          git config user.email 'actions@users.noreply.github.com'
          git add -f usmle/data/usmle-step1.db usmle/audit/STEP2_FINAL_10_10_Q0001_Q0640.json usmle/state/step2_final_q0001_q0640.json
          git commit -m 'Finalize USMLE Step 1 Q0631-Q0640 at Step2 10/10'
          git pull --rebase origin main
          git push origin HEAD:main
